const SEC=["Ch 1 \u00b7 Introduction to Immunity & the Immune System", "Ch 2 \u00b7 Antigens & the MHC", "Ch 3 \u00b7 Innate Immunity", "Ch 4 \u00b7 Adaptive Immunity", "Ch 5 \u00b7 Antibody Structure & Function", "Ch 6 \u00b7 Cytokines", "Ch 7 \u00b7 Complement System"];
const Q=[{"id": 0, "s": 0, "im": "", "q": "Which of the following can be attributed to Pasteur?", "c": "First attenuated vaccines", "w": ["Discovery of opsonins", "Observation of phagocytosis", "Theory of humoral immunity"], "x": "<b>Answer key: c. First attenuated vaccines</b><br><b>Why (from the chapter):</b> In this manner, the first attenuated vaccine was discovered; this event can be considered the birth of immunology. Attenuation, or change, means to make a pathogen less virulent; it takes place through heat, aging, or chemical means. The study of immunology has given us the ability to prevent diseases such as smallpox, polio, diphtheria, and measles through the development of vaccines.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Theory of humoral immunity</b> — The theory of humoral immunity was thus born and sparked a long-lasting dispute over the relative importance of cellular versus humoral immunity.</li></ul>", "r": "Book p. 3", "l": ""}, {"id": 1, "s": 0, "im": "", "q": "Which WBC is capable of further differentiation in tissues?", "c": "Monocyte", "w": ["Neutrophil", "Eosinophil", "Basophil"], "x": "<b>Answer key: d. Monocyte</b><br><b>Why (from the chapter):</b> The transition from monocyte to macrophage in the tissues is characterized by progressive cellular enlargement to between 25 and 80 µm. Unlike monocytes, macrophages contain no peroxidase. Tissue distribution appears to be a random phenomenon.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Neutrophil</b> — Refer to Figure 1–2 for a simplified scheme of blood cell development, known as hematopoiesis. /FVUSPQIJMT The neutrophil, or polymorphonuclear neutrophilic (PMN) leukocyte, represents approximately 50% to 75% of the total peripheral WBCs in adults. These are around 10 to 15 µm in diameter with a nu</li><li><b>Basophil</b> — Eosinophils are able to neutralize basophil and mast cell products.</li></ul>", "r": "Book p. 6", "l": ""}, {"id": 2, "s": 0, "im": "", "q": "The cells that Metchnikoff first observed are associated with which phenomenon?", "c": "Innate immunity", "w": ["Adaptive immunity", "Humoral immunity", "Specific immunity"], "x": "<b>Answer key: a. Innate immunity</b><br><b>Why (from the chapter):</b> The first four types are all part of innate immunity. Phagocytic cells are key to innate immunity, but they are also important in processing antigens for the adaptive response.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Adaptive immunity</b> — Lymphocytes arise from CLPs and form the basis of the adaptive immune response.</li><li><b>Humoral immunity</b> — He observed that certain humoral, or circulating, factors called opsonins acted to coat bacteria so that they became more susceptible to ingestion by phagocytic cells. These serum factors include specific proteins known as antibodies, as well as other factors called acutephase reactants that increas</li><li><b>Specific immunity</b> — He observed that certain humoral, or circulating, factors called opsonins acted to coat bacteria so that they became more susceptible to ingestion by phagocytic cells. These serum factors include specific proteins known as antibodies, as well as other factors called acutephase reactants that increas</li></ul>", "r": "Book p. 4", "l": ""}, {"id": 3, "s": 0, "im": "", "q": "Where are all undifferentiated lymphocytes made?", "c": "Bone marrow", "w": ["Spleen", "Thymus", "Lymph nodes"], "x": "<b>Answer key: a. Bone marrow</b><br><b>Why (from the chapter):</b> Primary organs include the bone marrow and the thymus. B cells remain in the environment provided by bone marrow stromal cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Spleen</b> — Secondary Lymphoid Organs Once lymphocytes mature in the primary organs, they are released and make their way to secondary lymphoid organs, which include the spleen, lymph nodes, cutaneous-associated The spleen, the largest secondary lymphoid organ, has a length of approximately 12 cm and weighs 150</li><li><b>Thymus</b> — The bone marrow and thymus are considered the primary lymphoid organs where maturation of B lymphocytes and T lymphocytes takes place, respectively.</li><li><b>Lymph nodes</b> — As a result, lymphocytes are able to recirculate continuously between lymph nodes and the peripheral blood.</li></ul>", "r": "Book pp. 7–9", "l": ""}, {"id": 4, "s": 0, "im": "", "q": "Which of the following statements is true of NK cells?", "c": "They kill target cells without prior exposure to them.", "w": ["They rely upon memory for antigen recognition.", "They have the same CD groups as B cells.", "They are found mainly in lymph nodes."], "x": "<b>Answer key: d. They kill target cells without prior exposure to them.</b><br><b>Why (from the chapter):</b> They can kill virally infected or cancerous target cells without previous exposure to them. • The bone marrow and the thymus are considered primary lymphoid organs. No prior exposure is required and the response lacks memory and specificity.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They rely upon memory for antigen recognition.</b> — When exposed to an antigen, plasma cells (Fig. 1–12), which actively secrete antibodies, and memory cells, which are just a step away from forming plasma cells, are formed.</li><li><b>They are found mainly in lymph nodes.</b> — Accumulation of lymphocytes and other cells causes the lymph nodes to become enlarged, a condition known as lymphadenopathy.</li></ul>", "r": "Book pp. 4–12", "l": ""}, {"id": 5, "s": 0, "im": "", "q": "Which cell is the most potent phagocytic cell in the tissue?", "c": "Dendritic cell", "w": ["Neutrophil", "Eosinophil", "Basophil"], "x": "<b>Answer key: b. Dendritic cell</b><br><b>Why (from the chapter):</b> Dendritic cells, however, are considered the most effective APC in the body, as well as the most potent phagocytic cell. Cells of the Adaptive Immune System The key cell involved in the adaptive immune response is the lymphocyte. They were discovered by Steinman and Cohn in 1973. Progenitors in the bone marrow give rise to dendritic cell precursors that travel to lymphoid as well as nonlymphoid tissue. They are classified according to their tissue location in a similar manner to macrophages.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Neutrophil</b> — Refer to Figure 1–2 for a simplified scheme of blood cell development, known as hematopoiesis. /FVUSPQIJMT The neutrophil, or polymorphonuclear neutrophilic (PMN) leukocyte, represents approximately 50% to 75% of the total peripheral WBCs in adults. These are around 10 to 15 µm in diameter with a nu</li><li><b>Basophil</b> — Eosinophils are able to neutralize basophil and mast cell products.</li></ul>", "r": "Book p. 7", "l": ""}, {"id": 6, "s": 0, "im": "", "q": "The ability of an individual to resist infection by means of normally present body functions is called", "c": "innate immunity.", "w": ["humoral immunity.", "adaptive immunity.", "cross-immunity."], "x": "<b>Answer key: a. innate immunity.</b><br><b>Why (from the chapter):</b> Innate, or natural immunity, is the individual’s ability to resist infection by means of normally present body functions. Innate immunity is the ability of the body to resist infection through means of normally present nonspecific body functions.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>humoral immunity.</b> — He observed that certain humoral, or circulating, factors called opsonins acted to coat bacteria so that they became more susceptible to ingestion by phagocytic cells. These serum factors include specific proteins known as antibodies, as well as other factors called acutephase reactants that increas</li><li><b>adaptive immunity.</b> — Adaptive immunity, in contrast, is a type of resistance that is characterized by specificity for each individual pathogen, or microbial agent, and the ability to remember a prior exposure.</li></ul>", "r": "Book pp. 4–11", "l": ""}, {"id": 7, "s": 0, "im": "", "q": "A cell characterized by a nucleus with two to five lobes, a diameter of 10 to 15 µm, and a large number of neutral staining granules is identified as a(n)", "c": "neutrophil.", "w": ["eosinophil.", "monocyte.", "basophil."], "x": "<b>Answer key: d. neutrophil.</b><br><b>Why (from the chapter):</b> Refer to Figure 1–2 for a simplified scheme of blood cell development, known as hematopoiesis. /FVUSPQIJMT The neutrophil, or polymorphonuclear neutrophilic (PMN) leukocyte, represents approximately 50% to 75% of the total peripheral WBCs in adults. These are around 10 to 15 µm in diameter with a nucleus that has between two and five lobes (Fig. 1–3).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>monocyte.</b> — The transition from monocyte to macrophage in the tissues is characterized by progressive cellular enlargement to between 25 and 80 µm. Unlike monocytes, macrophages contain no peroxidase. Tissue distribution appears to be a random phenomenon.</li><li><b>basophil.</b> — Eosinophils are able to neutralize basophil and mast cell products.</li></ul>", "r": "Book p. 4", "l": ""}, {"id": 8, "s": 0, "im": "", "q": "Which of the following is a primary lymphoid organ?", "c": "Thymus", "w": ["Lymph node", "Spleen", "MALT"], "x": "<b>Answer key: c. Thymus</b><br><b>Why (from the chapter):</b> The bone marrow and thymus are considered the primary lymphoid organs where maturation of B lymphocytes and T lymphocytes takes place, respectively. These cells are unique because they arise from an HSC and then are further differentiated in the primary lymphoid organs, namely the bone marrow and the thymus.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Lymph node</b> — A lymph node is surrounded by a tough outer capsule.</li><li><b>Spleen</b> — Secondary Lymphoid Organs Once lymphocytes mature in the primary organs, they are released and make their way to secondary lymphoid organs, which include the spleen, lymph nodes, cutaneous-associated The spleen, the largest secondary lymphoid organ, has a length of approximately 12 cm and weighs 150</li><li><b>MALT</b> — Secondary lymphoid organs include the spleen, lymph nodes, and various types of mucosal-associated lymphoid tissues (MALT).</li></ul>", "r": "Book pp. 7–8", "l": ""}, {"id": 9, "s": 0, "im": "", "q": "What type of cells would be found in a primary follicle?", "c": "Unstimulated B cells", "w": ["Germinal centers", "Plasma cells", "Memory cells"], "x": "<b>Answer key: a. Unstimulated B cells</b><br><b>Why (from the chapter):</b> The interior of a secondary follicle is known as the germinal center because it is here that transformation of the B cells takes place. All blood cells arise from a type of cell called a hematopoietic stem cell (HSC).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Germinal centers</b> — When stimulated by antigens, the B cells form germinal centers.</li><li><b>Plasma cells</b> — B cells differentiate into memory cells and plasma cells and are responsible for humoral immunity or antibody formation.</li><li><b>Memory cells</b> — B cells differentiate into memory cells and plasma cells and are responsible for humoral immunity or antibody formation.</li></ul>", "r": "Book pp. 4–10", "l": ""}, {"id": 10, "s": 0, "im": "", "q": "Which of the following is a distinguishing feature of B cells?", "c": "Presence of surface antibody", "w": ["Act as helper cells", "Able to kill target cells without prior exposure", "Active in phagocytosis"], "x": "<b>Answer key: b. Presence of surface antibody</b><br><b>Why (from the chapter):</b> The subtypes can be identified by the presence of the CD3 marker on their cell surface, and either CD4, or CD8. B cells differentiate into memory cells and plasma cells and are responsible for humoral immunity or antibody formation.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Act as helper cells</b> — Three main subtypes of T cells can be distinguished according to their unique functions: helper, cytolytic, and regulatory T cells.</li><li><b>Able to kill target cells without prior exposure</b> — They can kill virally infected or cancerous target cells without previous exposure to them. • The bone marrow and the thymus are considered primary lymphoid organs.</li></ul>", "r": "Book pp. 7–11", "l": ""}, {"id": 11, "s": 0, "im": "", "q": "Where do lymphocytes mainly come in contact with antigens?", "c": "Secondary lymphoid organs", "w": ["Bloodstream", "Bone marrow", "Thymus $IBQUFS\u0001\u0012\u0001 \u0001 *OUSPEVDUJPO\u0001UP\u0001*NNVOJUZ\u0001BOE\u0001UIF\u0001*NNVOF\u00014ZTUFN \u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0012\u0016"], "x": "<b>Answer key: a. Secondary lymphoid organs</b><br><b>Why (from the chapter):</b> It is in the secondary organs that contact with foreign antigens is most likely to take place. It is within these secondary organs that the main contact with foreign antigens takes place.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Bloodstream</b> — Lymphocytes in these organs travel through the tissue and return to the bloodstream by way of the thoracic duct.</li><li><b>Bone marrow</b> — Formation of lymphocytes in the bone marrow, however, is antigen-independent, meaning that lymphocytes are constantly being produced without the presence of specific antigens.</li></ul>", "r": "Book p. 9", "l": ""}, {"id": 12, "s": 0, "im": "", "q": "Which of the following is found on the T cell subset known as helpers?", "c": "CD4", "w": ["CD19", "CD8", "CD56"], "x": "<b>Answer key: b. CD4</b><br><b>Why (from the chapter):</b> The subtypes can be identified by the presence of the CD3 marker on their cell surface, and either CD4, or CD8. The ratio of CD4+ to CD8+ cells is approximately 2:1 in peripheral blood.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>CD19</b> — Other surface proteins that appear on the B cell include CD19, CD21, and class II major histocompatibility complex (MHC) molecules (see Chapter 2). T Cells T cells are so named because they differentiate in the thymus.</li><li><b>CD8</b> — T cells bearing the CD4 receptor are mainly either helper or regulatory cells, whereas the CD8-positive (CD8+) population consists of cytotoxic T cells.</li></ul>", "r": "Book p. 7", "l": ""}, {"id": 13, "s": 0, "im": "", "q": "Which of the following statements best characterizes adaptive immunity?", "c": "Specificity for each individual pathogen", "w": ["Relies on normally present body functions", "Response is similar for each exposure", "Involves only cellular immunity"], "x": "<b>Answer key: c. Specificity for each individual pathogen</b><br><b>Why (from the chapter):</b> Adaptive immunity, in contrast, is a type of resistance that is characterized by specificity for each individual pathogen, or microbial agent, and the ability to remember a prior exposure. Memory and specificity result in an increased response to that pathogen upon repeated exposure, something that does not occur in innate immunity.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Relies on normally present body functions</b> — Innate immunity is the ability of the body to resist infection through means of normally present nonspecific body functions.</li><li><b>Response is similar for each exposure</b> — No prior exposure is required and the response lacks memory and specificity.</li><li><b>Involves only cellular immunity</b> — The theory of humoral immunity was thus born and sparked a long-lasting dispute over the relative importance of cellular versus humoral immunity.</li></ul>", "r": "Book p. 4", "l": ""}, {"id": 14, "s": 0, "im": "", "q": "The main function of T cells in the immune response is to", "c": "produce cytokines that regulate both innate and adaptive immunity.", "w": ["produce antibodies.", "participate actively in phagocytosis.", "respond to target cells without prior exposure."], "x": "<b>Answer key: a. produce cytokines that regulate both innate and adaptive immunity.</b><br><b>Why (from the chapter):</b> The role of T cells is to produce cytokines that contribute to immunity by stimulating B cells to produce antibodies, assisting in killing tumor cells or infected target cells, and helping to regulate both the innate and adaptive immune response.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>produce antibodies.</b> — T lymphocytes are effector cells that serve a regulatory role, whereas B lymphocytes produce antibodies.</li><li><b>participate actively in phagocytosis.</b> — CMPs give rise to the WBCs that participate in phagocytosis, which are known as the myeloid line.</li><li><b>respond to target cells without prior exposure.</b> — No prior exposure is required and the response lacks memory and specificity.</li></ul>", "r": "Book p. 7", "l": ""}, {"id": 15, "s": 0, "im": "", "q": "Which of the following is a part of humoral immunity?", "c": "Neutralization of toxins by serum", "w": ["Cells involved in phagocytosis", "Macrophages and mast cells in the tissue", "T and B cells in lymph nodes"], "x": "<b>Answer key: b. Neutralization of toxins by serum</b><br><b>Why (from the chapter):</b> He observed that certain humoral, or circulating, factors called opsonins acted to coat bacteria so that they became more susceptible to ingestion by phagocytic cells. These serum factors include specific proteins known as antibodies, as well as other factors called acutephase reactants that increase nonspecifically in any infection. Antibodies are serum proteins produced by certain lymphocytes when exposed to a foreign substance and they react specifically with that foreign substance (see Chapter 5).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Macrophages and mast cells in the tissue</b> — Several cell lines that are found in the tissues, namely mast cells, macrophages, and dendritic cells, will also be discussed in this chapter because they all contribute to the process of immunity.</li><li><b>T and B cells in lymph nodes</b> — Accumulation of lymphocytes and other cells causes the lymph nodes to become enlarged, a condition known as lymphadenopathy.</li></ul>", "r": "Book p. 4", "l": ""}, {"id": 16, "s": 0, "im": "", "q": "Immunity can be defined as", "c": "the condition of being resistant to disease.", "w": ["the study of medicines used to treat diseases.", "a specific population at risk for a disease.", "the study of the noncellular portion of the blood."], "x": "<b>Answer key: c. the condition of being resistant to disease.</b><br><b>Why (from the chapter):</b> Immunity and Immunization Immunology as a science has its roots in the study of immunity: the condition of being resistant to infection.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>the study of medicines used to treat diseases.</b> — In addition, understanding how the immune system works has made successful organ transplantation possible and has given us new tools to treat diseases such as cancer and certain autoimmune diseases.</li><li><b>the study of the noncellular portion of the blood.</b> — Emil von Behring demonstrated that diphtheria and tetanus toxins, which are produced by specific microorganisms as they grow, could be neutralized by the noncellular portion of the blood of animals previously exposed to the microorganisms.</li></ul>", "r": "Book p. 3", "l": ""}, {"id": 17, "s": 0, "im": "", "q": "A blood cell that has reddish staining granules and is able to kill large parasites describes", "c": "eosinophils.", "w": ["basophils.", "monocytes.", "neutrophils."], "x": "<b>Answer key: d. eosinophils.</b><br><b>Why (from the chapter):</b> Eosinophils are able to neutralize basophil and mast cell products. In addition, they can use cationic proteins to damage cell membranes and kill larger parasites that cannot be phagocytized. (See Chapter 22 for details.) However, the most important role of eosinophils is regulation of the immune response, including regulation of mast cell function. #BTPQIJMT Basophils are the least numerous of WBCs found in peripheral blood, representing less than 1% of all circulating WBCs.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>basophils.</b> — The smallest of the granulocytes, basophils are slightly larger than RBCs (between 10 to 15 µm in diameter) and contain coarse, densely staining deep-bluish-purple granules that often obscure the nucleus5, (Fig. 1–5).</li><li><b>monocytes.</b> — Fig. 1–13.) All macrophages arise from monocytes, which can be thought of as macrophage precursors because additional differentiation and cell division takes place in the tissues.</li><li><b>neutrophils.</b> — Granules in eosinophils, which are spherical and evenly distributed throughout the cell, contain a large number of previously synthesized proteins including catalase, lysozyme, cytokines (chemical messengers), growth factors, and cationic proteins. Eosinophils are capable of phagocytosis but are muc</li></ul>", "r": "Book p. 5", "l": ""}, {"id": 18, "s": 0, "im": "", "q": "Which of the following statements best describes a lymph node?", "c": "It collects fluid from the tissues.", "w": ["It is considered a primary lymphoid organ.", "It removes old RBCs.", "It is where B cells mature."], "x": "<b>Answer key: c. It collects fluid from the tissues.</b><br><b>Why (from the chapter):</b> It collects most of the body’s lymph fluid and empties it into the left subclavian vein.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>It is considered a primary lymphoid organ.</b> — The bone marrow and thymus are considered the primary lymphoid organs where maturation of B lymphocytes and T lymphocytes takes place, respectively.</li><li><b>It removes old RBCs.</b> — The organ can be characterized as a large discriminating filter as it removes old and damaged cells and foreign antigens from the blood.</li><li><b>It is where B cells mature.</b> — These are the mature, resting B cells that have not yet been exposed to antigens.</li></ul>", "r": "Book p. 9", "l": ""}, {"id": 19, "s": 0, "im": "", "q": "Antigenic groups identified by different sets of antibodies reacting in a similar manner to certain standard cell lines best describes", "c": "clusters of differentiation (CD).", "w": ["cytokines.", "neutrophilic granules.", "opsonins. \u0013 Nature of Antigens and the Major Histocompatibility Complex $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: FACTORS INFLUENCING THE IMMUNE RESPONSE TRAITS OF IMMUNOGENS EPITOPES HAPTENS ADJUVANTS RELATIONSHIP OF ANTIGENS TO THE HOST MAJOR HISTOCOMPATIBILITY COMPLEX Genes Coding for MHC Molecules (HLA Antigens) Structure of Class I and II MHC Molecules Role of Class I and II Molecules in the Immune Response Clinical Significance of MHC CASE STUDY"], "x": "<b>Answer key: b. clusters of differentiation (CD).</b><br><b>Why (from the chapter):</b> In order to standardize the nomenclature, scientists set up the Human Leukocyte Differentiation Antigens Workshops to relate research findings. Panels of antibodies from different laboratories were used for analysis and antibodies reacting similarly with standard cell lines were said to define clusters of differentiation (CD).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>cytokines.</b> — Lymphocyte circulation between the secondary organs is complex and is regulated by different cell surface adhesion molecules and by cytokines.</li><li><b>opsonins. \u0013 Nature of Antigens and the Major Histocompatibility Complex $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: FACTORS INFLUENCING THE IMMUNE RESPONSE TRAITS OF IMMUNOGENS EPITOPES HAPTENS ADJUVANTS RELATIONSHIP OF ANTIGENS TO THE HOST MAJOR HISTOCOMPATIBILITY COMPLEX Genes Coding for MHC Molecules (HLA Antigens) Structure of Class I and II MHC Molecules Role of Class I and II Molecules in the Immune Response Clinical Significance of MHC CASE STUDY</b> — Other surface proteins that appear on the B cell include CD19, CD21, and class II major histocompatibility complex (MHC) molecules (see Chapter 2). T Cells T cells are so named because they differentiate in the thymus.</li></ul>", "r": "Book p. 7", "l": ""}, {"id": 20, "s": 1, "im": "", "q": "All of the following are characteristics of an effective immunogen except", "c": "found on host cells.", "w": ["internal complexity.", "large molecular weight.", "the presence of numerous epitopes."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: d. found on host cells.</b><br><b>Why (from the chapter):</b> Typically, the more distant taxonomically the source of the immunogen is from the host, the more successful it is as a stimulus. Whereas class I MHC (HLA) molecules are expressed on all nucleated cells, class II MHC (HLA) molecules are found primarily on APCs.", "r": "Book pp. 18–22", "l": ""}, {"id": 21, "s": 1, "im": "", "q": "Which of the following best describes a hapten?", "c": "Antigenic only when coupled to a carrier", "w": ["Cannot react with antibody", "Has multiple determinant sites", "A large chemically complex molecule"], "x": "<b>Answer key: b. Antigenic only when coupled to a carrier</b><br><b>Why (from the chapter):</b> Haptens are nonimmunogenic materials that, when combined with a carrier, create new antigenic determinants. Spatial orientation of small groups is recognized, because antibodies made against aminobenzene coupled with a carrier will not react with other similar haptens.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Cannot react with antibody</b> — Antibody to a carboxyl group in one location would not react with a hapten, which has the carboxyl group in a different location. (From Landsteiner K.</li><li><b>A large chemically complex molecule</b> — On the cell surface, class II molecules are responsible for forming a trimolecular complex that occurs between antigen, class II molecule, and an appropriate TCR.</li></ul>", "r": "Book pp. 19–20", "l": ""}, {"id": 22, "s": 1, "im": "", "q": "Which would be the most effective immunogen?", "c": "Protein with a molecular weight of 200,000", "w": ["Nylon polymer with a molecular weight of 250,000", "Polysaccharide with a molecular weight of 220,000", "Protein with a molecular weight of 175,000"], "x": "<b>Answer key: a. Protein with a molecular weight of 200,000</b><br><b>Why (from the chapter):</b> Epitopes Although an immunogen must have a molecular weight of at least 10,000, only a small part of the immunogen is actually recognized in the immune response. The α chain has a molecular weight of 44,000. A lighter chain associated with it, called a β2–microglobulin, has a molecular weight of 12,000 and is encoded by a single gene on chromosome 15 that is not polymorphic. This means that every class I molecule contains the same β2–microglobulin.", "r": "Book pp. 18–22", "l": ""}, {"id": 23, "s": 1, "im": "", "q": "Which of the following individuals would likely respond most strongly to a bacterial infection?", "c": "A weightlifter who is 35 years old", "w": ["An adult who is 75 years of age", "A malnourished 40-year-old", "A newborn baby"], "x": "<b>Answer key: c. A weightlifter who is 35 years old</b><br><b>Why (from the chapter):</b> Major Histocompatibility Complex For years, scientists searched to identify possible immune response genes that would account for differences in how individuals respond to particular immunogens.", "r": "Book pp. 16–28", "l": ""}, {"id": 24, "s": 1, "im": "", "q": "Which best describes an epitope?", "c": "A key portion of the immunogen", "w": ["A peptide that must be at least 10,000 MW", "An area of an immunogen recognized only by T cells", "A segment of sequential amino acids only"], "x": "<b>Answer key: d. A key portion of the immunogen</b><br><b>Why (from the chapter):</b> This key portion of the immunogen is known as the determinant site or epitope.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>A peptide that must be at least 10,000 MW</b> — Epitopes Although an immunogen must have a molecular weight of at least 10,000, only a small part of the immunogen is actually recognized in the immune response.</li><li><b>An area of an immunogen recognized only by T cells</b> — Epitopes are molecular shapes or configurations that are recognized by B or T cells.</li><li><b>A segment of sequential amino acids only</b> — They may also be sequential or linear epitopes (i.e., amino acids following one another on a single chain) or they may be conformational.</li></ul>", "r": "Book p. 18", "l": ""}, {"id": 25, "s": 1, "im": "", "q": "Adjuvants act by which of the following methods?", "c": "Protects antigen from being degraded", "w": ["Facilitates rapid escape from the tissues", "Limits the area of the immune response", "Decreases number of APCs"], "x": "<b>Answer key: a. Protects antigen from being degraded</b><br><b>Why (from the chapter):</b> Endogenous antigen within cytosol is degraded by proteasome. 2. Exogenous antigen taken in and degraded and routed to intracellular vesicle. 5.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Limits the area of the immune response</b> — Most adjuvants work by keeping the antigen in the area and by increasing the number of cells involved in the immune response. • Antigens can be characterized by their relationship to the host.</li></ul>", "r": "Book pp. 25–26", "l": ""}, {"id": 26, "s": 1, "im": "", "q": "A heterophile antigen is one that", "c": "exists in unrelated plants or animals.", "w": ["is a self-antigen.", "has been used previously to stimulate antibody response.", "is from the same species but is different from the host."], "x": "<b>Answer key: b. exists in unrelated plants or animals.</b><br><b>Why (from the chapter):</b> Heterophile antigens are heteroantigens that exist in unrelated plants or animals but are either identical or closely related in structure so that antibody to one will cross-react with antigen of the other. Heteroantigens are from other species, such as other animals, plants, or microorganisms.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>is a self-antigen.</b> — Any lymphocyte capable of reacting with self-antigen is normally eliminated.</li><li><b>has been used previously to stimulate antibody response.</b> — Epitopes recognized by B cells may differ from those recognized by T cells. Surface antibody on B cells may react with both Some substances are too small to be recognized, but if they are combined with larger molecules they are then able to stimulate a response.</li><li><b>is from the same species but is different from the host.</b> — Alloantigens are from other members of the host’s species and are capable of eliciting an immune response.</li></ul>", "r": "Book pp. 21–28", "l": ""}, {"id": 27, "s": 1, "im": "", "q": "Which of the following is true of class II MHC (HLA) antigens?", "c": "They are found on B cells and macrophages.", "w": ["They are found on all nucleated cells.", "They all originate at one locus.", "They are coded for on chromosome 9."], "x": "<b>Answer key: a. They are found on B cells and macrophages.</b><br><b>Why (from the chapter):</b> This is known as the endogenous pathway for antigen presentation. • Class II molecules are only found on B cells, monocytes, macrophages, dendritic cells, and thymic epithelium. Whereas class I MHC (HLA) molecules are expressed on all nucleated cells, class II MHC (HLA) molecules are found primarily on APCs.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They are found on all nucleated cells.</b> — MHC molecules are actually found on all nucleated cells in the body and they play a pivotal role in the development of both humoral and cellular immunity.</li></ul>", "r": "Book pp. 22–28", "l": ""}, {"id": 28, "s": 1, "im": "", "q": "Class II MHC molecules are recognized by which of the following?", "c": "CD4+ T cells", "w": ["CD8+ T cells", "Natural killer cells", "Neutrophils"], "x": "<b>Answer key: a. CD4+ T cells</b><br><b>Why (from the chapter):</b> Class I molecules mainly present peptides synthesized within the cell to CD8 (cytotoxic) T cells, whereas class II molecules present exogenous antigen to CD4 (helper) T cells. CD4+ helper T cells are stimulated by contact with antigen and clonal expansion takes place.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>CD8+ T cells</b> — Display of hundreds of class I molecules complexed to antigen allows CD8+ T cells to continuously check cell surfaces for the presence of nonself antigen.</li></ul>", "r": "Book pp. 24–27", "l": ""}, {"id": 29, "s": 1, "im": "", "q": "Which of the following best describes the role of TAP?", "c": "They transport peptides into the lumen of the endoplasmic reticulum.", "w": ["They bind to class II molecules to help block the antigen-binding site.", "They bind to class I proteins in proteasomes.", "They help cleave peptides for transport to endosomes."], "x": "<b>Answer key: c. They transport peptides into the lumen of the endoplasmic reticulum.</b><br><b>Why (from the chapter):</b> Peptides transported into endoplasmic reticulum by TAP. 3. Ii may be responsible for helping to bring α and β chains together in the ER lumen and then moving them out through the Golgi complex to the endocytic vesicles where digested antigen is found. Unlike class I molecules, class II molecules must be transported from the endoplasmic reticulum (ER) to an endosomal compartment where they can then bind peptides17 (Fig. 2–10).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They bind to class II molecules to help block the antigen-binding site.</b> — If the antigen is recognized as being foreign, cytokines are released, causing destruction of the target cell. binding of segments of endogenous peptides within the ER, Ii serves to protect the binding site. This chain is a 31-kd protein that is made in excess so that enough is available to bind wit</li><li><b>They bind to class I proteins in proteasomes.</b> — Peptides that bind with the class I molecules are approximately 8 to 11 amino acids in length and are derived from partial digestion of proteins synthesized in the cytoplasm.</li></ul>", "r": "Book p. 25", "l": ""}, {"id": 30, "s": 1, "im": "", "q": "What is the purpose of the invariant chain in antigen processing associated with class II MHC molecules?", "c": "Blocks binding of endogenous peptides", "w": ["Helps transport peptides to the binding site", "Binds to CD8+ T cells", "Cleaves peptides into the proper size for binding \u0014\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012"], "x": "<b>Answer key: b. Blocks binding of endogenous peptides</b><br><b>Why (from the chapter):</b> Class II MHC binds invariant chain to block binding of endogenous antigen. 2. If the antigen is recognized as being foreign, cytokines are released, causing destruction of the target cell. binding of segments of endogenous peptides within the ER, Ii serves to protect the binding site. This chain is a 31-kd protein that is made in excess so that enough is available to bind with all class II molecules shortly after they are synthesized.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Binds to CD8+ T cells</b> — Display of hundreds of class I molecules complexed to antigen allows CD8+ T cells to continuously check cell surfaces for the presence of nonself antigen.</li><li><b>Cleaves peptides into the proper size for binding \u0014\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012</b> — Peptides must be unfolded before entering the cylindrical chamber of the proteasome; they are then cleaved into the proper size for delivery to class I molecules.</li></ul>", "r": "Book pp. 25–26", "l": ""}, {"id": 31, "s": 1, "im": "", "q": "An individual is recovering from a bacterial infection and tests positive for antibodies to a protein normally found in the cytoplasm of this bacterium. Which of the following statements is true of this situation?", "c": "Class II molecules have presented bacterial antigen to CD4+ T cells.", "w": ["Class I molecules have presented bacterial antigen to CD8+ T cells.", "Class I molecules have presented bacterial antigen to CD4+ T cells.", "B cells have recognized bacterial antigen without help from T cells."], "x": "<b>Answer key: c. Class II molecules have presented bacterial antigen to CD4+ T cells.</b><br><b>Why (from the chapter):</b> Class I molecules mainly present peptides synthesized within the cell to CD8 (cytotoxic) T cells, whereas class II molecules present exogenous antigen to CD4 (helper) T cells. An example of this is the human blood group A and B antigens, which are related to bacterial polysaccharides. It is believed that anti-A antibody, which is normally found in individuals with blood types other than A (e.g., type B and type O), is originally formed after exposure to pneumococci or other similar bacteria.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Class I molecules have presented bacterial antigen to CD8+ T cells.</b> — Most of the polymorphism resides in the α1 and α2 regions, whereas the α3 and β2 regions are relatively constant. The α3 region reacts with CD8 on cytotoxic T cells.</li></ul>", "r": "Book pp. 21–24", "l": ""}, {"id": 32, "s": 1, "im": "", "q": "In relation to a human, alloantigens would need to be considered in which of the following events?", "c": "Transplantation of a kidney from one individual to another", "w": ["Vaccination with the polysaccharide coat of a bacterial cell", "Oral administration of a live but heat-killed virus particle", "Grafting skin from one area of the body to another"], "x": "<b>Answer key: a. Transplantation of a kidney from one individual to another</b><br><b>Why (from the chapter):</b> They may also be sequential or linear epitopes (i.e., amino acids following one another on a single chain) or they may be conformational. Although MHC molecules themselves can function as antigens when transplanted from one individual to another, their main function is to bring antigen in the body to the surface of cells for recognition by T cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Vaccination with the polysaccharide coat of a bacterial cell</b> — Naturally occurring anti-B antibody is formed after exposure to a similar bacterial cell wall product.</li></ul>", "r": "Book pp. 18–21", "l": ""}, {"id": 33, "s": 1, "im": "", "q": "Which is characteristic of class I MHC molecules?", "c": "Binds peptides made within the cell", "w": ["Consists of one α and one β chain", "Able to bind whole proteins", "Coded for by DR, DP, and DQ genes /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN"], "x": "<b>Answer key: b. Binds peptides made within the cell</b><br><b>Why (from the chapter):</b> If the antigen is recognized as being foreign, cytokines are released, causing destruction of the target cell. binding of segments of endogenous peptides within the ER, Ii serves to protect the binding site. This chain is a 31-kd protein that is made in excess so that enough is available to bind with all class II molecules shortly after they are synthesized. Class II MHC binds invariant chain to block binding of endogenous antigen. 2.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Able to bind whole proteins</b> — Peptides that bind with the class I molecules are approximately 8 to 11 amino acids in length and are derived from partial digestion of proteins synthesized in the cytoplasm.</li></ul>", "r": "Book pp. 25–26", "l": ""}, {"id": 34, "s": 1, "im": "", "q": "Class I MHC antigens E and G serve which function?", "c": "Protect fetal tissue from destruction by NK cells", "w": ["Enhance the response by macrophages", "Transport antigen for recognition by CD4+ T cells", "Bind to A, B, and C antigens to protect the binding site"], "x": "<b>Answer key: d. Protect fetal tissue from destruction by NK cells</b><br><b>Why (from the chapter):</b> G antigens are expressed on fetal trophoblast cells during the first trimester of pregnancy, where they come in direct contact with maternal tissue. If the antigen is recognized as being foreign, cytokines are released, causing destruction of the target cell. binding of segments of endogenous peptides within the ER, Ii serves to protect the binding site. This chain is a 31-kd protein that is made in excess so that enough is available to bind with all class II molecules shortly after they are synthesized.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Enhance the response by macrophages</b> — They are too small to initiate a response by themselves. • Once an antibody response is generated, haptens are capable of reacting with that antibody, but precipitation or agglutination will not occur. • Adjuvants are substances that can be mixed with antigen to enhance the immune response.</li><li><b>Transport antigen for recognition by CD4+ T cells</b> — Although MHC molecules themselves can function as antigens when transplanted from one individual to another, their main function is to bring antigen in the body to the surface of cells for recognition by T cells.</li><li><b>Bind to A, B, and C antigens to protect the binding site</b> — Binding of peptides to class I and class II molecules is not as specific as the binding of peptides to T-cell receptors (TCRs) because numerous different peptides can bind to a particular MHC molecule. Another group of molecules called the nonclassical class I antigens are designated E, F, and G.</li></ul>", "r": "Book pp. 23–25", "l": ""}, {"id": 35, "s": 1, "im": "", "q": "Which best explains the difference between immunogens and antigens?", "c": "Only immunogens can trigger an immune response.", "w": ["Only antigens are large enough to be recognized by T cells.", "Only immunogens can react with antibody.", "Only antigens are recognized as foreign."], "x": "<b>Answer key: c. Only immunogens can trigger an immune response.</b><br><b>Why (from the chapter):</b> Today, it is known that many therapeutic drugs and hormones can function as haptens. Adjuvants The power of immunogens to generate an immune response can be increased through the use of adjuvants. Major Histocompatibility Complex For years, scientists searched to identify possible immune response genes that would account for differences in how individuals respond to particular immunogens.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Only antigens are large enough to be recognized by T cells.</b> — There is evidence that for proteins, epitopes recognized by B cells may consist of as few as 6 to 15 amino acids. Large molecules may have numerous epitopes and each one may be capable of triggering specific antibody production or a T-cell response.</li><li><b>Only immunogens can react with antibody.</b> — Antibody to a carboxyl group in one location would not react with a hapten, which has the carboxyl group in a different location. (From Landsteiner K.</li><li><b>Only antigens are recognized as foreign.</b> — If the antigen is recognized as being foreign, cytokines are released, causing destruction of the target cell. binding of segments of endogenous peptides within the ER, Ii serves to protect the binding site. This chain is a 31-kd protein that is made in excess so that enough is available to bind wit</li></ul>", "r": "Book pp. 16–28", "l": ""}, {"id": 36, "s": 1, "im": "", "q": "When a child inherits one set of six HLA genes together from one parent, this is called a(n)", "c": "haplotype.", "w": ["genotype.", "phenotype.", "allotype."], "x": "<b>Answer key: b. haplotype.</b><br><b>Why (from the chapter):</b> Because the MHC genes are closely linked, they are inherited together as a package called a haplotype.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>genotype.</b> — The full genotype would consist of two of each gene at a particular locus (see Chapter 16).</li></ul>", "r": "Book p. 22", "l": ""}, {"id": 37, "s": 1, "im": "", "q": "HLA molecules A, B, and C belong to which MHC class?", "c": "Class I", "w": ["Class II", "Class III", "Class IV Innate Immunity $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0014 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: EXTERNAL DEFENSE SYSTEM INTERNAL DEFENSE SYSTEM Pathogen Recognition Receptors Acute-Phase Reactants Inflammation Phagocytosis Action of Natural Killer Cells"], "x": "<b>Answer key: a. Class I</b><br><b>Why (from the chapter):</b> Whereas class I MHC (HLA) molecules are expressed on all nucleated cells, class II MHC (HLA) molecules are found primarily on APCs. The binding site of class II MHC molecules is first occupied by an invariant chain (Ii).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Class III</b> — Class III molecules also have a completely different structure compared with the other two classes.</li><li><b>Class IV Innate Immunity $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0014 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: EXTERNAL DEFENSE SYSTEM INTERNAL DEFENSE SYSTEM Pathogen Recognition Receptors Acute-Phase Reactants Inflammation Phagocytosis Action of Natural Killer Cells</b> — The G antigens bind to NK inhibitory receptors and turn off the NK cytotoxic response. (See Chapter 3 for the action of NK cells.) E molecules play a similar role.</li></ul>", "r": "Book pp. 22–26", "l": ""}, {"id": 38, "s": 2, "im": "", "q": "The term for enhancement of phagocytosis by coating of foreign particles with serum proteins is", "c": "opsonization.", "w": ["agglutination.", "solubilization.", "chemotaxis."], "x": "<b>Answer key: a. opsonization.</b><br><b>Why (from the chapter):</b> CRP acts somewhat like an antibody because it is capable of opsonization (the coating of foreign particles), agglutination, precipitation, and activation of complement by the classical pathway.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>chemotaxis.</b> — The major functions of complement are opsonization, chemotaxis, and lysis of cells.</li></ul>", "r": "Book p. 35", "l": ""}, {"id": 39, "s": 2, "im": "", "q": "Which of the following plays an important role as an external defense mechanism?", "c": "Lysozyme", "w": ["Phagocytosis", "C-reactive protein", "Complement"], "x": "<b>Answer key: c. Lysozyme</b><br><b>Why (from the chapter):</b> The granules contain lysozyme, myeloperoxidase, and other proteolytic enzymes. Lysozyme—an enzyme found in many bodily secretions such as tears and saliva—attacks the cell walls of microorganisms, especially those that are gram-positive.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Phagocytosis</b> — Although the acutephase reactants enhance the process of phagocytosis, it is the cellular elements of the internal defense system that play the major role.</li><li><b>C-reactive protein</b> — Some of the most important ones are C-reactive protein, serum amyloid A, complement components, alpha1-antitrypsin, haptoglobin, fibrinogen, and ceruloplasmin. They are produced primarily by hepatocytes (liver parenchymal cells) within 12 to 24 hours in response to an increase in cytokines (see Chap</li><li><b>Complement</b> — CRP, complement components, and antibodies are all important opsonins.</li></ul>", "r": "Book pp. 33–38", "l": ""}, {"id": 40, "s": 2, "im": "", "q": "The process of inflammation is characterized by all of the following except", "c": "decreased capillary permeability.", "w": ["increased blood supply to the area.", "migration of WBCs.", "appearance of acute-phase reactants."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: c. decreased capillary permeability.</b><br><b>Why (from the chapter):</b> Increased capillary permeability caused by contraction of the endothelial cells lining the vessels. Neutrophils are recruited to the area because of increased capillary permeability; in addition, macrophages and dendritic cells become more efficient because of increased expression of adhesion molecules on their cell surfaces.", "r": "Book pp. 34–41", "l": ""}, {"id": 41, "s": 2, "im": "", "q": "Skin, lactic acid secretions, stomach acidity, and the motion of cilia represent which type of immunity?", "c": "Innate", "w": ["Cross", "Adaptive", "Auto"], "x": "<b>Answer key: a. Innate</b><br><b>Why (from the chapter):</b> This capability is called recognition of missing self. • NK cells bind to and kill any antibody-coated target cells. • NK cells represent an important link between the innate and adaptive immune systems. Components of innate immunity can be thought of as the first responders because they react immediately to infectious agents.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Adaptive</b> — Adaptive immunity, in contrast, is a more tailored response.</li></ul>", "r": "Book pp. 32–42", "l": ""}, {"id": 42, "s": 2, "im": "", "q": "The structure formed by the fusion of engulfed material and enzymatic granules within the phagocytic cell is called a", "c": "phagolysosome", "w": ["phagosome.", "lysosome.", "vacuole."], "x": "<b>Answer key: d. phagolysosome</b><br><b>Why (from the chapter):</b> Fusion of the phagosome with lysosomal granules creates a phagolysosome.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>phagosome.</b> — Fusion with lysosomal granules with the phagosome 5.</li><li><b>lysosome.</b> — Formation of the phagolysosome: contents of the lysosome are emptied into this membrane-bound space. 6.</li><li><b>vacuole.</b> — NADPH oxidase depolarizes the membrane when fusion with the phagosome occurs, allowing hydrogen and potassium ions to enter the vacuole.</li></ul>", "r": "Book p. 41", "l": ""}, {"id": 43, "s": 2, "im": "", "q": "The presence of human microbiota (normal flora) acts as a defense mechanism by which of the following methods?", "c": "Competing with potential pathogens", "w": ["Maintaining an acid environment", "Keeping phagocytes in the area", "Coating mucosal surfaces"], "x": "<b>Answer key: b. Competing with potential pathogens</b><br><b>Why (from the chapter):</b> In many locations of the human body, the presence of normal flora (also called microbiota) helps to keep pathogens from establishing themselves in these areas. The flushing action of urine, plus its slight acidity, helps to remove many potential pathogens from the genitourinary tract.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Coating mucosal surfaces</b> — First and foremost are the unbroken skin and the mucosal membrane surfaces.</li></ul>", "r": "Book p. 33", "l": ""}, {"id": 44, "s": 2, "im": "", "q": "Measurement of CRP levels can be used for all of the following except", "c": "diagnosis of a specific bacterial infection.", "w": ["monitoring drug therapy with anti-inflammatory agents.", "tracking the progress of an organ transplant.", "determining active phases of rheumatoid arthritis."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: c. diagnosis of a specific bacterial infection.</b><br><b>Why (from the chapter):</b> A normal WBC count ruled out the possibility of a bacterial infection. Individuals with this disease suffer from recurring, severe bacterial infections (see Chapter 19). Following phagocytosis, macrophages and dendritic cells process peptides from pathogens for presentation to T cells.", "r": "Book pp. 39–42", "l": ""}, {"id": 45, "s": 2, "im": "", "q": "Pathogen recognition receptors act by", "c": "recognizing molecules that are unique to pathogens.", "w": ["recognizing molecules common to both host cells and pathogens.", "helping to spread infection because they are found on pathogens.", "all recognizing the same pathogens."], "x": "<b>Answer key: b. recognizing molecules that are unique to pathogens.</b><br><b>Why (from the chapter):</b> Cells that are most active in phagocytosis include neutrophils, monocytes, macrophages, and dendritic cells. • Pathogen recognition receptors (PRRs) are molecules on host cells that recognize substances found only on pathogens. Once receptors bind a pathogen, phagocytosis can take place. • Pathogen-associated molecular patterns (PAMPS) are molecules found only on pathogens, which allow host cells to distinguish them from self.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>all recognizing the same pathogens.</b> — These receptors bind to mannan and β-glucans found in fungal cell walls. Although the initial signaling pathway differs from TLRs, the end result is the same—production of cytokines and chemokines to eliminate microbes.</li></ul>", "r": "Book pp. 37–41", "l": ""}, {"id": 46, "s": 2, "im": "", "q": "Which of the following are characteristics of acute-phase reactants?", "c": "All of the above", "w": ["Rapid increase following infection", "Enhancement of phagocytosis", "Nonspecific indicators of inflammation"], "x": "<b>Answer key: d. All of the above</b><br><b>Why (from the chapter):</b> See the chapter section on this topic.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Rapid increase following infection</b> — Acute-phase reactants are normal serum constituents that increase rapidly because of infection, injury, or trauma to the tissues.</li></ul>", "r": "", "l": ""}, {"id": 47, "s": 2, "im": "", "q": "Which is the most significant agent formed in the phagolysosome for the elimination of microorganisms?", "c": "Hypochlorite ions", "w": ["Proteolytic enzymes", "Hydrogen ions", "Superoxides"], "x": "<b>Answer key: c. Hypochlorite ions</b><br><b>Why (from the chapter):</b> Hypochlorite is a powerful oxidizing agent and is highly toxic for microorganisms. Its antimicrobial effect is further enhanced by the formation of hypochlorite ions through the action of the enzyme myeloperoxidase in the presence of chloride ions.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Proteolytic enzymes</b> — The granules contain lysozyme, myeloperoxidase, and other proteolytic enzymes.</li><li><b>Hydrogen ions</b> — Hydrogen peroxide has long been considered an important bactericidal agent and is more stable than any of the free radicals.</li></ul>", "r": "Book p. 39", "l": ""}, {"id": 48, "s": 2, "im": "", "q": "Which acute-phase reactant helps to prevent formation of peroxides and free radicals that may damage tissues?", "c": "Haptoglobin", "w": ["Fibrinogen", "Ceruloplasmin", "Serum amyloid A"], "x": "<b>Answer key: a. Haptoglobin</b><br><b>Why (from the chapter):</b> Once bound to AAT, the protease is completely inactivated and is subsequently removed from the area of tissue damage. )BQUPHMPCJO Haptoglobin is an alpha2-globulin with a molecular weight of 100,000 daltons. Some of the most important ones are C-reactive protein, serum amyloid A, complement components, alpha1-antitrypsin, haptoglobin, fibrinogen, and ceruloplasmin. They are produced primarily by hepatocytes (liver parenchymal cells) within 12 to 24 hours in response to an increase in cytokines (see Chapter 6 for a <br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Fibrinogen</b> — Normal plasma concentrations range from 40 to 290 mg/dL. &#x27;JCSJOPHFO Fibrinogen is an acute-phase protein involved in the coagulation pathway.</li><li><b>Ceruloplasmin</b> — A depletion of ceruloplasmin is found in Wilson’s disease, an autosomal recessive genetic disorder characterized by a massive increase of copper in the tissues.</li></ul>", "r": "Book pp. 35–37", "l": ""}, {"id": 49, "s": 2, "im": "", "q": "Which statement best describes Toll-like receptors (TLRs)?", "c": "They enhance phagocytosis.", "w": ["They protect adult flies from infection.", "They are found on all host cells.", "They only play a role in adaptive immunity."], "x": "<b>Answer key: d. They enhance phagocytosis.</b><br><b>Why (from the chapter):</b> These processes enhance phagocytosis and destroy most pathogens that humans are exposed to before disease sets in. Although the acutephase reactants enhance the process of phagocytosis, it is the cellular elements of the internal defense system that play the major role.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They are found on all host cells.</b> — Cells that are most active in phagocytosis include neutrophils, monocytes, macrophages, and dendritic cells. • Pathogen recognition receptors (PRRs) are molecules on host cells that recognize substances found only on pathogens.</li><li><b>They only play a role in adaptive immunity.</b> — Cells that are capable of phagocytosis play a major role (see Chapter 1).</li></ul>", "r": "Book pp. 34–37", "l": ""}, {"id": 50, "s": 2, "im": "", "q": "The action of CRP can be distinguished from that of an antibody because", "c": "CRP acts before the antibody appears.", "w": ["only the antibody triggers the complement cascade.", "binding of the antibody is calcium-dependent.", "only CRP acts as an opsonin."], "x": "<b>Answer key: a. CRP acts before the antibody appears.</b><br><b>Why (from the chapter):</b> CRP acts somewhat like an antibody because it is capable of opsonization (the coating of foreign particles), agglutination, precipitation, and activation of complement by the classical pathway. Thus, CRP can be thought of as a primitive, nonspecific form of an antibody molecule that is able to act as a defense against microorganisms or foreign cells until specific antibodies can be produced.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>only the antibody triggers the complement cascade.</b> — The only treatment is a liver transplant. AAT can also react with any serine protease, such as proteases generated by the triggering of the complement cascade or fibrinolysis.</li><li><b>binding of the antibody is calcium-dependent.</b> — However, binding is calcium-dependent and nonspecific.</li></ul>", "r": "Book p. 35", "l": ""}, {"id": 51, "s": 2, "im": "", "q": "How does innate immunity differ from adaptive immunity?", "c": "Innate immunity depends upon normally present body functions.", "w": ["Innate immunity requires prior exposure to a pathogen.", "Innate immunity develops later than adaptive immunity.", "Innate immunity is more specific than adaptive immunity. \u0015\u0015\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012"], "x": "<b>Answer key: b. Innate immunity depends upon normally present body functions.</b><br><b>Why (from the chapter):</b> Nonetheless, the overall importance of NK cells as a defense mechanism is demonstrated by the fact that patients who lack these cells have recurring, serious viral infections and an increased incidence of tumors. • Innate immunity encompasses all the body’s normally present defense mechanisms for resisting disease. The two systems, however, are highly interactive and interdependent; innate immunity actually sets the stage for the more specific and longer lasting adaptive immune response.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Innate immunity requires prior exposure to a pathogen.</b> — They also recognize malignant cells. • The action of NK cells does not require prior exposure and is nonspecific.</li></ul>", "r": "Book pp. 32–41", "l": ""}, {"id": 52, "s": 2, "im": "", "q": "A 40-year-old male who is a smoker develops symptoms of premature emphysema. The symptoms may be caused by a deficiency of which of the following acute-phase reactants?", "c": "Alpha1-antitrypsin", "w": ["Haptoglobin", "Fibrinogen", "Ceruloplasmin /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN"], "x": "<b>Answer key: b. Alpha1-antitrypsin</b><br><b>Why (from the chapter):</b> Some of the most important ones are C-reactive protein, serum amyloid A, complement components, alpha1-antitrypsin, haptoglobin, fibrinogen, and ceruloplasmin. They are produced primarily by hepatocytes (liver parenchymal cells) within 12 to 24 hours in response to an increase in cytokines (see Chapter 6 for a complete discussion of cytokines).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Haptoglobin</b> — Once bound to AAT, the protease is completely inactivated and is subsequently removed from the area of tissue damage. )BQUPHMPCJO Haptoglobin is an alpha2-globulin with a molecular weight of 100,000 daltons.</li><li><b>Fibrinogen</b> — Normal plasma concentrations range from 40 to 290 mg/dL. &#x27;JCSJOPHFO Fibrinogen is an acute-phase protein involved in the coagulation pathway.</li></ul>", "r": "Book p. 35", "l": ""}, {"id": 53, "s": 2, "im": "", "q": "Which statement best describes NK cells?", "c": "They are able to kill target cells without previous exposure to them. Adaptive Immunity $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0015 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: TCELL DIFFERENTIATION Double-Negative Stage Double-Positive Stage Mature T Cells STAGES IN BCELL DIFFERENTIATION Pro-B Cells Pre-B Cells Immature B Cells Mature B Cells Plasma Cells THE ROLE OF T CELLS IN THE ADAPTIVE IMMUNE RESPONSE Action of T Helper Cells Action of Cytotoxic T Cells THE ROLE OF B CELLS IN THE ADAPTIVE IMMUNE RESPONSE Response to T-Dependent Antigens Response to T-Independent Antigens LABORATORY IDENTIFICATION OF LYMPHOCYTES", "w": ["Their response against pathogens is very specific.", "They only react when an abundance of MHC antigens is present.", "They react when both an inhibitory and activating signal is triggered."], "x": "<b>Answer key: d. They are able to kill target cells without previous exposure to them. Adaptive Immunity $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0015 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: TCELL DIFFERENTIATION Double-Negative Stage Double-Positive Stage Mature T Cells STAGES IN BCELL DIFFERENTIATION Pro-B Cells Pre-B Cells Immature B Cells Mature B Cells Plasma Cells THE ROLE OF T CELLS IN THE ADAPTIVE IMMUNE RESPONSE Action of T Helper Cells Action of Cytotoxic T Cells THE ROLE OF B CELLS IN THE ADAPTIVE IMMUNE RESPONSE Response to T-Dependent Antigens Response to T-Independent Antigens LABORATORY IDENTIFICATION OF LYMPHOCYTES</b><br><b>Why (from the chapter):</b> The two systems, however, are highly interactive and interdependent; innate immunity actually sets the stage for the more specific and longer lasting adaptive immune response. This capability is called recognition of missing self. • NK cells bind to and kill any antibody-coated target cells. • NK cells represent an important link between the innate and adaptive immune systems.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Their response against pathogens is very specific.</b> — The fact that they lack specificity in their response is essential to their function as early defenders against pathogens. By quickly engaging infected target cells, NK cells give the immune system time to activate the adaptive response of specific T and B cells.</li><li><b>They only react when an abundance of MHC antigens is present.</b> — If NK cells react with class I MHC proteins, then inhibition of natural killing occurs.</li><li><b>They react when both an inhibitory and activating signal is triggered.</b> — The inhibitory signal is based on recognition of class I major histocompatibility complex (MHC) proteins, which are expressed on all healthy cells (see Chapter 2 for details).</li></ul>", "r": "Book pp. 32–42", "l": ""}, {"id": 54, "s": 3, "im": "", "q": "Which MHC molecule is necessary for antigen recognition by CD4+ T cells?", "c": "Class II", "w": ["Class I", "Class III", "No MHC molecule is necessary."], "x": "<b>Answer key: b. Class II</b><br><b>Why (from the chapter):</b> CD4+ T cells recognize exogenous antigen on a macrophage along with class II MHC. Action of T Helper Cells The first activating signal to induce transformation of a T cell occurs when a CD4+ T cell encounters an antigen along with a class II MHC molecule and binds by using its antigen receptor.", "r": "Book pp. 54–57", "l": ""}, {"id": 55, "s": 3, "im": "", "q": "Which would be characteristic of a T-independent antigen?", "c": "It consists of a limited number of repeating determinants.", "w": ["The IgG antibody is produced exclusively.", "A large number of memory cells are produced.", "Antigens bind only one receptor on B cells."], "x": "<b>Answer key: d. It consists of a limited number of repeating determinants.</b><br><b>Why (from the chapter):</b> The TCR that recognizes antigen consists of two chains, α and β, which have constant and variable regions. T cells bearing the CD4 receptor are mainly T helper (Th) cells, whereas the CD8+ population consists of cytotoxic T cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>The IgG antibody is produced exclusively.</b> — Therefore, the antibody found in the greatest concentration in the serum is IgG. (See Chapter 5 for a complete discussion on types of immunoglobulins.) Once formed, plasma cells leave the lymph nodes and circulate in the peripheral tissues.</li><li><b>A large number of memory cells are produced.</b> — The activity of cytokines produced by Th cells produces transformation of naïve B cells into antibody-producing plasma cells and memory cells. abundant cytoplasmic immunoglobulin and little to no surface immunoglobulin21 (Fig. 4–9).</li><li><b>Antigens bind only one receptor on B cells.</b> — Cytokines are released from the T cell, which enhance B-cell transformation to plasma cells. (B) T-independent antigens can bind to B cells through immunoglobulin receptors and trigger B-cell transformation directly.</li></ul>", "r": "Book p. 48", "l": ""}, {"id": 56, "s": 3, "im": "", "q": "Humoral immunity refers to which of the following?", "c": "Production of antibody by plasma cells", "w": ["Production of cytokines by T cells", "Elimination of virally infected cells by cytotoxic cells", "Downregulation of the immune response"], "x": "<b>Answer key: a. Production of antibody by plasma cells</b><br><b>Why (from the chapter):</b> The production of antibodies by plasma cells is called humoral immunity. Cytokine production by the T cell causes B cells to proliferate and produce plasma cells, which secrete antibody. this built-in memory that distinguishes the adaptive immune response from innate immunity.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Production of cytokines by T cells</b> — TH9 TReg TH2 IL-9 (!$#) IL-4 IL-5 IL-13 Effector cytokines Mast cells, B cells, Eosinophils Humoral immunity antiparasitic When antigen recognition occurs in the secondary lymphoid tissue, T lymphocytes are activated and differentiate into functionally active small lymphocytes that produce cytokines</li><li><b>Elimination of virally infected cells by cytotoxic cells</b> — Some CD4+ cells secrete interleukins that recruit macrophages and neutrophils, whereas others activate CD8+ T cells to increase cytotoxicity against virally infected cells.</li><li><b>Downregulation of the immune response</b> — This type of immune response is known as cell-mediated immunity.</li></ul>", "r": "Book pp. 52–57", "l": ""}, {"id": 57, "s": 3, "im": "", "q": "Where does antigen-independent maturation of B lymphocytes take place?", "c": "Bone marrow", "w": ["Thymus", "Spleen", "Lymph nodes \u0017\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012 /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN"], "x": "<b>Answer key: a. Bone marrow</b><br><b>Why (from the chapter):</b> B lymphocytes mature in the bone marrow and differentiate into plasma cells that produce antibodies. All of these factors are produced in the microenvironment of the bone marrow.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Thymus</b> — T lymphocytes mature in the thymus and serve a regulatory role by providing help to B cells in responding to antigens as well as by killing virally infected target cells.</li><li><b>Spleen</b> — Unlike marginal B cells that remain in the spleen, follicular B cells are constantly recirculating throughout the secondary lymphoid organs.</li><li><b>Lymph nodes \u0017\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012 /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN</b> — T cells circulate continuously through the bloodstream, lymph nodes, and secondary lymphoid tissue searching for antigen.</li></ul>", "r": "Book pp. 46–51", "l": ""}, {"id": 58, "s": 3, "im": "", "q": "In the thymus, positive selection of immature T cells is based upon recognition of which of the following?", "c": "MHC antigens", "w": ["Self-antigens", "Stress proteins", "µ chains"], "x": "<b>Answer key: c. MHC antigens</b><br><b>Why (from the chapter):</b> The major portion of it is common to all T cells, but two chains—alpha and beta—contain variable regions that can bind to only certain antigens. • Positive selection of immature T cells is based on interaction with the unique MHC antigens of the host. • Negative selection in T-cell maturation is based on interaction with self-antigens of the host. Immature B cells MHC restriction Negative selection Plasma cell Positive selection Pre-B cells Pro-B cells Surrogate light chain T-dependent antigens T helper (Th) cells ", "r": "Book pp. 46–58", "l": ""}, {"id": 59, "s": 3, "im": "", "q": "Which of these are found on a mature B cell?", "c": "IgM and IgD", "w": ["IgG and IgD", "Alpha and beta chains", "CD3"], "x": "<b>Answer key: b. IgM and IgD</b><br><b>Why (from the chapter):</b> In addition to IgM, all mature B cells exhibit immunoglobulin D (IgD), another class of antibody molecule, on their surface (see Fig. 4–7D). Both IgM and IgD have the same specificity for a particular antigen or group of antigens.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgG and IgD</b> — The results show decreased immunoglobulin levels, especially of IgG.</li><li><b>Alpha and beta chains</b> — The TCR consists of two specific chains, called alpha (α) and beta (β) chains, which both contain variable regions that recognize specific antigens (Fig. 4–3).</li><li><b>CD3</b> — Four other types of chains are collectively know
