n as CD3.</li></ul>", "r": "Book p. 52", "l": ""}, {"id": 60, "s": 3, "im": "", "q": "How do cytotoxic T cells kill target cells?", "c": "They produce granzymes that stimulate apoptosis.", "w": ["They produce antibodies that bind to the cell.", "They engulf the cell by phagocytosis.", "They stop protein synthesis in the target cell."], "x": "<b>Answer key: d. They produce granzymes that stimulate apoptosis.</b><br><b>Why (from the chapter):</b> Granzymes can also activate enzymes in the target cell that disrupt the cell’s mitochondria. The end result in either case is apoptosis or cell death. Here they bind and kill infected cells by triggering apoptosis.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They stop protein synthesis in the target cell.</b> — Once a cytotoxic T cell has bound to a target cell, the granules move within the T cell to the site where the target cell has bound.</li></ul>", "r": "Book p. 54", "l": ""}, {"id": 61, "s": 3, "im": "", "q": "Which of the following can be attributed to antigen-stimulated T cells?", "c": "Cytokines", "w": ["Humoral response", "Plasma cells", "Antibody"], "x": "<b>Answer key: c. Cytokines</b><br><b>Why (from the chapter):</b> Cytokines acting on B cells determine the class of antibody that will be expressed. These cells are called Th9 and Th17, based on the type of cytokines they produce.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Plasma cells</b> — Most class switching results in IgG-producing plasma cells.</li><li><b>Antibody</b> — Activated Th cells also enhance antibody production by B cells.</li></ul>", "r": "Book pp. 49–57", "l": ""}, {"id": 62, "s": 3, "im": "", "q": "Which is a distinguishing feature of a pre-B cell?", "c": "µ chains in the cytoplasm", "w": ["Complete IgM on the surface", "Presence of CD21 antigen", "Presence of CD25 antigen"], "x": "<b>Answer key: a. µ chains in the cytoplasm</b><br><b>Why (from the chapter):</b> Once surface immunoglobulins appear, µ chains are no longer detectable in the cytoplasm. The µ chains accumulate in the cytoplasm. Pre-B cells may also express µ chains on the cell surface, accompanied by an unusual light chain molecule called a surrogate light chain. Surrogate light chains consist of two short polypeptide chains that are noncovalently associated with each other, along with two shorter chains, Ig-α and Ig-β, which are signal-transducing subunits14 (see Fig. 4–7B).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Complete IgM on the surface</b> — If, however, gene rearrangement does not work, then B-cell development is halted and cells are destroyed by apoptosis. Immature B Cells Immature B cells are distinguished by the appearance of complete IgM antibody molecules on the cell surface 2, (see Fig. 4–7C).</li><li><b>Presence of CD21 antigen</b> — Presence of the CD21 receptor enhances the likelihood of contact between B cells and antigens because antigens frequently become coated with complement fragments during the immune response.</li><li><b>Presence of CD25 antigen</b> — Exposure to antigen presented by macrophages causes production of CD25 receptors for interleukin-2 (IL-2).</li></ul>", "r": "Book p. 52", "l": ""}, {"id": 63, "s": 3, "im": "", "q": "When does genetic rearrangement for coding of antibody light chains take place during B-cell development?", "c": "As the cell becomes an immature B cell", "w": ["Before the pre-B cell stage", "Not until the cell becomes a mature B cell", "When the B cell becomes a plasma cell"], "x": "<b>Answer key: b. As the cell becomes an immature B cell</b><br><b>Why (from the chapter):</b> If, however, gene rearrangement does not work, then B-cell development is halted and cells are destroyed by apoptosis. Immature B Cells Immature B cells are distinguished by the appearance of complete IgM antibody molecules on the cell surface 2, (see Fig. 4–7C). If positively selected, the T cell becomes single-positive (SP); that is, either CD4+ or CD8+.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Before the pre-B cell stage</b> — When synthesis of the heavy-chain part of the antibody molecule occurs, the pre-B stage begins. The first heavy chains synthesized are the µ chains, which belong to the class of immunoglobulins called immunoglobulin M (IgM).</li><li><b>When the B cell becomes a plasma cell</b> — This process can be divided into three distinct phases: • Development of mature immunocompetent B cells • Activation of B cells by antigen • Differentiation of activated B cells into plasma cells, which produce antibodies The first phase of B-cell development in the bone marrow, which results in mat</li></ul>", "r": "Book pp. 47–52", "l": ""}, {"id": 64, "s": 3, "im": "", "q": "Which of the following antigens are found on the T-cell subset known as helper/inducers?", "c": "CD4", "w": ["CD3", "CD8", "CD11"], "x": "<b>Answer key: b. CD4</b><br><b>Why (from the chapter):</b> Laboratory analysis usually involves distinguishing the following lymphocyte subsets: T cytotoxic cells (CD8), Th cells (CD4), and B cells. CD4+ T cells are known as Th cells and CD8+ T cells are called cytotoxic T cells (Tc).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>CD3</b> — Four other types of chains are collectively known as CD3.</li><li><b>CD8</b> — T cells bearing the CD4 receptor are mainly T helper (Th) cells, whereas the CD8+ population consists of cytotoxic T cells.</li></ul>", "r": "Book pp. 54–58", "l": ""}, {"id": 65, "s": 3, "im": "", "q": "Where does the major portion of antibody production occur?", "c": "Lymph nodes", "w": ["Peripheral blood", "Bone marrow", "Thymus"], "x": "<b>Answer key: d. Lymph nodes</b><br><b>Why (from the chapter):</b> T cells circulate continuously through the bloodstream, lymph nodes, and secondary lymphoid tissue searching for antigen. Therefore, the antibody found in the greatest concentration in the serum is IgG. (See Chapter 5 for a complete discussion on types of immunoglobulins.) Once formed, plasma cells leave the lymph nodes and circulate in the peripheral tissues.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Peripheral blood</b> — Surviving CD4+ and CD8+ cells exit the thymus to the peripheral blood.</li><li><b>Bone marrow</b> — All of these factors are produced in the microenvironment of the bone marrow.</li><li><b>Thymus</b> — T-lymphocyte precursors (TP) enter the thymus at the corticomedullary junction.</li></ul>", "r": "Book pp. 54–57", "l": ""}, {"id": 66, "s": 3, "im": "", "q": "Which of the following would represent a doublenegative thymocyte?", "c": "CD2+CD3+CD4–CD8–", "w": ["CD2–CD3+CD4–CD8+", "CD2–CD3–CD4+CD8–", "CD2–CD3–CD4+CD8–"], "x": "<b>Answer key: c. CD2+CD3+CD4–CD8–</b><br><b>Why (from the chapter):</b> Some of the more common antigens tested for include CD2, CD3, CD4, and CD8 on T cells and CD19, CD20, CD22, and surface immunoglobulin on B cells.", "r": "Book p. 58", "l": ""}, {"id": 67, "s": 3, "im": "", "q": "Which of the following best describes the T-cell receptor for antigen?", "c": "Alpha and beta chains are unique for each antigen.", "w": ["It consists of IgM and IgD molecules.", "It is the same for all T cells.", "It is present in the double-negative stage."], "x": "<b>Answer key: d. Alpha and beta chains are unique for each antigen.</b><br><b>Why (from the chapter):</b> The major portion of it is common to all T cells, but two chains—alpha and beta—contain variable regions that can bind to only certain antigens. • Positive selection of immature T cells is based on interaction with the unique MHC antigens of the host. • Negative selection in T-cell maturation is based on interaction with self-antigens of the host. The TCR consists of two specific chains, called alpha (α) and beta (β) chains, which both contain variable regions that recognize specific antigens (Fig. 4–3).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>It consists of IgM and IgD molecules.</b> — IgM molecules thus serve as the receptor for antigen.</li><li><b>It is the same for all T cells.</b> — All the daughter cells will have the same receptor as the parent cell for the initiating antigen.</li><li><b>It is present in the double-negative stage.</b> — Double-Negative Stage Early thymocytes lack CD4 and CD8 markers, which are important to their later function; hence, they are known as double-negative (DN) thymocytes (Fig. 4–2).</li></ul>", "r": "Book pp. 47–58", "l": ""}, {"id": 68, "s": 3, "im": "", "q": "A cell flow cytometry pattern belonging to a 3-yearold patient showed the following: normal CD4+ T-cell count, normal CD19+ B-cell count, low CD8+ T-cell count. Which type of immunity would be affected?", "c": "Elimination of virally infected cells", "w": ["Production of antibody", "Formation of plasma cells", "Downregulation of the immune response"], "x": "<b>Answer key: c. Elimination of virally infected cells</b><br><b>Why (from the chapter):</b> Some CD4+ cells secrete interleukins that recruit macrophages and neutrophils, whereas others activate CD8+ T cells to increase cytotoxicity against virally infected cells. T lymphocytes mature in the thymus and serve a regulatory role by providing help to B cells in responding to antigens as well as by killing virally infected target cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Production of antibody</b> — Cytokine production by the T cell causes B cells to proliferate and produce plasma cells, which secrete antibody. this built-in memory that distinguishes the adaptive immune response from innate immunity.</li><li><b>Formation of plasma cells</b> — The CD40 on B cells must interact with CD40L on Th cells in order for germinal center formation to occur. Here, both plasma cells and memory cells are formed (Fig. 4–13).</li><li><b>Downregulation of the immune response</b> — This type of immune response is known as cell-mediated immunity.</li></ul>", "r": "Book pp. 46–55", "l": ""}, {"id": 69, "s": 3, "im": "", "q": "Which of the following is a unique characteristic of adaptive immunity?", "c": "Ability to remember a prior exposure to a pathogen", "w": ["Ability to fight infection", "A similar response to all pathogens encountered", "Process of phagocytosis to destroy a pathogen"], "x": "<b>Answer key: b. Ability to remember a prior exposure to a pathogen</b><br><b>Why (from the chapter):</b> Adaptive immunity, in contrast, is a type of resistance characterized by: • Specificity for each individual pathogen or microbial agent • The ability to remember a prior exposure • An increased response to that pathogen upon repeated exposure Adaptive immunity is a more tailored response.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Ability to fight infection</b> — You and a friend of yours in your immunology class are discussing how the body is able to fight infection.</li><li><b>A similar response to all pathogens encountered</b> — Memory cells are progeny of B cells that have been exposed to antigen; they are characterized by a long life span and a rapid response to second exposure to the triggering antigen. They are similar in appearance to unstimulated B cells, but they remain in an activated state for months or years, read</li></ul>", "r": "Book p. 46", "l": ""}, {"id": 70, "s": 3, "im": "", "q": "Clonal deletion of T cells as they mature is important in which of the following processes?", "c": "Elimination of autoimmune responses", "w": ["Positive selection of CD3/TCR receptors", "Allelic exclusion of chromosomes", "Elimination of cells unable to bind to MHC antigens"], "x": "<b>Answer key: a. Elimination of autoimmune responses</b><br><b>Why (from the chapter):</b> Strong reactions with self-peptides other than MHC antigens triggers apopotosis. The process of elimination of clones of T cells that would be capable of an autoimmune response is called clonal deletion.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Positive selection of CD3/TCR receptors</b> — Positive and negative selection takes place through the CD3/T-cell receptor for antigen.</li><li><b>Allelic exclusion of chromosomes</b> — The selection of an allele on one chromosome only is known as allelic exclusion.</li><li><b>Elimination of cells unable to bind to MHC antigens</b> — The major portion of it is common to all T cells, but two chains—alpha and beta—contain variable regions that can bind to only certain antigens. • Positive selection of immature T cells is based on interaction with the unique MHC antigens of the host. • Negative selection in T-cell maturation is bas</li></ul>", "r": "Book p. 48", "l": ""}, {"id": 71, "s": 3, "im": "", "q": "Where do germinal centers occur?", "c": "In lymph nodes Antibody Structure and Function \u0016 $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: TETRAPEPTIDE STRUCTURE OF IMMUNOGLOBULINS THE NATURE OF LIGHT CHAINS HEAVYCHAIN SEQUENCING HINGE REGION THREEDIMENSIONAL STRUCTURE OF ANTIBODIES Immunoglobulin G (IgG) Immunoglobulin M (IgM) Immunoglobulin A (IgA) Immunoglobulin D (IgD) Immunoglobulin E (IgE) THEORIES TO EXPLAIN ANTIBODY DIVERSITY Ehrlich’s Side-Chain Theory Clonal Selection Hypothesis GENES CODING FOR IMMUNOGLOBULINS Rearrangement of Heavy-Chain Genes Light Chain Rearrangement MONOCLONAL ANTIBODY Hybridomas Clinical Applications", "w": ["In the thymus", "In the bone marrow", "In peripheral blood"], "x": "<b>Answer key: d. In lymph nodes Antibody Structure and Function \u0016 $ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: TETRAPEPTIDE STRUCTURE OF IMMUNOGLOBULINS THE NATURE OF LIGHT CHAINS HEAVYCHAIN SEQUENCING HINGE REGION THREEDIMENSIONAL STRUCTURE OF ANTIBODIES Immunoglobulin G (IgG) Immunoglobulin M (IgM) Immunoglobulin A (IgA) Immunoglobulin D (IgD) Immunoglobulin E (IgE) THEORIES TO EXPLAIN ANTIBODY DIVERSITY Ehrlich’s Side-Chain Theory Clonal Selection Hypothesis GENES CODING FOR IMMUNOGLOBULINS Rearrangement of Heavy-Chain Genes Light Chain Rearrangement MONOCLONAL ANTIBODY Hybridomas Clinical Applications</b><br><b>Why (from the chapter):</b> When synthesis of the heavy-chain part of the antibody molecule occurs, the pre-B stage begins. The first heavy chains synthesized are the µ chains, which belong to the class of immunoglobulins called immunoglobulin M (IgM). During this maturation process, the first step in the pro-B phase is the rearrangement of genes that code for the heavy and light chains of an antibody molecule.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>In the thymus</b> — T-lymphocyte precursors (TP) enter the thymus at the corticomedullary junction.</li><li><b>In the bone marrow</b> — They are not normally found in the blood; rather. they are located in germinal centers in the peripheral lymphoid organs or they reside in the bone marrow.</li><li><b>In peripheral blood</b> — They are not normally found in the blood; rather. they are located in germinal centers in the peripheral lymphoid organs or they reside in the bone marrow.</li></ul>", "r": "Book pp. 51–52", "l": ""}, {"id": 72, "s": 4, "im": "", "q": "Which of the following is characteristic of variable domains of immunoglobulins?", "c": "They occur on both the H and L chains.", "w": ["They represent the complement-binding site.", "They are at the carboxy-terminal ends of the molecules.", "They are found only on H chains."], "x": "<b>Answer key: a. They occur on both the H and L chains.</b><br><b>Why (from the chapter):</b> Each of these regions, called complementarity-determining regions (CDRs), is between 9 and 12 residues long. They occur as loops in the folds of the variable regions of both L and H chains. This Isotype Allotype Idiotype Heavy-Chain Sequencing Heavy-chain sequencing demonstrates the presence of domains similar to those in the L chains—that is, variable and constant regions.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>They are at the carboxy-terminal ends of the molecules.</b> — This fragment, known as the Fc fragment (for “fragment crystallizable”), had no antigen-binding ability and is now known to represent the carboxy-terminal halves of two H chains that are held together by S–S bonding. The Fc fragment is important in effector functions of immunoglobulin molecules, whi</li><li><b>They are found only on H chains.</b> — IgA has a dimeric form, whereas IgM is a pentamer whose subunits are held together by a J chain. • Kappa and lambda (L chains) are found in all types of immunoglobulins, but the H chains differ for each immunoglobulin class. • Each immunoglobulin molecule has constant and variable regions.</li></ul>", "r": "Book pp. 64–65", "l": ""}, {"id": 73, "s": 4, "im": "", "q": "All of the following are true of IgM except that it", "c": "can cross the placenta.", "w": ["fixes complement.", "has a J chain.", "is a primary response antibody."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: a. can cross the placenta.</b><br><b>Why (from the chapter):</b> In the secreted form in the serum, IgD does not appear to serve a protective function because it does not bind complement, it does not bind to neutrophils or macrophages, and it does not cross the placenta. Immunoglobulin E (IgE) IgE is best known for its very low concentration in serum and the fact that it has the ability to activate mast cells and basophils. Additionally, it is incapable of crossing the placenta.", "r": "Book p. 69", "l": ""}, {"id": 74, "s": 4, "im": "", "q": "How does the structure of IgE differ from that of IgG?", "c": "IgE has one more constant region than IgG.", "w": ["IgG has a secretory component and IgE does not.", "IgG has more antigen-binding sites than IgE.", "IgG has more light chains than IgE."], "x": "<b>Answer key: b. IgE has one more constant region than IgG.</b><br><b>Why (from the chapter):</b> These classes are designated as IgG, IgM, IgA, IgD, and IgE (with Ig being the abbreviation for immunoglobulin). This allows the same VDJ region to be coupled with a different C region to produce antibody of a different class (i.e., IgA, IgG, or IgE) but with the identical specificity for antigen. Contact with T cells and with cytokines provides the signal for switching to take place.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgG has a secretory component and IgE does not.</b> — Idiotype Immunoglobulin Isotype Joining (J) chain Kappa (κ) chains Lambda (λ) chains Light (L) chains Monoclonal antibodies Primary response Secondary response Secretory component (SC) Tetrapeptide Variable region involving overor underproduction of antibodies, so it will be discussed in later chapt</li><li><b>IgG has more antigen-binding sites than IgE.</b> — Antigen binds in the middle of the CDRs, with at least four of the CDRs involved in the binding. Thus, a small number of amino acids can create an immense diversity of antigen-binding sites.</li><li><b>IgG has more light chains than IgE.</b> — Tetrapeptide Structure of Immunoglobulins All immunoglobulin molecules are made up of a basic fourchain tetrapeptide unit that consists of two large chains called heavy or H chains and two smaller chains called light or L chains.</li></ul>", "r": "Book pp. 62–71", "l": ""}, {"id": 75, "s": 4, "im": "", "q": "How many antigen-binding sites does a typical IgM molecule have?", "c": "10", "w": ["2", "4", "6"], "x": "<b>Answer key: d. 10</b><br><b>Why (from the chapter):</b> Antigen binds in the middle of the CDRs, with at least four of the CDRs involved in the binding. Thus, a small number of amino acids can create an immense diversity of antigen-binding sites. IgM thus configured assumes a starlike shape (Fig. 5–6) with 10 functional binding sites.", "r": "Book pp. 65–67", "l": ""}, {"id": 76, "s": 4, "im": "", "q": "Bence Jones proteins are identical to which of the following?", "c": "L chains", "w": ["H chains", "IgM molecules", "IgG molecules"], "x": "<b>Answer key: b. L chains</b><br><b>Why (from the chapter):</b> Analysis of several Bence Jones proteins revealed that there were two main types of L chains, which were designated kappa (κ) chains and lambda (λ) chains. The Nature of Light Chains The difficulty in obtaining a significant amount of a specific immunoglobulin for amino acid analysis was overcome by the chance discovery that Bence Jones proteins, found in the urine of patients with multiple myeloma, were in fact L chains that were being secreted by the malignant plasma cells. Dr.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgG molecules</b> — Edelman’s work centered on using the analytic ultracentrifuge, a very high speed centrifuge, to separate out immunoglobulins on the basis of molecular weight. He found that intact IgG molecules had a sedimentation coefficient of 7 S (the Svedberg unit [S] indicates the sedimentation rate in an analy</li></ul>", "r": "Book p. 64", "l": ""}, {"id": 77, "s": 4, "im": "", "q": "A Fab fragment consists of", "c": "one L chain and one-half of an H chain.", "w": ["two H chains.", "two L chains.", "one L chain and an entire H chain."], "x": "<b>Answer key: c. one L chain and one-half of an H chain.</b><br><b>Why (from the chapter):</b> Each Fab fragment thus consists of one L chain and one-half of an H chain held together by disulfide bonding4, (see Fig. 5–2).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>two H chains.</b> — Each of the two globular domains consists of a barrel-shaped assembly of seven to nine antiparallel β strands (polypeptide chains).</li><li><b>two L chains.</b> — Each of the two globular domains consists of a barrel-shaped assembly of seven to nine antiparallel β strands (polypeptide chains).</li><li><b>one L chain and an entire H chain.</b> — The VJD gene combination codes for the entire variable region of the H chain.</li></ul>", "r": "Book p. 63", "l": ""}, {"id": 78, "s": 4, "im": "", "q": "Which antibody best protects mucosal surfaces?", "c": "IgA", "w": ["IgG", "IgD", "IgM"], "x": "<b>Answer key: a. IgA</b><br><b>Why (from the chapter):</b> The success of oral immunizations such as the Sabin vaccine, which induces IgA almost exclusively, demonstrates the effectiveness of IgA’s protective role on mucosal surfaces. It plays an important role in neutralizing toxins produced by microorganisms and helps to prevent bacterial and viral adherence to mucosal surfaces. Complexes of IgA and antigen are easily trapped in mucus and then eliminated by the ciliated epithelial cells of the respiratory or intestinal tract.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgG</b> — IgG1and IgG3 are induced in response to protein antigens, whereas IgG2 and IgG4 are associated with polysaccharide antigens. Macrophages, monocytes, and neutrophils have receptors on their surfaces that are specific for the FC region of IgG.</li><li><b>IgD</b> — In the secreted form in the serum, IgD does not appear to serve a protective function because it does not bind complement, it does not bind to neutrophils or macrophages, and it does not cross the placenta. Immunoglobulin E (IgE) IgE is best known for its very low concentration in serum and the fact</li><li><b>IgM</b> — L chains are then joined with µ chains to form a complete IgM antibody, which first appears in immature B cells.</li></ul>", "r": "Book p. 68", "l": ""}, {"id": 79, "s": 4, "im": "", "q": "Which of the following pairs represents two different immunoglobulin allotypes?", "c": "IgG1m3 and IgG1m17", "w": ["IgM and IgG", "IgM1 and IgM2", "Anti-human IgM and anti-human IgG"], "x": "<b>Answer key: d. IgG1m3 and IgG1m17</b><br><b>Why (from the chapter):</b> See the chapter section on this topic.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgM and IgG</b> — Immunoglobulin M (IgM) IgM is known as a macroglobulin because it has a sedimentation rate of 19 S, which represents a molecular weight of approximately 900,000. The half-life of IgM is about 6 days, much shorter than that of IgG (see Table 5–1).</li><li><b>Anti-human IgM and anti-human IgG</b> — Immunoglobulin M (IgM) IgM is known as a macroglobulin because it has a sedimentation rate of 19 S, which represents a molecular weight of approximately 900,000. The half-life of IgM is about 6 days, much shorter than that of IgG (see Table 5–1).</li></ul>", "r": "", "l": ""}, {"id": 80, "s": 4, "im": "", "q": "The structure of a typical immunoglobulin consists of which of the following?", "c": "2L and 2H chains", "w": ["4L and 2H chains", "4L and 4H chains", "2L and 4 H chains"], "x": "<b>Answer key: a. 2L and 2H chains</b><br><b>Why (from the chapter):</b> Tetrapeptide Structure of Immunoglobulins All immunoglobulin molecules are made up of a basic fourchain tetrapeptide unit that consists of two large chains called heavy or H chains and two smaller chains called light or L chains. In any one immunoglobulin molecule, the two H chains are identical as are the two L chains.", "r": "Book pp. 61–63", "l": ""}, {"id": 81, "s": 4, "im": "", "q": "Which of the following are L chains of antibody molecules?", "c": "Kappa", "w": ["Gamma", "Mu", "Alpha"], "x": "<b>Answer key: a. Kappa</b><br><b>Why (from the chapter):</b> Analysis of several Bence Jones proteins revealed that there were two main types of L chains, which were designated kappa (κ) chains and lambda (λ) chains. IgA has a dimeric form, whereas IgM is a pentamer whose subunits are held together by a J chain. • Kappa and lambda (L chains) are found in all types of immunoglobulins, but the H chains differ for each immunoglobulin class. • Each immunoglobulin molecule has constant and variable regions.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Gamma</b> — Hence, an early name for antibody was gamma globulin.</li><li><b>Alpha</b> — Thus, two Fab arms can cover a good bit of territory. Such flexibility also assists in effector functions including initiation of the complement cascade (see Chapter 7 for details) and binding to cells with specific receptors for the Fc portion of the molecule. Gamma, delta, and alpha chains all hav</li></ul>", "r": "Book pp. 64–73", "l": ""}, {"id": 82, "s": 4, "im": "", "q": "If the results of serum protein electrophoresis show a significant decrease in the gamma band, which of the following is a likely possibility?", "c": "Immunodeficiency disorder", "w": ["Normal response to active infection", "Multiple myeloma", "Monoclonal gammopathy"], "x": "<b>Answer key: c. Immunodeficiency disorder</b><br><b>Why (from the chapter):</b> See the chapter section on this topic.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Normal response to active infection</b> — This differs from the normal response to an antigen, which is heterogeneous, because even a purified antigen has multiple epitopes that stimulate a variety of B cells.</li><li><b>Multiple myeloma</b> — IgD was not discovered until 1965, when it was found in a patient with multiple myeloma, a cancer of the plasma cells.</li></ul>", "r": "", "l": ""}, {"id": 83, "s": 4, "im": "", "q": "The subclasses of IgG differ mainly in", "c": "the arrangement of disulfide bonds.", "w": ["the type of L chain.", "the ability to act as opsonins.", "molecular weight."], "x": "<b>Answer key: b. the arrangement of disulfide bonds.</b><br><b>Why (from the chapter):</b> These differ in the number and linkages of the disulfide bonds. types. The exact number of disulfide bonds differs among antibody classes and subclasses.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>the type of L chain.</b> — Constant regions of the H chain are unique to each class and give each immunoglobulin type its name.</li><li><b>molecular weight.</b> — The molecular weight of the H or µ chain is approximately 70,000.</li></ul>", "r": "Book pp. 64–66", "l": ""}, {"id": 84, "s": 4, "im": "", "q": "Which best describes the role of the secretory component of IgA?", "c": "A transport mechanism across endothelial cells", "w": ["A means of joining two IgA monomers together", "An aid to trapping antigen", "Enhancement of complement fixation by the classical pathway"], "x": "<b>Answer key: a. A transport mechanism across endothelial cells</b><br><b>Why (from the chapter):</b> The J chain is essential for the polymerization and secretion of IgA. Secretory IgA is synthesized in plasma cells found mainly in mucosal-associated lymphoid tissue and is released in dimeric form. It plays an important role in neutralizing toxins produced by microorganisms and helps to prevent bacterial and viral adherence to mucosal surfaces. Complexes of IgA and antigen are easily trapped in mucus and then eliminated by the ciliated epithelial cells of the respiratory or intestinal tract.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>A means of joining two IgA monomers together</b> — The IgA dimer consists of two monomers held together by a J chain that has a molecular weight of about 15,000.</li><li><b>Enhancement of complement fixation by the classical pathway</b> — The primary response is characterized by a long lag phase, whereas the secondary or anamnestic response has a shortened lag phase and a much more rapid increase in antibody titer, mainly IgG. the classical complement pathway (see Chapter 7) because a single molecule can initiate the reaction as a re</li></ul>", "r": "Book p. 68", "l": ""}, {"id": 85, "s": 4, "im": "", "q": "Which represents the main function of IgD?", "c": "Enhancing proliferation of B cells", "w": ["Protection of the mucous membranes", "Removal of antigens by complement fixation", "Destruction of parasitic worms"], "x": "<b>Answer key: c. Enhancing proliferation of B cells</b><br><b>Why (from the chapter):</b> Functions of the carbohydrate include (1) increasing the solubility of immunoglobulin, (2) providing protection against degradation, and (3) enhancing functional activity of the FC domains. In the secreted form in the serum, IgD does not appear to serve a protective function because it does not bind complement, it does not bind to neutrophils or macrophages, and it does not cross the placenta. Immunoglobulin E (IgE) IgE is best known for its very low concentration in serum and the fact that it has the ability to ac<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Removal of antigens by complement fixation</b> — IgE does not participate in typical immunoglobulin reactions such as complement fixation, agglutination, or opsonization.</li></ul>", "r": "Book pp. 64–69", "l": ""}, {"id": 86, "s": 4, "im": "", "q": "Which antibody is best at agglutination and complement fixation?", "c": "IgM \u0018\u0017\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012", "w": ["IgA", "IgG", "IgD"], "x": "<b>Answer key: d. IgM \u0018\u0017\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012</b><br><b>Why (from the chapter):</b> The functions of IgM include (1) complement fixation, (2) agglutination, (3) opsonization, and (4) toxin neutralization.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgA</b> — Lack of complement activation may actually assist in clearing antigen without triggering an inflammatory response, thus minimizing tissue damage. Additionally, neutrophils, monocytes, and macrophages possess specific receptors for IgA.</li><li><b>IgG</b> — Agglutination is the clumping together of larger particles such as red blood cells (RBCs); because it is a larger molecule, IgM is much more efficient at this than IgG.</li><li><b>IgD</b> — In the secreted form in the serum, IgD does not appear to serve a protective function because it does not bind complement, it does not bind to neutrophils or macrophages, and it does not cross the placenta. Immunoglobulin E (IgE) IgE is best known for its very low concentration in serum and the fact</li></ul>", "r": "Book p. 67", "l": ""}, {"id": 87, "s": 4, "im": "", "q": "Which of the following can be attributed to the clonal selection hypothesis of antibody formation?", "c": "B cells are preprogrammed for specific antibody synthesis.", "w": ["Plasma cells make generalized antibody.", "Proteins can alter their shape to conform to antigen.", "Cell receptors break off and become circulating antibody."], "x": "<b>Answer key: b. B cells are preprogrammed for specific antibody synthesis.</b><br><b>Why (from the chapter):</b> Monoclonal Antibody The knowledge that B cells are genetically preprogrammed to synthesize very specific antibody has been used in developing monoclonal antibodies for diagnostic testing. The main drawback to the clonal selection hypothesis was consideration of the genetic basis for the diversity of antibody molecules.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Plasma cells make generalized antibody.</b> — The fact that these myeloma cells cannot make their own DNA means that they will die out unless they are fused to a plasma cell that has the enzymes necessary to synthesize DNA.</li><li><b>Cell receptors break off and become circulating antibody.</b> — New receptors would form in place of those broken off, after which this process could be repeated.</li></ul>", "r": "Book pp. 70–72", "l": ""}, {"id": 88, "s": 4, "im": "", "q": "All of the following are true of IgE except that it", "c": "is heat stable.", "w": ["fails to fix complement.", "attaches to tissue mast cells.", "is found in the serum of allergic persons."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: b. is heat stable.</b><br><b>Why (from the chapter):</b> See the chapter section on this topic.", "r": "", "l": ""}, {"id": 89, "s": 4, "im": "", "q": "Which best describes coding for immunoglobulin molecules?", "c": "Four different regions are involved in coding of H chains.", "w": ["All genes are located on the same chromosome.", "L chain rearrangement occurs before H chain rearrangement.", "Lambda rearrangement occurs before kappa rearrangement."], "x": "<b>Answer key: c. Four different regions are involved in coding of H chains.</b><br><b>Why (from the chapter):</b> Four separate regions on chromosome 14 code for H chains. Sixty percent of L chains are κ chains because they are coded for first in DNA transcription of genes coding for antibody molecules. The difference between the κ and λ chains lies in the amino acid substitutions at a few locations along the chain.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>All genes are located on the same chromosome.</b> — Human immunoglobulin genes are found in three unlinked clusters: H chain genes are located on chromosome 14, κ chain genes are on chromosome 2, and λ chain genes are on chromosome 22.</li><li><b>L chain rearrangement occurs before H chain rearrangement.</b> — If the first rearrangement is nonproductive, then rearrangement of the second set of genes on the other chromosome 14 occurs.</li><li><b>Lambda rearrangement occurs before kappa rearrangement.</b> — Analysis of several Bence Jones proteins revealed that there were two main types of L chains, which were designated kappa (κ) chains and lambda (λ) chains.</li></ul>", "r": "Book pp. 64–71", "l": ""}, {"id": 90, "s": 4, "im": "", "q": "What is the purpose of HAT medium in the preparation of monoclonal antibody?", "c": "Restricting the growth of myeloma cells", "w": ["Fusion of the two cell types", "Restricting the growth of spleen cells", "Restricting antibody production to the IgM class /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN"], "x": "<b>Answer key: b. Restricting the growth of myeloma cells</b><br><b>Why (from the chapter):</b> These cells are fused with nonsecreting myeloma cells and then plated in a restrictive medium. This culture medium separates out the hybridoma cells by allowing them to grow selectively and not allowing fused myeloma cells or fused spleen cells to survive.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Fusion of the two cell types</b> — This fusion of two different types of cells is called a hybridoma.</li><li><b>Restricting the growth of spleen cells</b> — A mouse is immunized and spleen cells are removed.</li><li><b>Restricting antibody production to the IgM class /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN</b> — L chains are then joined with µ chains to form a complete IgM antibody, which first appears in immature B cells.</li></ul>", "r": "Book pp. 72–73", "l": ""}, {"id": 91, "s": 4, "im": "", "q": "Papain digestion of an IgG molecule results in which of the following?", "c": "2 Fab and 1 Fc fragment", "w": ["2 Fab&#x27; and 1 Fc&#x27; fragment", "F(ab&#x27;)2 and 1 Fc&#x27; fragment", "2 Fab and 2 Fc fragments"], "x": "<b>Answer key: d. 2 Fab and 1 Fc fragment</b><br><b>Why (from the chapter):</b> Because precipitation would not occur if Fab fragments were allowed to react with antigen, it was guessed that each fragment represented one antigen-binding site and that two such fragments were present in an intact antibody molecule. The remaining two identical fragments were found to have antigen-binding capacity and were named Fab fragments (fragment antigen binding).<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>2 Fab and 2 Fc fragments</b> — Porter’s work was based on the use of the proteolytic enzyme papain, which was used to cleave IgG into three pieces of about equal size, each having a sedimentation coefficient of 3. S and representing a molecular weight of approximately 45,000 to 50,000 d. Carboxymethyl cellulose ion exchange chrom</li></ul>", "r": "Book p. 63", "l": ""}, {"id": 92, "s": 4, "im": "", "q": "Which antibody provides protection to the growing fetus because it is able to cross the placenta?", "c": "IgG", "w": ["IgA", "IgM", "IgD"], "x": "<b>Answer key: a. IgG</b><br><b>Why (from the chapter):</b> This allows the same VDJ region to be coupled with a different C region to produce antibody of a different class (i.e., IgA, IgG, or IgE) but with the identical specificity for antigen. Contact with T cells and with cytokines provides the signal for switching to take place. They chose to work with immunoglobulin G (IgG), the most abundant of all the antibodies.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IgA</b> — In the serum, IgA represents 10% to 15% of all circulating immunoglobulin.</li><li><b>IgM</b> — L chains are then joined with µ chains to form a complete IgM antibody, which first appears in immature B cells.</li><li><b>IgD</b> — In the secreted form in the serum, IgD does not appear to serve a protective function because it does not bind complement, it does not bind to neutrophils or macrophages, and it does not cross the placenta. Immunoglobulin E (IgE) IgE is best known for its very low concentration in serum and the fact</li></ul>", "r": "Book pp. 63–71", "l": ""}, {"id": 93, "s": 4, "im": "", "q": "Which best characterizes the secondary response?", "c": "There is a large increase in IgG ry response. Cytokines 3JUB\u0001.\u000f\u0001)FVFSU[ \u00011I% \u0001.5 &quot;4$1 \u0001 6UIBZBTIBOLFS\u00013\u000f\u0001&amp;[FLJFM \u00011I% \u0001.# &quot;4$1 $. \u0017 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: INTRODUCTION TO CYTOKINES CYTOKINES IN THE INNATE IMMUNE RESPONSE Interleukin-1 (IL-1) Tumor Necrosis Factors Interleukin-6 Chemokines Transforming Growth Factor-β Interferon-α and Interferon-β CYTOKINES IN THE ADAPTIVE IMMUNE RESPONSE Th1 Cytokines Th2 Cytokines Cytokines Associated With T Regulatory Cells TH17 CYTOKINES IN INNATE AND ADAPTIVE IMMUNE RESPONSES HEMATOPOIETIC GROWTH FACTORS CYTOKINE AND ANTICYTOKINE THERAPIES CLINICAL ASSAYS FOR CYTOKINES CASE STUDY</b> — The primary response is characterized by a long lag phase, a slow increase in antibody, and a short-lived response.</li></ul>", "r": "Book p. 67", "l": ""}, {"id": 94, "s": 5, "im": "", "q": "The ability of a single cytokine to alter the expression of several genes is called", "c": "pleiotropy.", "w": ["redundancy.", "autocrine stimulation.", "endocrine effect."], "x": "<b>Answer key: b. pleiotropy.</b><br><b>Why (from the chapter):</b> Pleiotropy means that a single cytokine can have many different actions.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>redundancy.</b> — When different cytokines activate some of the same pathways and genes, it is called redundancy.</li><li><b>autocrine stimulation.</b> — These effects are achieved through both autocrine stimulation (i.e., affecting the same cell that secreted it) and paracrine (i.e., affecting a target cell in close proximity) activities.</li></ul>", "r": "Book p. 78", "l": ""}, {"id": 95, "s": 5, "im": "", "q": "Which of the following effects can be attributed to IL-1?", "c": "Mediation of the innate immune response", "w": ["Differentiation of stem cells", "Halted growth of virally infected cells", "Stimulation of mast cells"], "x": "<b>Answer key: a. Mediation of the innate immune response</b><br><b>Why (from the chapter):</b> The main function of the innate immune response is to recruit effector cells to the area. Because Th17 cells affect both the innate and adaptive immune response, these will be discussed separately.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Differentiation of stem cells</b> — Growth of hematopoietic stem cells (HSC) requires stem cell factor (SCF) with differentiation determined by IL-7 or thrombopoietin (TPO).</li><li><b>Halted growth of virally infected cells</b> — The altered protein sequences of the receptors block or diminish the virus’s ability to enter the cells and thereby increase the infected individual’s chances of survival.</li></ul>", "r": "Book pp. 80–83", "l": ""}, {"id": 96, "s": 5, "im": "", "q": "Which of the following precursors are target cells for IL-3?", "c": "All of the above", "w": ["Myeloid precursors", "Lymphoid precursors", "Erythroid precursors"], "x": "<b>Answer key: d. All of the above</b><br><b>Why (from the chapter):</b> See the chapter section on this topic.", "r": "", "l": ""}, {"id": 97, "s": 5, "im": "", "q": "A lack of IL-4 may result in which of the following effects?", "c": "Decreased eosinophil count", "w": ["Inability to fight off viral infections", "Increased risk of tumors", "Lack of IgM"], "x": "<b>Answer key: d. Decreased eosinophil count</b><br><b>Why (from the chapter):</b> The medical team could not risk further lowering of the neutrophil count because of the increased risk of infection. As the platelet count drops, excessive bleeding occurs from every orifice in the body.", "r": "Book pp. 81–89", "l": ""}, {"id": 98, "s": 5, "im": "", "q": "Which of the following cytokines is also known as the T-cell growth factor?", "c": "IL-2", "w": ["IFN-γ", "IL-12", "IL-10"], "x": "<b>Answer key: c. IL-2</b><br><b>Why (from the chapter):</b> IL-2, also known as the T-cell growth factor, drives the growth and differentiation of both T and B cells and induces lytic activity in NK cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IFN-γ</b> — However, it is the type I IFNs consisting of IFN-α and IFN-β that function primarily in this manner.</li><li><b>IL-12</b> — For example, activated T helper (Th) cells secrete IFN-gamma, which in turn activates macrophages to secrete IL-12, which then activates Th cells to produce other cytokines.</li><li><b>IL-10</b> — T-cell suppression occurs through IL-10 inhibition of proinflammatory cytokines and inhibition of costimulatory molecule expression on APCs.</li></ul>", "r": "Book p. 84", "l": ""}, {"id": 99, "s": 5, "im": "", "q": "Which of the following represents an autocrine effect of IL-2?", "c": "Increased IL-2 receptor expression by the Th cell producing it", "w": ["Macrophages signaled to the area of antigen stimulation", "Proliferation of antigen-stimulated B cells", "Increased synthesis of acute-phase proteins throughout the body"], "x": "<b>Answer key: a. Increased IL-2 receptor expression by the Th cell producing it</b><br><b>Why (from the chapter):</b> The β and γ subunits increase the affinity of the receptor for IL-2 and are responsible for most of the signal transduction through the receptor. Fluorescence of a spot indicates that the gene was expressed in the cell and that the cell was producing the cytokine.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Macrophages signaled to the area of antigen stimulation</b> — It also inhibits antigen presentation by macrophages and dendritic cells.</li><li><b>Proliferation of antigen-stimulated B cells</b> — IL-2 alone can activate proliferation of Th2 cells and helps to generate IgG1and IgE-producing cells.</li><li><b>Increased synthesis of acute-phase proteins throughout the body</b> — This pleiotropic cytokine affects inflammation, acute-phase reactions, immunoglobulin synthesis, and the activation states of B cells and T cells.</li></ul>", "r": "Book pp. 84–87", "l": ""}, {"id": 100, "s": 5, "im": "", "q": "IFN-α and IFN-β differ in which way from IFN-gamma?", "c": "IFN-α and IFN-β inhibit cell proliferation, whereas IFN-gamma stimulates antigen presentation by class II MHC molecules.", "w": ["IFN-α and IFN-β are called immune interferons, and IFN-gamma is not.", "IFN-α and IFN-β primarily activate macrophages, whereas IFN-gamma halts viral activity.", "IFN-α and IFN-β are made primarily by activated T cells, whereas IFN-gamma is made by fibroblasts."], "x": "<b>Answer key: d. IFN-α and IFN-β inhibit cell proliferation, whereas IFN-gamma stimulates antigen presentation by class II MHC molecules.</b><br><b>Why (from the chapter):</b> Increased expression of class I and II MHC molecules on antigen-presenting cells (APCs) increases the likelihood of antigen capture and involvement of additional lymphocytes. It also inhibits antigen presentation by macrophages and dendritic cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IFN-α and IFN-β are called immune interferons, and IFN-gamma is not.</b> — As the immune system tries to halt the spread of the virus, a profuse release of proinflammatory cytokines occurs, often called a cytokine storm.</li><li><b>IFN-α and IFN-β primarily activate macrophages, whereas IFN-gamma halts viral activity.</b> — IFN-γ is also the most potent activator of macrophages and boosts their tumoricidal activity. In this capacity, it stimulates the phagocytic and cytotoxic abilities of these cells, creating activated or “super” macrophages.</li></ul>", "r": "Book pp. 84–88", "l": ""}, {"id": 101, "s": 5, "im": "", "q": "A patient in septic shock caused by a gram-negative bacterial infection exhibits the following symptoms: high fever, very low blood pressure, and disseminated intravascular coagulation. Which cytokine is the most likely contributor to these symptoms?", "c": "TNF", "w": ["IL-2", "IL-12", "IL-7 \u001a\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012"], "x": "<b>Answer key: b. TNF</b><br><b>Why (from the chapter):</b> This condition results from large amounts of TNF secreted in response to gramnegative bacterial infections, causing a decrease in blood pressure, reduced tissue perfusion, and disseminated intravascular coagulation.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IL-2</b> — Transcription of the gene for IL-2 and IL-2R begins within 1 hour of binding to the TCR.</li><li><b>IL-12</b> — TGF-β blocks the production of IL-12 and strongly inhibits the induction of IFN-gamma.</li><li><b>IL-7 \u001a\u0011\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u00014&amp;$5*0/\u0001\u0012</b> — Growth of hematopoietic stem cells (HSC) requires stem cell factor (SCF) with differentiation determined by IL-7 or thrombopoietin (TPO).</li></ul>", "r": "Book p. 81", "l": ""}, {"id": 102, "s": 5, "im": "", "q": "IL-10 acts as an antagonist to what cytokine?", "c": "IFN-gamma", "w": ["IL-4", "TNF-α", "TGF-β"], "x": "<b>Answer key: c. IFN-gamma</b><br><b>Why (from the chapter):</b> In addition, one of the major effects of IL-10 is the inhibition of IFN-gamma production via the suppression of IL-12 synthesis by accessory cells and the promotion of a Th2 cytokine pattern. Thus, IL-10 serves as an antagonist to IFN-gamma—it is a downregulator of the immune response. The use of a multiplexed bead array enables simultaneous measurement of a multitude of biomarkers; these include acute-phase reactants such as CRP; proinflammatory cytokines; Thl/Th2 distinguishing cytokines such as IFN-gamma, IL-2, <br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IL-4</b> — IL-4 activity on naïve T cells turns on the genes that generate Th2 cells and turns off the genes that promote Th1 cells.</li><li><b>TNF-α</b> — The fusion protein can bind TNF-α and block its activity.</li><li><b>TGF-β</b> — They exert their suppressive activities on both Th1 and Th2 cells by producing more IL-10, TGF-β, or IL-35.</li></ul>", "r": "Book pp. 84–87", "l": ""}, {"id": 103, "s": 5, "im": "", "q": "Which would be the best assay to measure a specific cytokine?", "c": "ELISA testing", "w": ["Blast formation", "T-cell proliferation", "Measurement of leukocyte chemotaxis"], "x": "<b>Answer key: d. ELISA testing</b><br><b>Why (from the chapter):</b> The ELISpot assay employs the enzyme-linked immunosorbent assay (ELISA) technique on in vitro-activated peripheral WBCs. Real time PCR has emerged as a means of detecting cytokine response at the level of gene expression. This type of testing is much faster than traditional PCR.", "r": "Book p. 87", "l": ""}, {"id": 104, "s": 5, "im": "", "q": "Selective destruction of Th cells by the human immunodeficiency virus contributes to immune suppression by which means?", "c": "Decrease in IL-2", "w": ["Decrease in IL-1", "Decrease in IL-8", "Decrease in IL-10"], "x": "<b>Answer key: b. Decrease in IL-2</b><br><b>Why (from the chapter):</b> IL-2 alone can activate proliferation of Th2 cells and helps to generate IgG1and IgE-producing cells. IL-2, also known as the T-cell growth factor, drives the growth and differentiation of both T and B cells and induces lytic activity in NK cells.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Decrease in IL-1</b> — IL-1 acts as an endogenous pyrogen (induces fever) in the acute-phase response through its actions on the hypothalamus. The hypothalamus functions as the thermostat for the human body; IL-1 sets the thermostat at a higher level.</li><li><b>Decrease in IL-10</b> — In addition, one of the major effects of IL-10 is the inhibition of IFN-gamma production via the suppression of IL-12 synthesis by accessory cells and the promotion of a Th2 cytokine pattern. Thus, IL-10 serves as an antagonist to IFN-gamma—it is a downregulator of the immune response.</li></ul>", "r": "Book p. 84", "l": ""}, {"id": 105, "s": 5, "im": "", "q": "Why might a colony stimulating factor be given to a cancer patient?", "c": "Increase production of certain types of leukocytes", "w": ["Stimulate activity of NK cells", "Decrease the production of TNF", "Increase production of mast cells"], "x": "<b>Answer key: b. Increase production of certain types of leukocytes</b><br><b>Why (from the chapter):</b> The effects of cytokines in vivo include regulation of growth, differentiation, and gene expression by many different cell types, including leukocytes. The types of cell surface receptors expressed by leukocytes are often developmentally regulated—for example, immature T cells possess only the chemokine receptors related to lymphoid tissue homing.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Stimulate activity of NK cells</b> — The primary mediators of hematopoiesis are called colony stimulating factors (CSFs) because they stimulate the formation of colonies of cells in the bone marrow.</li><li><b>Increase production of mast cells</b> — However, IL-3 in conjunction with GM-CSF drives the development of basophils and mast cells, whereas the addition of IL-5 to IL-3 and GM-CSF drives the cells to develop into eosinophils.</li></ul>", "r": "Book pp. 78–87", "l": ""}, {"id": 106, "s": 5, "im": "", "q": "Which of the following would result from a lack of TNF?", "c": "Decreased ability to fight gram-negative bacterial infections", "w": ["Increased expression of class II MHC molecules", "Decreased survival of cancer cells", "Increased risk of septic shock /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN"], "x": "<b>Answer key: a. Decreased ability to fight gram-negative bacterial infections</b><br><b>Why (from the chapter):</b> This condition results from large amounts of TNF secreted in response to gramnegative bacterial infections, causing a decrease in blood pressure, reduced tissue perfusion, and disseminated intravascular coagulation. Th17 cells play an important role in host defense against bacterial and fungal infections at mucosal surfaces.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Increased expression of class II MHC molecules</b> — Increased expression of class I and II MHC molecules on antigen-presenting cells (APCs) increases the likelihood of antigen capture and involvement of additional lymphocytes.</li><li><b>Increased risk of septic shock /BUVSF\u0001PG\u0001UIF\u0001*NNVOF\u00014ZTUFN</b> — However, when secreted at higher levels, TNF can have deleterious systemic effects, leading to septic shock.</li></ul>", "r": "Book pp. 81–85", "l": ""}, {"id": 107, "s": 5, "im": "", "q": "Which cytokine acts to promote differentiation of T cells to the Th1 subclass?", "c": "IL-12", "w": ["IL-4", "IFN-α", "IL-10"], "x": "<b>Answer key: c. IL-12</b><br><b>Why (from the chapter):</b> IL-12 binds to its receptor on naïve T cells and causes the expression of a new set of genes, including those that determine maturation into the Th1 lineage. Activation of Th1 cells induces highlevel expression of IFN-gamma. IL-12 also increases the cytolytic ability of NK cells; therefore, it serves as an important link between the innate and adaptive immune responses by enhancing defenses against intracellular pathogens.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IL-4</b> — IL-4 activity on naïve T cells turns on the genes that generate Th2 cells and turns off the genes that promote Th1 cells.</li><li><b>IFN-α</b> — In addition, IFN-γ is involved in regulation and activation of CD4+ Th1 cells, CD8+ cytotoxic lymphocytes, and NK cells.</li><li><b>IL-10</b> — They exert their suppressive activities on both Th1 and Th2 cells by producing more IL-10, TGF-β, or IL-35.</li></ul>", "r": "Book p. 84", "l": ""}, {"id": 108, "s": 5, "im": "", "q": "What is the major function of T regulatory cells?", "c": "Suppression of the immune response by inducing IL-10", "w": ["Suppression of the immune response by producing TNF", "Proliferation of the immune response by producing IL-2", "Proliferation of the immune response by inducing IL-4"], "x": "<b>Answer key: b. Suppression of the immune response by inducing IL-10</b><br><b>Why (from the chapter):</b> In addition, one of the major effects of IL-10 is the inhibition of IFN-gamma production via the suppression of IL-12 synthesis by accessory cells and the promotion of a Th2 cytokine pattern. Thus, IL-10 serves as an antagonist to IFN-gamma—it is a downregulator of the immune response. Tregs are also responsible for inducing IL-10 and TGF-β expression in adaptive T regulatory 1 (Tr1) cells in the peripheral circulation.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Proliferation of the immune response by producing IL-2</b> — IL-2 alone can activate proliferation of Th2 cells and helps to generate IgG1and IgE-producing cells.</li></ul>", "r": "Book pp. 84–85", "l": ""}, {"id": 109, "s": 5, "im": "", "q": "Th17 cells affect the innate immune response by inducing production of which cytokines?", "c": "TNF-α and IL-6 Complement System &quot;TIMFZ\u0001&#x27;SB[FS\u000e&quot;CMF \u00011I% \u0001 BOE\u0001$ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0018 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: PATHWAYS OF THE COMPLEMENT SYSTEM The Classical Pathway The Lectin Pathway The Alternative Pathway SYSTEM CONTROLS Regulation of the Classical and Lectin Pathways Regulation of the Alternative Pathway Regulation of Terminal Components COMPLEMENT RECEPTORS AND THEIR BIOLOGICAL ROLES BIOLOGICAL MANIFESTATIONS OF COMPLEMENT ACTIVATION COMPLEMENT AND DISEASE STATES COMPLEMENT DEFICIENCIES Major Pathway Components Regulatory Factor Components LABORATORY DETECTION OF COMPLEMENT ABNORMALITIES Immunologic Assays of Individual Components Assays for the Classical Pathway Alternative Pathway Assays Interpretation of Laboratory Findings", "w": ["IFN-γ and IL-2", "IL-4 and IL-10", "IL-2 and IL-4"], "x": "<b>Answer key: d. TNF-α and IL-6 Complement System &quot;TIMFZ\u0001&#x27;SB[FS\u000e&quot;CMF \u00011I% \u0001 BOE\u0001$ISJTUJOF\u0001%PSSFTUFZO\u00014UFWFOT \u0001&amp;E% \u0001.5 &quot;4$1 \u0018 -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: PATHWAYS OF THE COMPLEMENT SYSTEM The Classical Pathway The Lectin Pathway The Alternative Pathway SYSTEM CONTROLS Regulation of the Classical and Lectin Pathways Regulation of the Alternative Pathway Regulation of Terminal Components COMPLEMENT RECEPTORS AND THEIR BIOLOGICAL ROLES BIOLOGICAL MANIFESTATIONS OF COMPLEMENT ACTIVATION COMPLEMENT AND DISEASE STATES COMPLEMENT DEFICIENCIES Major Pathway Components Regulatory Factor Components LABORATORY DETECTION OF COMPLEMENT ABNORMALITIES Immunologic Assays of Individual Components Assays for the Classical Pathway Alternative Pathway Assays Interpretation of Laboratory Findings</b><br><b>Why (from the chapter):</b> The increasing clinical usage of cytokines, cytokine antagonists, and cytokine receptor antagonists in conditions such as rheumatoid arthritis (RA), asthma, and Crohn’s disease drives demand for cytokine assays in the clinical laboratory. The cytokine storm is a profound example of the importance of regulation of the immune system.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>IFN-γ and IL-2</b> — IL-2 and IFN-γ induce the development of Th1 cells, which, in turn, induces macrophage activation and delayed type hypersensitivity.</li><li><b>IL-2 and IL-4</b> — The use of a multiplexed bead array enables simultaneous measurement of a multitude of biomarkers; these include acute-phase reactants such as CRP; proinflammatory cytokines; Thl/Th2 distinguishing cytokines such as IFN-gamma, IL-2, IL-4, IL-5, and IL-10; other nonspecific acting cytokines; and CSFs</li></ul>", "r": "Book pp. 80–81", "l": ""}, {"id": 110, "s": 6, "im": "", "q": "The classical complement pathway is activated by", "c": "antigen–antibody complexes.", "w": ["most viruses.", "fungal cell walls.", "mannose in bacterial cell walls."], "x": "<b>Answer key: b. antigen–antibody complexes.</b><br><b>Why (from the chapter):</b> Generally, the more antigen–antibody complexes that are present, the more a beam of light will scatter as it passes through the solution. The first pathway described, the classical pathway, involves nine proteins that are triggered primarily by antigen–antibody combination.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>most viruses.</b> — Molecules distinct to the lectin pathway include mannose-binding lectin (MBL), MASP-1, MASP-2, and MASP-3. • The alternative pathway is triggered by bacterial and fungal cell walls, yeast, viruses, tumor cells, and certain parasites.</li><li><b>fungal cell walls.</b> — Molecules distinct to the lectin pathway include mannose-binding lectin (MBL), MASP-1, MASP-2, and MASP-3. • The alternative pathway is triggered by bacterial and fungal cell walls, yeast, viruses, tumor cells, and certain parasites.</li><li><b>mannose in bacterial cell walls.</b> — The lectin pathway is triggered by binding of MBP to mannose on bacterial cell walls.</li></ul>", "r": "Book pp. 92–105", "l": ""}, {"id": 111, "s": 6, "im": "", "q": "Which of the following is characteristic of complement components?", "c": "Normally present in serum", "w": ["Mainly synthesized by B cells", "Present as active enzymes", "Heat stable"], "x": "<b>Answer key: a. Normally present in serum</b><br><b>Why (from the chapter):</b> None of these proteins has enzymatic activity; they are all present in much smaller amounts in serum than the preceding components. As long as calcium is present in the serum, C1r and C1s remain associated with C1q.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Mainly synthesized by B cells</b> — Like most of the other complement proteins, it is mainly synthesized in the liver; however, monocytes also may be involved to some extent in its manufacture.</li><li><b>Present as active enzymes</b> — As binding of C1q occurs, both are converted into active enzymes.</li></ul>", "r": "Book pp. 93–95", "l": ""}, {"id": 112, "s": 6, "im": "", "q": "All of the following are true of the recognition unit except", "c": "C1q becomes an active esterase.", "w": ["it consists of C1q, C1r, and C1s.", "the subunits require calcium for binding together.", "binding occurs at the FC region of antibody molecules."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: d. C1q becomes an active esterase.</b><br><b>Why (from the chapter):</b> As binding of C1q occurs, both are converted into active enzymes. Bb is rapidly inactivated unless it becomes bound to a site on one of the triggering cellular antigens.", "r": "Book pp. 93–96", "l": ""}, {"id": 113, "s": 6, "im": "", "q": "Which of the following is referred to as C3 convertase?", "c": "C3bBb", "w": ["C1qrs", "C3bD", "C4b5a"], "x": "<b>Answer key: c. C3bBb</b><br><b>Why (from the chapter):</b> Bb combines with C3b to form C3bBb, an enzyme with C3 convertase activity. 3. As the alternative pathway convertase, C3bBb is then capable of cleaving additional C3 into C3a and C3b.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>C1qrs</b> — C1qrs is the recognition unit that binds to the FC portion of two antibody molecules.</li></ul>", "r": "Book pp. 96–97", "l": ""}, {"id": 114, "s": 6, "im": "", "q": "Mannose-binding protein in the lectin pathway is most similar to which classical pathway component?", "c": "C1q", "w": ["C3", "C1rs", "C4"], "x": "<b>Answer key: c. C1q</b><br><b>Why (from the chapter):</b> The role C1q serves in the classical pathway is filled by three classes of recognition molecules in the lectin pathway: lectins, ficolins, and CL-K1. The structure of all three classes of recognition molecules is similar to that of C1q because they are all classed as collectins. C1q “recognizes” the fragment crystallizable (Fc) region of two adjacent antibody molecules, but at least two of the globular heads of C1q must be bound to initiate the classical pathway.", "r": "Book pp. 93–96", "l": ""}, {"id": 115, "s": 6, "im": "", "q": "Which of the following describes the role of properdin in the alternative pathway?", "c": "Stabilization of C3/C5 convertase", "w": ["Conversion of B to Bb", "Inhibition of C3 convertase formation", "Binding and cleavage of Factor B"], "x": "<b>Answer key: a. Stabilization of C3/C5 convertase</b><br><b>Why (from the chapter):</b> The C5 convertase in the alternative pathway consists of C3bBb3bP. The role of Factor B is thus analogous to that of C2 in the classical pathway because it forms an integral part of a C3 convertase.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Conversion of B to Bb</b> — The conversion of C3 is the first step in this pathway.</li><li><b>Binding and cleavage of Factor B</b> — MCP also helps to control the alternative pathway because binding of Factor B to C3b is inhibited.</li></ul>", "r": "Book pp. 96–98", "l": ""}, {"id": 116, "s": 6, "im": "", "q": "Which best characterizes the membrane attack complex (MAC)?", "c": "C9 polymerizes to form the transmembrane channel.", "w": ["Each pathway uses different factors to form it.", "C5 through C9 are not added in any particular order.", "One MAC unit is sufficient to lyse any type of cell."], "x": "<b>Answer key: d. C9 polymerizes to form the transmembrane channel.</b><br><b>Why (from the chapter):</b> Multiple C9 molecules bind to C5b678 and polymerize to form a transmembrane channel, the membrane attack complex, which causes lysis of the cell. greatly speeds this lysis.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Each pathway uses different factors to form it.</b> — Alternative Pathway Assays Alternative pathway activation can be measured by several different means.</li><li><b>One MAC unit is sufficient to lyse any type of cell.</b> — C5 through C9 comprise the membrane attack complex (MAC); this last unit completes the lysis of foreign particles.</li></ul>", "r": "Book p. 96", "l": ""}, {"id": 117, "s": 6, "im": "", "q": "All of the following represent functions of the complement system except", "c": "decreased clearance of antigen–antibody complexes.", "w": ["lysis of foreign cells.", "increase in vascular permeability.", "migration of neutrophils to the tissues."], "x": "<i>Note: this is an “except/not” question, so the key’s answer is the statement that is FALSE.</i><br><b>Answer key: a. decreased clearance of antigen–antibody complexes.</b><br><b>Why (from the chapter):</b> This binding facilitates phagocytosis and clearance of foreign substances or cellular debris, which is one of the key functions of the complement system. Generally, the more antigen–antibody complexes that are present, the more a beam of light will scatter as it passes through the solution.", "r": "Book pp. 103–105", "l": ""}, {"id": 118, "s": 6, "im": "", "q": "Which of the following is true of the amplification loop in complement activation?", "c": "C3b is the product that is increased.", "w": ["It is only found in the alternative pathway.", "The membrane attack unit is amplified.", "Increasing amounts of C1qrs are produced. $IBQUFS\u0001\u0018\u0001 \u0001 $PNQMFNFOU\u00014ZTUFN\u0001 \u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0001\u0012\u0011\u001a"], "x": "<b>Answer key: c. C3b is the product that is increased.</b><br><b>Why (from the chapter):</b> In this manner, immune complexes are more effective at enhancing B-cell differentiation and production of memory cells than is antigen by itself. Another receptor, CR3 (CD11b/CD18), found on monocytes, macrophages, neutrophils, and natural killer (NK) cells, specifically binds particles opsonized with iC3b, a C3b degradation product. It does this in a calcium-dependent manner. Hereditary deficiency of any complement protein, with the exception of C9, usually manifests itself in increased susceptibility to infection<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>It is only found in the alternative pathway.</b> — It acts as the seed of activation of the alternative pathway.</li><li><b>The membrane attack unit is amplified.</b> — Formation of the membrane attack unit is pictured in Figure 7–4.</li></ul>", "r": "Book pp. 100–103", "l": ""}, {"id": 119, "s": 6, "im": "", "q": "Factor H acts by competing with which of the following for the same binding site?", "c": "Factor B", "w": ["Factor D", "C3B", "Factor I"], "x": "<b>Answer key: a. Factor B</b><br><b>Why (from the chapter):</b> Regulation of the Alternative Pathway The principal soluble regulator of the alternative pathway is Factor H, which has a molecular weight of 160,000. It acts by binding to C3b, preventing the binding of Factor B. Additionally, Factor H acts as a cofactor that allows Factor I to break down C3b.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>C3B</b> — Factor H (FH) competes with factor B (B) for binding to spontaneously (hydrolytically) activated C3b. 2.</li></ul>", "r": "Book pp. 91–99", "l": ""}, {"id": 120, "s": 6, "im": "", "q": "A lack of CR1 receptors on RBCs would result in which of the following?", "c": "Decreased clearance of immune complexes by the spleen", "w": ["Decreased binding of C3b to RBCs", "Decreased breakdown of C1qrs", "Decreased binding of Factor H"], "x": "<b>Answer key: b. Decreased clearance of immune complexes by the spleen</b><br><b>Why (from the chapter):</b> A main function of CR1 is as a receptor on platelets and red blood cells (RBCs), which helps to mediate transport of C3bcoated immune complexes to the liver and spleen. It is there that fixed tissue macrophages strip the immune complexes from the RBCs, process the complexes, and return the RBCs intact to circulation. Hereditary deficiency of any complement protein, with the exception of C9, usually manifests itself in increased susceptibility to infection and delayed clearance of immune complexes.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Decreased binding of Factor H</b> — Factor H (FH) competes with factor B (B) for binding to spontaneously (hydrolytically) activated C3b. 2.</li></ul>", "r": "Book pp. 99–103", "l": ""}, {"id": 121, "s": 6, "im": "", "q": "Which best describes the role of CR2 on cell membranes?", "c": "Acts as co-receptor on B cells for antigen", "w": ["Binds C1qrs to inactivate it", "Increases clearance of immune complexes", "Binds particles opsonized with C3b"], "x": "<b>Answer key: b. Acts as co-receptor on B cells for antigen</b><br><b>Why (from the chapter):</b> CR2 plays an important role as part of the B-cell co-receptor for antigen.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Binds C1qrs to inactivate it</b> — C1qrs is the recognition unit that binds to the FC portion of two antibody molecules.</li><li><b>Increases clearance of immune complexes</b> — Hereditary deficiency of any complement protein, with the exception of C9, usually manifests itself in increased susceptibility to infection and delayed clearance of immune complexes.</li><li><b>Binds particles opsonized with C3b</b> — In this manner, immune complexes are more effective at enhancing B-cell differentiation and production of memory cells than is antigen by itself. Another receptor, CR3 (CD11b/CD18), found on monocytes, macrophages, neutrophils, and natural killer (NK) cells, specifically binds particles opsonized wi</li></ul>", "r": "Book p. 100", "l": ""}, {"id": 122, "s": 6, "im": "", "q": "Which of the following best characterizes hemolytic uremic syndrome?", "c": "It can be associated with deficiencies in Factor H.", "w": ["It is a rare cause of renal failure in children.", "The major cause is lack of DAF on RBCs.", "It is associated with antibody-to-C3 convertase."], "x": "<b>Answer key: b. It can be associated with deficiencies in Factor H.</b><br><b>Why (from the chapter):</b> Hemolytic uremic syndrome (HUS) is the most common cause of renal failure in children and is characterized by hemolytic anemia, low platelet count, and acute renal failure. The primary cause of HUS is a Shiga toxin related to infection that is associated with acute diarrhea. The genetic mutations associated with aHUS include those of Factor H, MCP, Factor I, Factor B, and thrombomodulin, as well as autoantibodies to Factor H and Factor I. Complement has also been implicated in C3 glomerulopathies (C3G), which are d<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>The major cause is lack of DAF on RBCs.</b> — Individuals with this disease have RBCs that are deficient in DAF.</li></ul>", "r": "Book p. 104", "l": ""}, {"id": 123, "s": 6, "im": "", "q": "The CH50 test measures which of the following?", "c": "Patient serum required to lyse 50% of sensitized sheep RBCs", "w": ["Functioning of both the classical and alternative pathways", "Genetic deficiencies of any of the complement components", "Functioning of the lectin pathway only"], "x": "<b>Answer key: a. Patient serum required to lyse 50% of sensitized sheep RBCs</b><br><b>Why (from the chapter):</b> The hemolytic titration (CH50) assay is most commonly used for this purpose. This assay measures the amount of patient serum required to lyse 50% of a standardized concentration of antibody-sensitized sheep erythrocytes. Rabbit RBCs that have been sensitized with antibody are implanted in agarose and patient serum is added to wells punched in the gel.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Functioning of both the classical and alternative pathways</b> — From this point on the alternative, lectin, and classical pathways are identical.</li><li><b>Genetic deficiencies of any of the complement components</b> — An understanding of these patterns may be helpful in differentiating hereditary deficiencies from activational states that consume available complement components.</li><li><b>Functioning of the lectin pathway only</b> — The Lectin Pathway The lectin pathway represents another means of activating complement.</li></ul>", "r": "Book p. 105", "l": ""}, {"id": 124, "s": 6, "im": "", "q": "Which of the following would be most effective in preventing bystander lysis of RBCs?", "c": "DAF", "w": ["C1-INH",
