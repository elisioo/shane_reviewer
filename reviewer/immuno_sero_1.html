 "Factor B", "Factor H Basic Immunologic ** Procedures \u0012\u0012\u0012 \u0019 Safety and Quality Management .BSKPSJF\u00014DIBVC\u0001%J\u0001-PSFO[P \u0001.5 &quot;4$1 4) -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: LABORATORY HAZARDS Biological Hazards Sharps Hazards Chemical Hazards Radioactive Hazards Electrical Hazards Fire and Explosive Hazards Physical Hazards QUALITY MANAGEMENT Procedure Manual Preexamination Variables Examination Variables Postexamination Variables REGULATORY ISSUES Clinical Laboratory Improvement Amendments (CLIA) Clinical and Laboratory Standards Institute (CLSI) The Joint Commission (TJC) College of American Pathologists (CAP) QUALITY MANAGEMENT SYSTEMS Quality System Essentials The Lean System Six Sigma"], "x": "<b>Answer key: c. DAF</b><br><b>Why (from the chapter):</b> As mentioned previously, CD59 prevents insertion of C9 into the cell membrane by binding to the C5b-8 complex, inhibiting formation of transmembrane channels. Both DAF and CD59 are important in protecting RBCs against bystander lysis. Individuals with this disease have RBCs that are deficient in DAF.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>C1-INH</b> — C1-INH is a serpin (serine protease inhibitor) that controls many of the serine proteases on contact.</li><li><b>Factor B</b> — Regulation of the Alternative Pathway The principal soluble regulator of the alternative pathway is Factor H, which has a molecular weight of 160,000. It acts by binding to C3b, preventing the binding of Factor B.</li><li><b>Factor H Basic Immunologic ** Procedures \u0012\u0012\u0012 \u0019 Safety and Quality Management .BSKPSJF\u00014DIBVC\u0001%J\u0001-PSFO[P \u0001.5 &quot;4$1 4) -&amp;&quot;3/*/(\u0001065$0.&amp;4 $)&quot;15&amp;3\u0001065-*/&amp; After finishing this chapter, you should be able to: LABORATORY HAZARDS Biological Hazards Sharps Hazards Chemical Hazards Radioactive Hazards Electrical Hazards Fire and Explosive Hazards Physical Hazards QUALITY MANAGEMENT Procedure Manual Preexamination Variables Examination Variables Postexamination Variables REGULATORY ISSUES Clinical Laboratory Improvement Amendments (CLIA) Clinical and Laboratory Standards Institute (CLSI) The Joint Commission (TJC) College of American Pathologists (CAP) QUALITY MANAGEMENT SYSTEMS Quality System Essentials The Lean System Six Sigma</b> — C6 and C7 each have molecular weights of approximately 110,000 and have similar physical and chemical properties.</li></ul>", "r": "Book p. 104", "l": ""}, {"id": 125, "s": 6, "im": "", "q": "A decreased CH50 level and a normal AH50 level indicate which deficiency?", "c": "Decrease in components of the classical pathway only", "w": ["Decrease in components in the lectin pathway only", "Decrease in components in the alternative pathway only", "Decrease in components of both classical and alternative pathways"], "x": "<b>Answer key: d. Decrease in components of the classical pathway only</b><br><b>Why (from the chapter):</b> If the CH50 is low but the AH50 is normal, the components unique to the classical pathway should be investigated. If both the CH50 and AH50 are low, suspicion should be on the components of the terminal pathway because that pathway is shared by both the classical and alternative pathways.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Decrease in components in the lectin pathway only</b> — In the classical and lectin pathways, C5 convertase is made up of C4b2a3b.</li><li><b>Decrease in components in the alternative pathway only</b> — The following results were obtained: red and white blood cell count normal, total serum protein normal, CH50 decreased, alternative pathway function normal, C3 level normal, and C4 and C2 levels decreased.</li></ul>", "r": "Book p. 106", "l": ""}, {"id": 126, "s": 6, "im": "", "q": "Which best describes the role of an anaphylatoxin?", "c": "Increases permeability of blood vessels", "w": ["Coats cells to increase phagocytosis", "Attracts WBCs to the area of antigen concentration", "Increases production of interleukin-1"], "x": "<b>Answer key: d. Increases permeability of blood vessels</b><br><b>Why (from the chapter):</b> Because of increased vascular permeability, neutrophils migrate from blood vessels to the tissues and tend to aggregate.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Coats cells to increase phagocytosis</b> — They are classified as anaphylatoxins, chemotaxins, and opsonins. • Anaphylatoxins increase vascular permeability, whereas chemotaxins attract phagocytic cells to a specific area and opsonins coat damaged or foreign cells to enhance phagocytosis. • Deficiencies of complement components can place an </li><li><b>Attracts WBCs to the area of antigen concentration</b> — In this manner, these cells are directed to the source of antigen concentration.</li><li><b>Increases production of interleukin-1</b> — Binding of C5a to monocytes causes them to undergo an oxidative burst that includes increased production of hydrolytic enzymes, neutrophil chemotactic factor, plateletactivating factors, interleukin-1 (IL-1), and toxic oxygen metabolites. IL-1 is a protein that enhances T-cell activation.</li></ul>", "r": "Book p. 102", "l": ""}, {"id": 127, "s": 6, "im": "", "q": "Which best describes the role of Factor H?", "c": "Prevents binding of Factor B to C3b", "w": ["Acts with DAF to break down C3b", "Binds to the C5C6C7 complex", "Binds to C1q to shut down the classical pathway"], "x": "<b>Answer key: b. Prevents binding of Factor B to C3b</b><br><b>Why (from the chapter):</b> Factor H (FH) competes with factor B (B) for binding to spontaneously (hydrolytically) activated C3b. 2. MCP also helps to control the alternative pathway because binding of Factor B to C3b is inhibited.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Acts with DAF to break down C3b</b> — Additionally, Factor H acts as a cofactor that allows Factor I to break down C3b.</li><li><b>Binds to the C5C6C7 complex</b> — All C3 present in plasma would be rapidly converted by this method were it not for the fact that the enzyme C3bBb is extremely unstable unless properdin binds to the complex.</li><li><b>Binds to C1q to shut down the classical pathway</b> — The role C1q serves in the classical pathway is filled by three classes of recognition molecules in the lectin pathway: lectins, ficolins, and CL-K1. The structure of all three classes of recognition molecules is similar to that of C1q because they are all classed as collectins.</li></ul>", "r": "Book pp. 99–101", "l": ""}, {"id": 128, "s": 6, "im": "", "q": "A lack of C1-INH might result in which of the following conditions?", "c": "Hereditary angioedema", "w": ["Paroxysmal nocturnal hemoglobinuria", "Hemolytic uremic syndrome", "Increased bacterial infections"], "x": "<b>Answer key: c. Hereditary angioedema</b><br><b>Why (from the chapter):</b> Another complement deficiency disorder that has recently received considerable attention is hereditary angioedema (HAE). In addition to the hereditary forms of the disorder, there are acquired forms that result from either consumption of C1-INH or from autoantibodies blocking the function of C1-INH.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>Paroxysmal nocturnal hemoglobinuria</b> — Missing or deficient regulators are the cause of diseases such as paroxysmal nocturnal hemoglobinuria and hereditary angioedema. • Laboratory assays for individual complement components include radial immunodiffusion and nephelometry. • The hemolytic titration or CH50 assay is a measure of lysis, th</li><li><b>Hemolytic uremic syndrome</b> — Hemolytic uremic syndrome (HUS) is the most common cause of renal failure in children and is characterized by hemolytic anemia, low platelet count, and acute renal failure. The primary cause of HUS is a Shiga toxin related to infection that is associated with acute diarrhea.</li></ul>", "r": "Book p. 104", "l": ""}, {"id": 129, "s": 6, "im": "", "q": "Which would be most effective in measuring an individual complement component?", "c": "Radial immunodiffusion", "w": ["CH50 assay", "AH50 assay", "Lytic assay with liposome"], "x": "<b>Answer key: b. Radial immunodiffusion</b><br><b>Why (from the chapter):</b> Missing or deficient regulators are the cause of diseases such as paroxysmal nocturnal hemoglobinuria and hereditary angioedema. • Laboratory assays for individual complement components include radial immunodiffusion and nephelometry. • The hemolytic titration or CH50 assay is a measure of lysis, the end point of complement activation in the classical pathway.<br><b>About the other choices:</b><ul style=\"margin:4px 0 0 18px;padding:0\"><li><b>CH50 assay</b> — If a complement deficiency is suspected, it is possible to narrow down the possible candidate components with a CH50 and an AH50 assay.</li><li><b>AH50 assay</b> — If a complement deficiency is suspected, it is possible to narrow down the possible candidate components with a CH50 and an AH50 assay.</li></ul>", "r": "Book p. 107", "l": ""}, {"id": 130, "s": 1, "im": "", "q": "Fill in the blank (from the chapter): _____, the most potent activators of T cells, are excellent at capturing and digesting exogenous antigens such as bacteria.", "c": "Dendritic cells", "w": ["Monocytes", "NK cells", "Macrophages"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: Dendritic cells</b><br>The book states: “<b>Dendritic cells</b>, the most potent activators of T cells, are excellent at capturing and digesting exogenous antigens such as bacteria.”", "r": "Book p. 24", "l": ""}, {"id": 131, "s": 2, "im": "", "q": "Fill in the blank (from the chapter): _____ activity is stimulated by exposure to cytokines such as interleukin-12, interferon-α, and interferon-β.", "c": "NK cell", "w": ["Dendritic cell", "Mast cell", "Eosinophil"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: NK cell</b><br>The book states: “<b>NK cell</b> activity is stimulated by exposure to cytokines such as interleukin-12, interferon-α, and interferon-β.”", "r": "Book p. 40", "l": ""}, {"id": 132, "s": 2, "im": "", "q": "Fill in the blank (from the chapter): _____ are mobilized within 30 to 60 minutes after the injury and their emigration may last 24 to 48 hours.", "c": "Neutrophils", "w": ["NK cells", "Dendritic cells", "Macrophages"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: Neutrophils</b><br>The book states: “<b>Neutrophils</b> are mobilized within 30 to 60 minutes after the injury and their emigration may last 24 to 48 hours.”", "r": "Book p. 37", "l": ""}, {"id": 133, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): _____ and class II MHC are important for interaction of B cells with T cells.", "c": "CD40", "w": ["CD20", "CD21", "CD80"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD40</b><br>The book states: “<b>CD40</b> and class II MHC are important for interaction of B cells with T cells.”", "r": "Book p. 52", "l": ""}, {"id": 134, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): The combination of the β chain with the rest of _____ forms the pre-TRC receptor.", "c": "CD3", "w": ["CD22", "CD8", "CD2"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD3</b><br>The book states: “The combination of the β chain with the rest of <b>CD3</b> forms the pre-TRC receptor.”", "r": "Book p. 48", "l": ""}, {"id": 135, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): _____ represent the most fully differentiated lymphocyte and their main function is antibody production.", "c": "Plasma cells", "w": ["Eosinophils", "Neutrophils", "Memory cells"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: Plasma cells</b><br>The book states: “<b>Plasma cells</b> represent the most fully differentiated lymphocyte and their main function is antibody production.”", "r": "Book p. 53", "l": ""}, {"id": 136, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): B-cell markers include _____, class II MHC proteins, and surface immunoglobulins.", "c": "CD19", "w": ["CD28", "CD80", "CD86"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD19</b><br>The book states: “B-cell markers include <b>CD19</b>, class II MHC proteins, and surface immunoglobulins.”", "r": "Book p. 58", "l": ""}, {"id": 137, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): Activated B cells exhibit identifying markers that include _____, which is found on both activated T and B cells and which acts as a receptor for IL-2, a growth factor produced by T cells.", "c": "CD25", "w": ["CD80", "CD28", "CD86"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD25</b><br>The book states: “Activated B cells exhibit identifying markers that include <b>CD25</b>, which is found on both activated T and B cells and which acts as a receptor for IL-2, a growth factor produced by T cells.”", "r": "Book p. 56", "l": ""}, {"id": 138, "s": 3, "im": "", "q": "Fill in the blank (from the chapter): The Th cell binds by means of its CD3-TCR complex and delivers further activating signals through binding of _____ on the B cell to the CD40L receptor on the Th cell.", "c": "CD40", "w": ["CD22", "CD19", "CD21"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD40</b><br>The book states: “The Th cell binds by means of its CD3-TCR complex and delivers further activating signals through binding of <b>CD40</b> on the B cell to the CD40L receptor on the Th cell.”", "r": "Book p. 56", "l": ""}, {"id": 139, "s": 4, "im": "", "q": "Fill in the blank (from the chapter): The receptor is actually an SC, which binds to _____ and exits the cell along with it.", "c": "IgA", "w": ["IgG", "IgE", "IgD"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IgA</b><br>The book states: “The receptor is actually an SC, which binds to <b>IgA</b> and exits the cell along with it.”", "r": "Book p. 68", "l": ""}, {"id": 140, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____ binds to its receptor on naïve T cells and causes the expression of a new set of genes, including those that determine maturation into the Th1 lineage.", "c": "IL-12", "w": ["IL-3", "IL-13", "IL-5"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-12</b><br>The book states: “<b>IL-12</b> binds to its receptor on naïve T cells and causes the expression of a new set of genes, including those that determine maturation into the Th1 lineage.”", "r": "Book p. 84", "l": ""}, {"id": 141, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____ is a multilineage CSF that induces bone marrow stem cells to form T and B cells.", "c": "IL-3", "w": ["IL-17", "IL-23", "IL-10"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-3</b><br>The book states: “<b>IL-3</b> is a multilineage CSF that induces bone marrow stem cells to form T and B cells.”", "r": "Book p. 85", "l": ""}, {"id": 142, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): IL-1β is responsible for most of the systemic activity attributed to _____, including fever, activation of phagocytes, and production of acute-phase proteins.", "c": "IL-1", "w": ["IL-23", "IL-7", "IL-17"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-1</b><br>The book states: “IL-1β is responsible for most of the systemic activity attributed to <b>IL-1</b>, including fever, activation of phagocytes, and production of acute-phase proteins.”", "r": "Book p. 80", "l": ""}, {"id": 143, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): Homodimerization following _____ binding causes conformational changes in gp130 that expose tyrosine residues in the intracellular portion of the molecule.", "c": "IL-6", "w": ["IL-38", "IL-2", "IL-7"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-6</b><br>The book states: “Homodimerization following <b>IL-6</b> binding causes conformational changes in gp130 that expose tyrosine residues in the intracellular portion of the molecule.”", "r": "Book p. 81", "l": ""}, {"id": 144, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____ also induces the production of CSFs in the bone marrow, thereby increasing the available number of phagocytic cells that can respond to the damaged tissues. IL-1RA, which is also produced by monocytes and macrophages, is the best characterized cytokine inhibitor.", "c": "IL-1", "w": ["IL-23", "IL-11", "IL-38"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-1</b><br>The book states: “<b>IL-1</b> also induces the production of CSFs in the bone marrow, thereby increasing the available number of phagocytic cells that can respond to the damaged tissues. IL-1RA, which is also produced by monocytes and macrophages, is the best characterized cytokine inhibitor.”", "r": "Book p. 80", "l": ""}, {"id": 145, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____ is a recently identified cytokine that has immunosuppressive effects on Th1, Th2, and Th17 cells while promoting growth of Tregs. All of these activities lead to downregulation of the immune response and the prevention of chronic inflammation.", "c": "IL-35", "w": ["IL-11", "IL-23", "IL-38"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-35</b><br>The book states: “<b>IL-35</b> is a recently identified cytokine that has immunosuppressive effects on Th1, Th2, and Th17 cells while promoting growth of Tregs. All of these activities lead to downregulation of the immune response and the prevention of chronic inflammation.”", "r": "Book p. 85", "l": ""}, {"id": 146, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): Tr1 cells are CD4+ T cells that are induced from antigen-activated naïve T cells in the presence of _____.", "c": "IL-10", "w": ["IL-6", "IL-4", "IL-5"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-10</b><br>The book states: “Tr1 cells are CD4+ T cells that are induced from antigen-activated naïve T cells in the presence of <b>IL-10</b>.”", "r": "Book p. 85", "l": ""}, {"id": 147, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____ activity on naïve T cells turns on the genes that generate Th2 cells and turns off the genes that promote Th1 cells.", "c": "IL-4", "w": ["IL-5", "IL-17", "IL-10"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-4</b><br>The book states: “<b>IL-4</b> activity on naïve T cells turns on the genes that generate Th2 cells and turns off the genes that promote Th1 cells.”", "r": "Book p. 84", "l": ""}, {"id": 148, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): T-cell suppression occurs through _____ inhibition of proinflammatory cytokines and inhibition of costimulatory molecule expression on APCs.", "c": "IL-10", "w": ["IL-23", "IL-11", "IL-35"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-10</b><br>The book states: “T-cell suppression occurs through <b>IL-10</b> inhibition of proinflammatory cytokines and inhibition of costimulatory molecule expression on APCs.”", "r": "Book p. 85", "l": ""}, {"id": 149, "s": 5, "im": "", "q": "Fill in the blank (from the chapter): _____, also known as the T-cell growth factor, drives the growth and differentiation of both T and B cells and induces lytic activity in NK cells.", "c": "IL-2", "w": ["IL-10", "IL-38", "IL-11"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: IL-2</b><br>The book states: “<b>IL-2</b>, also known as the T-cell growth factor, drives the growth and differentiation of both T and B cells and induces lytic activity in NK cells.”", "r": "Book p. 84", "l": ""}, {"id": 150, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): _____ consists of two polypeptide chains, α and β, which are linked by disulfide bonds to form a molecule with a molecular weight of about 190,", "c": "C5", "w": ["C3d", "C5b", "C5a"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C5</b><br>The book states: “<b>C5</b> consists of two polypeptide chains, α and β, which are linked by disulfide bonds to form a molecule with a molecular weight of about 190,”", "r": "Book p. 95", "l": ""}, {"id": 151, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): For _____, it is necessary to measure function because it is a three-subunit protein.", "c": "C8", "w": ["C5b", "C3a", "C1s"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C8</b><br>The book states: “For <b>C8</b>, it is necessary to measure function because it is a three-subunit protein.”", "r": "Book p. 106", "l": ""}, {"id": 152, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): MCP also helps to control the alternative pathway because binding of Factor B to _____ is inhibited.", "c": "C3b", "w": ["C2a", "C1s", "C2b"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C3b</b><br>The book states: “MCP also helps to control the alternative pathway because binding of Factor B to <b>C3b</b> is inhibited.”", "r": "Book p. 99", "l": ""}, {"id": 153, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): _____ must bind to protein or carbohydrate within a few seconds or it will react with water molecules to form iC4b, which is rapidly degraded.", "c": "C4b", "w": ["C4a", "C3a", "C8"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C4b</b><br>The book states: “<b>C4b</b> must bind to protein or carbohydrate within a few seconds or it will react with water molecules to form iC4b, which is rapidly degraded.”", "r": "Book p. 94", "l": ""}, {"id": 154, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): The first stage involves the recognition unit, which in the case of the classical pathway is _____.", "c": "C1", "w": ["C1r", "C3d", "C3a"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C1</b><br>The book states: “The first stage involves the recognition unit, which in the case of the classical pathway is <b>C1</b>.”", "r": "Book p. 93", "l": ""}, {"id": 155, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): Multiple _____ molecules bind to C5b678 and polymerize to form a transmembrane channel, the membrane attack complex, which causes lysis of the cell. greatly speeds this lysis.", "c": "C9", "w": ["C2b", "C4d", "C1q"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C9</b><br>The book states: “Multiple <b>C9</b> molecules bind to C5b678 and polymerize to form a transmembrane channel, the membrane attack complex, which causes lysis of the cell. greatly speeds this lysis.”", "r": "Book p. 96", "l": ""}, {"id": 156, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): DAF or _____, a 70,000 d membrane glycoprotein, is the third main receptor and has a wide tissue distribution.", "c": "CD55", "w": ["CD59", "CD19", "CD21"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: CD55</b><br>The book states: “DAF or <b>CD55</b>, a 70,000 d membrane glycoprotein, is the third main receptor and has a wide tissue distribution.”", "r": "Book p. 99", "l": ""}, {"id": 157, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): _____, antibody, and C-reactive protein are all important opsonins that coat antigens and accelerate phagocytosis.", "c": "C3b", "w": ["C5", "C4d", "C4a"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C3b</b><br>The book states: “<b>C3b</b>, antibody, and C-reactive protein are all important opsonins that coat antigens and accelerate phagocytosis.”", "r": "Book p. 102", "l": ""}, {"id": 158, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): If C4BP attaches to cell-bound _____, it can dissociate it from C4b2a complexes, causing the cessation of the classical pathway.", "c": "C4b", "w": ["C2a", "C4d", "C5b"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C4b</b><br>The book states: “If C4BP attaches to cell-bound <b>C4b</b>, it can dissociate it from C4b2a complexes, causing the cessation of the classical pathway.”", "r": "Book p. 99", "l": ""}, {"id": 159, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): _____ has a molecular weight of 410,000 and is composed of six strands that form six globular heads with a collagen-like tail portion.", "c": "C1q", "w": ["C3d", "C6", "C1r"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C1q</b><br>The book states: “<b>C1q</b> has a molecular weight of 410,000 and is composed of six strands that form six globular heads with a collagen-like tail portion.”", "r": "Book p. 93", "l": ""}, {"id": 160, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): The binding of C1qrs to two antibody molecules activates the classical pathway, whereas the alternative pathway is started by hydrolysis of _____.", "c": "C3", "w": ["C4d", "C5b", "C2a"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C3</b><br>The book states: “The binding of C1qrs to two antibody molecules activates the classical pathway, whereas the alternative pathway is started by hydrolysis of <b>C3</b>.”", "r": "Book p. 98", "l": ""}, {"id": 161, "s": 6, "im": "", "q": "Fill in the blank (from the chapter): As mentioned previously, CD59 prevents insertion of _____ into the cell membrane by binding to the C5b-8 complex, inhibiting formation of transmembrane channels. Both DAF and CD59 are important in protecting RBCs against bystander lysis.", "c": "C9", "w": ["C1r", "C4a", "C3a"], "x": "<i>Practice question built from the chapter text.</i> <b>Answer: C9</b><br>The book states: “As mentioned previously, CD59 prevents insertion of <b>C9</b> into the cell membrane by binding to the C5b-8 complex, inhibiting formation of transmembrane channels. Both DAF and CD59 are important in protecting RBCs against bystander lysis.”", "r": "Book p. 104", "l": ""}, {"id": 162, "s": 0, "im": "", "q": "Monocytes that leave the blood and settle in tissues become which cell?", "c": "Macrophages", "w": ["Neutrophils", "Plasma cells", "Mast cells"], "x": "<i>Added practice question.</i> <b>Answer: Macrophages</b><br>Monocytes circulate briefly, then differentiate into tissue macrophages (or dendritic cells) that phagocytose and present antigen.", "r": "See Book p. 3", "l": "Monocytes are &quot;teenagers&quot; in the blood. Once they move into a tissue they grow up into macrophages, the big germ-eating cells."}, {"id": 163, "s": 0, "im": "", "q": "Which statement best separates innate from adaptive immunity?", "c": "Innate is immediate and nonspecific with no memory; adaptive is specific and has memory", "w": ["Innate needs prior exposure; adaptive does not", "Innate is mediated only by antibodies", "Adaptive acts within minutes; innate takes days"], "x": "<i>Added practice question.</i> <b>Answer: Innate is immediate and nonspecific with no memory; adaptive is specific and has memory</b><br>Innate = fast, general defense; adaptive = slower but specific, with memory that makes repeat exposures stronger.", "r": "See Chapter 1", "l": "Innate is the security guard who reacts to anything odd right away. Adaptive is the detective who learns the exact culprit and remembers it next time."}, {"id": 164, "s": 0, "im": "", "q": "Where do T lymphocytes mature?", "c": "Thymus", "w": ["Bone marrow", "Spleen", "Lymph nodes"], "x": "<i>Added practice question.</i> <b>Answer: Thymus</b><br>The thymus and bone marrow are the primary lymphoid organs: T cells mature in the thymus, B cells in the bone marrow.", "r": "See Book p. 3", "l": "T cells go to &quot;T-school&quot; in the thymus; B cells finish in the bone marrow."}, {"id": 165, "s": 0, "im": "", "q": "Which lymphoid cell kills target cells without prior sensitization?", "c": "NK cell", "w": ["Cytotoxic T cell", "Plasma cell", "B cell"], "x": "<i>Added practice question.</i> <b>Answer: NK cell</b><br>NK cells are innate lymphocytes that kill virus-infected and tumor cells without prior exposure and without MHC restriction.", "r": "See Book p. 2", "l": "NK cells are bouncers: they remove sick cells on sight, with no training required."}, {"id": 166, "s": 1, "im": "", "q": "Which MHC class presents endogenous (intracellular) peptides to CD8+ T cells?", "c": "Class I", "w": ["Class II", "Class III", "Class IV"], "x": "<i>Added practice question.</i> <b>Answer: Class I</b><br>Class I (on all nucleated cells) presents endogenous peptides to CD8+ cells; Class II (on APCs) presents exogenous peptides to CD4+ cells.", "r": "See Book p. 16", "l": "Class I cells show the T cells what is going on inside, such as a virus hiding in the cell."}, {"id": 167, "s": 1, "im": "", "q": "Class II MHC molecules are normally found on", "c": "Antigen-presenting cells (B cells, macrophages, dendritic cells)", "w": ["All nucleated cells", "Red blood cells", "Neurons only"], "x": "<i>Added practice question.</i> <b>Answer: Antigen-presenting cells (B cells, macrophages, dendritic cells)</b><br>Class II expression is largely limited to APCs, so they can present exogenous antigen to CD4+ helper T cells.", "r": "See Book p. 16", "l": "Class II is the &quot;display case&quot; on the immune system&#x27;s professional presenters."}, {"id": 168, "s": 1, "im": "", "q": "The part of an antigen that actually binds to an antibody is the", "c": "Epitope", "w": ["Hapten", "Adjuvant", "Carrier"], "x": "<i>Added practice question.</i> <b>Answer: Epitope</b><br>An epitope (antigenic determinant) is the specific site recognized by an antibody or T cell receptor.", "r": "See Book p. 16", "l": "The epitope is the exact &quot;handle&quot; on the germ that the antibody grabs."}, {"id": 169, "s": 1, "im": "", "q": "Which feature makes a molecule a good immunogen?", "c": "Large, complex and foreign", "w": ["Small and simple", "Identical to self", "Very low molecular weight"], "x": "<i>Added practice question.</i> <b>Answer: Large, complex and foreign</b><br>Immunogenicity rises with foreignness, size, and chemical complexity; small molecules usually need a carrier.", "r": "See Book p. 17", "l": "The bigger, more complicated and more &quot;not me&quot; something looks, the louder the alarm."}, {"id": 170, "s": 2, "im": "", "q": "Which acute-phase reactant rises fastest and is a marker of inflammation?", "c": "C-reactive protein", "w": ["Albumin", "Transferrin", "IgG"], "x": "<i>Added practice question.</i> <b>Answer: C-reactive protein</b><br>CRP rises within hours of infection or tissue injury and binds phosphocholine on microbes; albumin and transferrin fall.", "r": "See Book p. 31", "l": "CRP is the body&#x27;s smoke alarm: it goes off quickly whenever there is inflammation."}, {"id": 171, "s": 2, "im": "", "q": "The movement of neutrophils out of the blood vessel into tissue is called", "c": "Diapedesis", "w": ["Opsonization", "Degranulation", "Apoptosis"], "x": "<i>Added practice question.</i> <b>Answer: Diapedesis</b><br>Neutrophils roll, adhere, then squeeze between endothelial cells (diapedesis) and follow chemotactic signals to the infection.", "r": "See Book p. 32", "l": "Diapedesis is cells squeezing through the vessel wall to get to the fight."}, {"id": 172, "s": 2, "im": "", "q": "Coating a microbe with C3b or antibody so it is easier to phagocytose is called", "c": "Opsonization", "w": ["Chemotaxis", "Diapedesis", "Margination"], "x": "<i>Added practice question.</i> <b>Answer: Opsonization</b><br>Opsonins such as IgG and C3b bind the microbe and attach to phagocyte receptors, enhancing ingestion.", "r": "See Book p. 35", "l": "Opsonins are &quot;eat me&quot; tags that make a germ easy for phagocytes to grab."}, {"id": 173, "s": 2, "im": "", "q": "Which enzyme produces superoxide in the respiratory (oxidative) burst?", "c": "NADPH oxidase", "w": ["Lysozyme", "Myeloperoxidase", "Lactoferrin"], "x": "<i>Added practice question.</i> <b>Answer: NADPH oxidase</b><br>NADPH oxidase makes superoxide; myeloperoxidase later converts H2O2 to hypochlorous acid. Its absence causes chronic granulomatous disease.", "r": "See Book p. 39", "l": "NADPH oxidase starts the bleach-like chemicals that destroy swallowed germs."}, {"id": 174, "s": 3, "im": "", "q": "CD4+ helper T cells recognize antigen presented on", "c": "MHC class II", "w": ["MHC class I", "Free soluble antigen", "IgM"], "x": "<i>Added practice question.</i> <b>Answer: MHC class II</b><br>CD4 binds the class II MHC molecule; CD8 binds class I.", "r": "See Book p. 45", "l": "Helper T cells only listen to antigen shown on Class II &quot;display cases&quot;."}, {"id": 175, "s": 3, "im": "", "q": "Which CD marker is found on all mature T cells?", "c": "CD3", "w": ["CD19", "CD56", "CD14"], "x": "<i>Added practice question.</i> <b>Answer: CD3</b><br>CD3 is part of the TCR complex. CD19/CD20 mark B cells, CD56 marks NK cells, and CD14 marks monocytes.", "r": "See Book p. 45", "l": "CD3 is the T cell&#x27;s ID badge."}, {"id": 176, "s": 3, "im": "", "q": "Which B cell–T helper interaction is required for class switching?", "c": "CD40–CD40 ligand", "w": ["CD3–CD4", "CD8–class I", "CD19–CD21"], "x": "<i>Added practice question.</i> <b>Answer: CD40–CD40 ligand</b><br>CD40 on B cells binds CD40L on activated Th cells; with cytokines this drives class switching and memory formation.", "r": "See Book p. 52", "l": "It is a handshake between B and helper T cells that says &quot;go ahead and switch antibody types&quot;."}, {"id": 177, "s": 3, "im": "", "q": "Which cell secretes antibody?", "c": "Plasma cell", "w": ["Memory B cell", "NK cell", "Macrophage"], "x": "<i>Added practice question.</i> <b>Answer: Plasma cell</b><br>Activated B cells differentiate into plasma cells, which are antibody factories; memory B cells wait for re-exposure.", "r": "See Book p. 45", "l": "Plasma cells are the antibody factories."}, {"id": 178, "s": 4, "im": "", "q": "Which immunoglobulin is most abundant in serum?", "c": "IgG", "w": ["IgA", "IgM", "IgE"], "x": "<i>Added practice question.</i> <b>Answer: IgG</b><br>IgG makes up roughly 75–80% of serum immunoglobulin and is the only class that crosses the placenta.", "r": "See Book p. 60", "l": "IgG is the most common antibody and the one that protects newborns."}, {"id": 179, "s": 4, "im": "", "q": "Which immunoglobulin is a pentamer and the first made in a primary response?", "c": "IgM", "w": ["IgG", "IgA", "IgD"], "x": "<i>Added practice question.</i> <b>Answer: IgM</b><br>IgM is a J-chain-linked pentamer (10 binding sites) and is the first antibody made; it is the best complement fixer.", "r": "See Book p. 67", "l": "IgM is the first responder: big, with five arms, and it shows up first."}, {"id": 180, "s": 4, "im": "", "q": "Hybridoma cells for monoclonal antibodies are made by fusing", "c": "An antibody-producing B cell and a myeloma cell", "w": ["A T cell and a myeloma cell", "Two plasma cells", "A B cell and a macrophage"], "x": "<i>Added practice question.</i> <b>Answer: An antibody-producing B cell and a myeloma cell</b><br>The B cell supplies the antibody gene; the immortal myeloma partner allows indefinite growth; HAT medium selects hybrids.", "r": "See Book p. 61", "l": "You combine a cell that makes a specific antibody with one that lives forever."}, {"id": 181, "s": 4, "im": "", "q": "Pepsin digestion of IgG yields", "c": "F(ab&#x27;)2 and Fc fragments", "w": ["Two Fab and one Fc", "Two Fc only", "Free light chains"], "x": "<i>Added practice question.</i> <b>Answer: F(ab&#x27;)2 and Fc fragments</b><br>Pepsin cuts below the hinge giving F(ab&#x27;)2 (still divalent) plus Fc fragments; papain gives two Fab plus one Fc.", "r": "See Book p. 63", "l": "Pepsin leaves the two arms joined; papain cuts them apart."}, {"id": 182, "s": 5, "im": "", "q": "Which cytokine is the main T-cell growth factor?", "c": "IL-2", "w": ["IL-1", "IL-6", "TNF-alpha"], "x": "<i>Added practice question.</i> <b>Answer: IL-2</b><br>IL-2 drives proliferation of activated T cells and NK cells.", "r": "See Book p. 77", "l": "IL-2 is fertilizer for T cells."}, {"id": 183, "s": 5, "im": "", "q": "Which cytokine drives Th2 differentiation and class switching to IgE?", "c": "IL-4", "w": ["IFN-gamma", "IL-12", "TGF-beta"], "x": "<i>Added practice question.</i> <b>Answer: IL-4</b><br>IL-4 promotes Th2 development and IgE switching; IFN-gamma and IL-12 favor Th1.", "r": "See Book p. 83", "l": "IL-4 pushes the immune system toward the allergy and worm-fighting path."}, {"id": 184, "s": 5, "im": "", "q": "IFN-gamma is produced mainly by", "c": "Th1 cells and NK cells", "w": ["B cells", "Neutrophils", "Platelets"], "x": "<i>Added practice question.</i> <b>Answer: Th1 cells and NK cells</b><br>IFN-gamma activates macrophages and raises MHC expression.", "r": "See Book p. 76", "l": "IFN-gamma tells macrophages to wake up and fight harder."}, {"id": 185, "s": 5, "im": "", "q": "Which cytokine, made by macrophages and dendritic cells, promotes Th1 differentiation?", "c": "IL-12", "w": ["IL-4", "IL-10", "IL-5"], "x": "<i>Added practice question.</i> <b>Answer: IL-12</b><br>IL-12 induces Th1 cells and IFN-gamma production.", "r": "See Book p. 79", "l": "IL-12 sends young helper T cells down the &quot;fight infected cells&quot; path."}, {"id": 186, "s": 6, "im": "", "q": "Which complement pathway is initiated by antigen–antibody complexes?", "c": "Classical", "w": ["Alternative", "Lectin", "Properdin"], "x": "<i>Added practice question.</i> <b>Answer: Classical</b><br>C1q binds IgM or IgG on antigen and starts the classical pathway.", "r": "See Book p. 91", "l": "The classical pathway starts when antibodies are stuck on a target."}, {"id": 187, "s": 6, "im": "", "q": "Which component is central to all three pathways and yields the opsonin C3b?", "c": "C3", "w": ["C1q", "C5", "C9"], "x": "<i>Added practice question.</i> <b>Answer: C3</b><br>All pathways converge on cleavage of C3 into C3a and C3b.", "r": "See Book p. 91", "l": "C3 is the hub every complement route passes through."}, {"id": 188, "s": 6, "im": "", "q": "Which fragments are anaphylatoxins?", "c": "C3a, C4a and C5a", "w": ["C3b, C4b and C5b", "C1q, C1r and C1s", "C6, C7 and C8"], "x": "<i>Added practice question.</i> <b>Answer: C3a, C4a and C5a</b><br>The small a-fragments cause mast-cell degranulation and vasodilation; C5a is also strongly chemotactic.", "r": "See Book p. 92", "l": "The &quot;a&quot; pieces trigger swelling and call in white cells."}, {"id": 189, "s": 6, "im": "", "q": "Which component polymerizes to form the pore of the membrane attack complex?", "c": "C9", "w": ["C3", "C5a", "Factor B"], "x": "<i>Added practice question.</i> <b>Answer: C9</b><br>C5b678 anchors in the membrane and C9 polymerizes into the pore that lyses the cell.", "r": "See Book p. 93", "l": "C9 stacks up like a ring to punch a hole in the germ."}, {"id": 190, "s": 6, "im": "", "q": "The lectin pathway is activated by", "c": "Mannose-binding lectin binding microbial carbohydrates", "w": ["C1q binding IgG", "Factor B binding C3b", "Properdin binding LPS"], "x": "<i>Added practice question.</i> <b>Answer: Mannose-binding lectin binding microbial carbohydrates</b><br>MBL (with MASP-1/2) binds mannose on microbes and cleaves C4 and C2.", "r": "See Book p. 92", "l": "The lectin pathway spots sugar patterns on germs, with no antibodies needed."}, {"id": 191, "s": 6, "im": "", "q": "Deficiency of terminal components (C5–C9) predisposes to infection with", "c": "Neisseria species", "w": ["Candida species", "Cytomegalovirus", "Pneumocystis"], "x": "<i>Added practice question.</i> <b>Answer: Neisseria species</b><br>Without the MAC, Neisseria cannot be lysed, which gives recurrent meningococcal/gonococcal infection.", "r": "See Book p. 103", "l": "Without the hole-punching complex, Neisseria bacteria survive."}, {"id": 192, "s": 0, "im": "1-3", "q": "🖼 Identify the cells shown in the blood smear.", "c": "Neutrophils", "w": ["Eosinophils", "Lymphocytes", "Monocytes"], "x": "<b>Answer: Neutrophils</b><br>Neutrophils have a nucleus with 2–5 lobes, 10–15 µm size and many pale, neutral-staining granules. They are the most numerous WBC (60–70%) and rise in bacterial infection.", "r": "Figure 1–3 · Book p. 5", "l": ""}, {"id": 193, "s": 0, "im": "1-4", "q": "🖼 Identify the cell shown, which has a bilobed nucleus and coarse red-orange granules.", "c": "Eosinophil", "w": ["Basophil", "Neutrophil", "Monocyte"], "x": "<b>Answer: Eosinophil</b><br>Eosinophils (2–4% of WBCs) have a bilobed nucleus and large orange-red granules; they increase in allergy and parasitic infection.", "r": "Figure 1–4 · Book p. 5", "l": ""}, {"id": 194, "s": 0, "im": "1-5", "q": "🖼 Identify the cell whose large dark blue-black granules obscure its nucleus.", "c": "Basophil", "w": ["Eosinophil", "Neutrophil", "Lymphocyte"], "x": "<b>Answer: Basophil</b><br>Basophils are the rarest WBC (0.5–1%); their coarse dark granules often cover the nucleus.", "r": "Figure 1–5 · Book p. 6", "l": ""}, {"id": 195, "s": 0, "im": "1-6", "q": "🖼 These two large cells with indented nuclei and blue-gray cytoplasm are", "c": "Monocytes", "w": ["Lymphocytes", "Neutrophils", "Plasma cells"], "x": "<b>Answer: Monocytes</b><br>Monocytes are the largest WBCs (3–8%) with an indented or kidney-shaped nucleus; in tissue they become macrophages.", "r": "Figure 1–6 · Book p. 6", "l": ""}, {"id": 196, "s": 0, "im": "1-7", "q": "🖼 The arrow points to a large immature cell with a big round nucleus and little cytoplasm. It is a", "c": "Blast cell", "w": ["Segmented neutrophil", "Eosinophil", "Plasma cell"], "x": "<b>Answer: Blast cell</b><br>A blast is an early precursor cell with a high nucleus-to-cytoplasm ratio, found in the marrow rather than normal peripheral blood.", "r": "Figure 1–7 · Book p. 6", "l": ""}, {"id": 197, "s": 0, "im": "1-8", "q": "🖼 The small cell with a round, dense nucleus and a thin rim of cytoplasm is a typical", "c": "Lymphocyte", "w": ["Monocyte", "Neutrophil", "Eosinophil"], "x": "<b>Answer: Lymphocyte</b><br>Lymphocytes make up 20–25% of WBCs; they are slightly larger than an RBC with a round condensed nucleus and little non-granular cytoplasm.", "r": "Figure 1–8 · Book p. 7", "l": ""}, {"id": 198, "s": 0, "im": "1-12", "q": "🖼 The cell with an eccentric nucleus and abundant vacuolated blue cytoplasm is a typical", "c": "Plasma cell", "w": ["Monocyte", "Basophil", "Neutrophil"], "x": "<b>Answer: Plasma cell</b><br>Plasma cells are differentiated B cells that make antibody and have an off-center nucleus and abundant basophilic cytoplasm.", "r": "Figure 1–12 · Book p. 11", "l": ""}, {"id": 199, "s": 3, "im": "4-1", "q": "🖼 This scanning electron micrograph shows the surface of a typical", "c": "T cell", "w": ["Erythrocyte", "Platelet", "Neutrophil"], "x": "<b>Answer: T cell</b><br>Lymphocytes look round with a surface covered by microvilli-like projections on scanning electron microscopy; the book illustrates a typical T cell.", "r": "Figure 4–1 · Book p. 46", "l": ""}, {"id": 200, "s": 4, "im": "5-1", "q": "🖼 On this serum protein electrophoresis, most antibodies migrate in the", "c": "Gamma region", "w": ["Albumin region", "Alpha-1 region", "Beta region"], "x": "<b>Answer: Gamma region</b><br>Most immunoglobulin (especially IgG) is found in the gamma region; a broad increase or a narrow spike there suggests disease.", "r": "Figure 5–1 · Book p. 62", "l": ""}, {"id": 201, "s": 4, "im": "5-1", "q": "🖼 The tallest peak at the left (anode) end of the normal pattern is", "c": "Albumin", "w": ["IgG", "Alpha-2 globulin", "Gamma globulin"], "x": "<b>Answer: Albumin</b><br>Albumin is the most abundant serum protein and migrates farthest toward the positive electrode.", "r": "Figure 5–1 · Book p. 62", "l": ""}, {"id": 202, "s": 6, "im": "7-1", "q": "🖼 The cascade shown, which begins with recognition by C1qrs, is the", "c": "Classical pathway", "w": ["Alternative pathway", "Lectin pathway", "Terminal pathway only"], "x": "<b>Answer: Classical pathway</b><br>C1qrs binds antibody–antigen complexes, cleaves C4 and C2 to form C4b2a, then C3 and C5 to reach the membrane attack complex.", "r": "Figure 7–1 · Book p. 94", "l": ""}, {"id": 203, "s": 6, "im": "7-1", "q": "🖼 The red fragments released in this figure (C4a, C3a, C5a) are called", "c": "Anaphylatoxins", "w": ["Opsonins", "Convertases", "Chemokines"], "x": "<b>Answer: Anaphylatoxins</b><br>The small a-fragments trigger mast-cell degranulation and vasodilation; C5a is also strongly chemotactic.", "r": "Figure 7–1 · Book p. 94", "l": ""}, {"id": 204, "s": 2, "im": "3-2", "q": "🖼 The Toll-like receptors in this figure are part of innate immunity and recognize", "c": "Pathogen-associated molecular patterns", "w": ["Self MHC molecules", "Antibody Fc regions", "Complement C3b"], "x": "<b>Answer: Pathogen-associated molecular patterns</b><br>TLRs are pattern-recognition receptors that detect conserved microbial structures such as viral nucleic acids and bacterial components.", "r": "Figure 3–2 · Book p. 34", "l": ""}, {"id": 205, "s": 2, "im": "3-2", "q": "🖼 In the figure, the TLR pair labeled 9 recognizes", "c": "Bacterial/viral DNA", "w": ["Viral dsRNA", "Viral ssRNA", "Lipopolysaccharide only"], "x": "<b>Answer: Bacterial/viral DNA</b><br>The figure pairs TLR9 with bacterial/viral DNA, TLR3 with viral dsRNA, and TLR7 and TLR8 with viral ssRNA.", "r": "Figure 3–2 · Book p. 34", "l": ""}, {"id": 206, "s": 2, "im": "3-5", "q": "🖼 In this phagocytosis figure, the phagosome fuses with lysosomal granules to form a", "c": "Phagolysosome", "w": ["Opsonin", "Lysozyme", "Chemotactic gradient"], "x": "<b>Answer: Phagolysosome</b><br>After ingestion, the phagosome fuses with lysosomes, and enzymes and oxygen radicals kill and digest the microbe.", "r": "Figure 3–5 · Book p. 39", "l": ""}, {"id": 207, "s": 6, "im": "7-9", "q": "🖼 The phagocyte receptors shown (FcR, CR3 and CRP-R) bind antigen coated with", "c": "Opsonins (antibody, C3b, C-reactive protein)", "w": ["Interferons", "Chemokines", "Perforin"], "x": "<b>Answer: Opsonins (antibody, C3b, C-reactive protein)</b><br>Antibody, C3b and CRP coat antigens as opsonins and accelerate phagocytosis through these receptors.", "r": "Figure 7–9 · Book p. 102", "l": ""}];

const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
let S=null,P=ld(),missed=new Set(P.m||[]),rc=0;
function ld(){try{return JSON.parse(localStorage.getItem("immrev"))||{h:[],s:{},m:[]}}catch(e){return{h:[],s:{},m:[]}}}
function sv(){try{P.m=[...missed];localStorage.setItem("immrev",JSON.stringify(P))}catch(e){}}
function tally(q,ok){const a=P.s[q.s]||(P.s[q.s]=[0,0]);a[1]++;if(ok)a[0]++;sv()}
function rec(){P.h.push({d:Date.now(),l:S.label,sc:S.sc,n:S.list.length});if(P.h.length>80)P.h.shift();sv()}
function board(){const h=P.h,n=h.length,pc=x=>Math.round(x.sc/x.n*100),best=n?Math.max(...h.map(pc)):0,avg=n?Math.round(h.reduce((a,x)=>a+pc(x),0)/n):0,v=Object.values(P.s),tq=v.reduce((a,x)=>a+x[1],0),tr=v.reduce((a,x)=>a+x[0],0);
const w=SEC.map((nm,i)=>({nm,a:P.s[i]||[0,0]})).filter(x=>x.a[1]>=3).sort((x,y)=>x.a[0]/x.a[1]-y.a[0]/y.a[1])[0];
$("#main").innerHTML=`<h2>📊 Scoreboard</h2><div class="sb"><div><b>${n}</b>quizzes taken</div><div><b>${best}%</b>best score</div><div><b>${avg}%</b>average score</div><div><b>${tq?Math.round(tr/tq*100):0}%</b>overall accuracy (${tr}/${tq})</div></div>${w?`<p class="hint">🎯 Focus next on: <b>${w.nm}</b> (${Math.round(w.a[0]/w.a[1]*100)}%)</p>`:""}<h2 style="font-size:20px;margin-top:14px">Accuracy by section</h2>${SEC.map((nm,i)=>{const a=P.s[i]||[0,0],p=a[1]?Math.round(a[0]/a[1]*100):0;return`<div class="ar"><span>${nm} <em>${a[1]?p+"% ("+a[0]+"/"+a[1]+")":"not tried yet"}</em></span><div><i style="width:${p}%"></i></div></div>`}).join("")}<h2 style="font-size:20px;margin-top:14px">Recent quizzes</h2>${h.slice(-10).reverse().map(x=>`<div class="rv"><b>${x.l}</b> · ${new Date(x.d).toLocaleDateString()} · <b>${x.sc}/${x.n}</b> (${pc(x)}%)</div>`).join("")||`<p class="hint">No quizzes yet. Take one!</p>`}<button class="btn" onclick="home()">Home</button><button class="btn sm" id="rb" onclick="rst()">Reset scoreboard</button>`;scrollTo(0,0)}
function rst(){if(!rc){rc=1;$("#rb").textContent="Tap again to confirm";return}P={h:[],s:{},m:[]};missed=new Set();rc=0;sv();board()}
const pic=k=>k&&IM[k]?`<img src="${IM[k]}" alt="">`:"";
function home(){S=null;const m=missed.size;$("#main").innerHTML=`<h2>Immunology &amp; Serology Review</h2><p class="hint">${Q.length} questions · Chapters 1–7 · answers follow the book's key, each with a “why” from the chapter.</p><div class="hb" onclick="pick()"><b>🎯 Section drill</b><span>Choose a topic and test yourself.</span></div><div class="hb" onclick="study()"><b>📖 Study mode</b><span>Read every question with its answer and explanation.</span></div><div class="hb" onclick="go(sh(Q).slice(0,50),'Full board exam')"><b>🏆 Full exam (50)</b><span>50 mixed questions from every section.</span></div><div class="hb" onclick="go(sh(Q).slice(0,200),'Mega exam')"><b>💯 Mega exam (200)</b><span>200 mixed questions.</span></div><div class="hb" onclick="ex()"><b>🎚 Custom exam</b><span>You choose the chapter and how many questions.</span></div><div class="hb" onclick="board()"><b>📊 Scoreboard</b><span>${P.h.length} quizzes · see your weak sections</span></div>${m?`<div class="hb" onclick="go(sh(Q.filter(q=>missed.has(q.id))),'Redo missed')"><b>🔁 Redo my missed (${m})</b><span>Practice only what you got wrong.</span></div>`:""}`;scrollTo(0,0)}
function study(){$("#main").innerHTML=`<h2>📖 Study mode</h2>`+SEC.map((n,i)=>`<div class="hb" onclick="sdy(${i})"><b>${n}</b><span>${Q.filter(q=>q.s==i).length} questions</span></div>`).join("")+`<button class="btn sm" onclick="home()">← Home</button>`;scrollTo(0,0)}
function sdy(i){$("#main").innerHTML=`<h2>${SEC[i]}</h2>`+Q.filter(q=>q.s==i).map((q,k)=>`<div class="q"><b>${k+1}. ${q.q}</b>${pic(q.im)}<div class="ex"><b>✅ ${q.c}</b><br>${X(q)}<br><small style="color:var(--mu)">Not: ${q.w.join(" · ")}</small></div></div>`).join("")+`<button class="btn sm" onclick="study()">← Sections</button>`;scrollTo(0,0)}
function ex(){const ns=[10,20,30,50,100,150,200,"All"];$("#main").innerHTML=`<h2>🎚 Custom exam</h2><p class="hint">Choose a scope and how many questions to answer.</p><b>Scope</b><br><select id="exs" class="o"><option value="a">All chapters</option><option value="p">📷 Picture questions only</option>${SEC.map((n,i)=>`<option value="${i}">${n}</option>`).join("")}</select><b>Number of questions</b><br><select id="exn" class="o">${ns.map(n=>`<option value="${n}"${n==50?" selected":""}>${n}</option>`).join("")}</select><button class="btn" onclick="exs()">Start</button><button class="btn sm" onclick="home()">← Home</button>`;scrollTo(0,0)}
function exs(){const v=$("#exs").value,c=$("#exn").value;let L=Q.filter(q=>v=="a"||(v=="p"?q.im:q.s==+v));L=sh(L);if(c!="All")L=L.slice(0,+c);go(L,"Custom exam ("+L.length+")")}
function pick(){$("#main").innerHTML=`<h2>🎯 Pick a section</h2>${SEC.map((n,i)=>`<div class="hb" onclick="go(sh(Q.filter(q=>q.s==${i})),SEC[${i}])"><b>${n}</b><span>${Q.filter(q=>q.s==i).length} questions</span></div>`).join("")}<button class="btn sm" onclick="home()">← Home</button>`;scrollTo(0,0)}
function go(list,label){S={list,label,n:0,sc:0,done:null,wrong:[]};qv()}
function qv(){const q=S.list[S.n];if(!q)return res();if(!q.o)q.o=sh([{t:q.c,r:1},...q.w.map(t=>({t,r:0}))]);
const d=S.done;$("#main").innerHTML=`<p class="st">${S.label} · Question ${S.n+1} of ${S.list.length}</p><div class="pb"><i style="width:${S.n/S.list.length*100}%"></i></div><div class="q"><b>${q.q}</b>${pic(q.im)}${q.o.map((o,k)=>`<button class="o ${d===null?"":o.r?"ok":k==d?"no":""}" onclick="ans(${k})">${o.t}</button>`).join("")}${d!==null?`<div class="ex"><b>${q.o[d].r?"✅ Correct!":"❌ Not quite. Answer: "+q.c}</b><br>${X(q)}</div>`:""}</div>${d!==null?`<button class="btn" onclick="S.n++;S.done=null;qv()">${S.n+1<S.list.length?"Next →":"See score"}</button>`:""}`}
function ans(k){if(S.done!==null)return;const q=S.list[S.n];S.done=k;tally(q,q.o[k].r);if(q.o[k].r){S.sc++;missed.delete(q.id)}else{missed.add(q.id);S.wrong.push(q)}qv()}
function res(){const r=S.sc/S.list.length;rec();$("#main").innerHTML=`<h2>${r>=.8?"🎉":"💪"} ${S.sc} / ${S.list.length}</h2><p>${r>=.9?"Board-ready! Amazing.":r>=.75?"Great job! Review the misses below.":"Keep going, you’re improving. Read the explanations and retry."}</p><button class="btn" onclick="home()">Home</button><button class="btn sm" onclick="pick()">Another section</button>${S.wrong.length?`<h2 style="margin-top:18px">Review your misses</h2>${S.wrong.map(q=>`<div class="rv"><b>${q.q}</b>${pic(q.im)}<br>✅ ${q.c}<br>${X(q)}</div>`).join("")}`:""}`;scrollTo(0,0)}

let LAY=!!P.lay;
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
const layHTML=q=>`<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:2px dashed var(--ac)"><b>🧒 In simple words:</b> ${q.l}</div>`;
function X(q){return q.x+(q.r?`<br><small style="color:var(--mu)">📖 ${q.r}</small>`:"")+(LAY?`<div id="lay${q.id}">${q.l?layHTML(q):`<button class="btn sm" onclick="expl(${q.id},this)">🧒 Explain simply</button>`}</div>`:"")}
