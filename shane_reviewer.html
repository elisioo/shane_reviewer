<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shane’s Reviewer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --e1: #e6e0f8;
        --e2: #fcdfef;
        --e3: #fff0f5;
        --ink: #5c2a3b;
        --soft: #8b5668;
        --panel: #fff0f5;
        --rose: #ca7a89;
        --rhead: #fcdfef;
        --inp: #fff;
        --tf: #fcdfef;
        --to: #b8697b;
        --tr: #fff7fa;
        --purple-bg: #e6e0f8;
        --purple-bd: #bfa8de;
        --blue-bg: #d9d2f3;
        --blue-bd: #a794d6;
        --yellow-bg: #fff0f5;
        --yellow-bd: #d9a1ae;
        --pink-bg: #fcdfef;
        --pink-bd: #ca7a89;
        --t1: #fcdfef;
        --t2: #fff0f5;
        --t3: #e6e0f8;
        --bgov: transparent;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --e1: #e6e0f8;
          --e2: #fcdfef;
          --e3: #fff0f5;
          --ink: #5c2a3b;
          --soft: #8b5668;
          --panel: #fff0f5;
          --rose: #ca7a89;
          --rhead: #fcdfef;
          --inp: #fff;
          --tf: #fcdfef;
          --to: #b8697b;
          --tr: #fff7fa;
          --purple-bg: #e6e0f8;
          --purple-bd: #bfa8de;
          --blue-bg: #d9d2f3;
          --blue-bd: #a794d6;
          --yellow-bg: #fff0f5;
          --yellow-bd: #d9a1ae;
          --pink-bg: #fcdfef;
          --pink-bd: #ca7a89;
          --t1: #fcdfef;
          --t2: #fff0f5;
          --t3: #e6e0f8;
          --bgov: transparent;
          color-scheme: light;
        }
      }
      :root[data-theme="dark"] {
        --e1: #e6e0f8;
        --e2: #fcdfef;
        --e3: #fff0f5;
        --ink: #5c2a3b;
        --soft: #8b5668;
        --panel: #fff0f5;
        --rose: #ca7a89;
        --rhead: #fcdfef;
        --inp: #fff;
        --tf: #fcdfef;
        --to: #b8697b;
        --tr: #fff7fa;
        --purple-bg: #e6e0f8;
        --purple-bd: #bfa8de;
        --blue-bg: #d9d2f3;
        --blue-bd: #a794d6;
        --yellow-bg: #fff0f5;
        --yellow-bd: #d9a1ae;
        --pink-bg: #fcdfef;
        --pink-bd: #ca7a89;
        --t1: #fcdfef;
        --t2: #fff0f5;
        --t3: #e6e0f8;
        --bgov: transparent;
        color-scheme: light;
      }
      html {
        min-height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--ink);
        overflow-x: hidden;
        background-color: var(--e2);
      }
      .page {
        position: relative;
      }
      .bgfix {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        background-color: var(--e2);
      }
      .bgfix::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--bgov);
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1194px;
        margin: 0 auto;
        padding: 16px 16px 120px;
      }
      img {
        display: block;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
      }
      .ham {
        width: 62px;
        height: 50px;
        border-radius: 12px;
        border: 3px solid var(--rose);
        background: linear-gradient(#e6aab6, #ca7a89);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 0;
      }
      .ham i {
        display: block;
        width: 30px;
        height: 4px;
        border-radius: 3px;
        background: #ffe3ee;
      }
      .avatar {
        margin-left: auto;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid var(--rose);
        background: var(--panel);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .search {
        margin: 0;
        width: min(230px, 42vw);
        height: 46px;
        border-radius: 999px;
        border: 3px solid var(--rose);
        background: var(--inp);
        display: flex;
        align-items: center;
        padding: 0 8px 0 14px;
        gap: 6px;
      }
      .search input[type="text"] {
        border: 0;
        padding: 0;
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        font:
          700 16px "Nunito",
          sans-serif;
        color: var(--ink);
        outline: 0;
      }
      .search svg {
        flex: none;
      }
      .menu {
        position: absolute;
        top: 58px;
        left: 0;
        z-index: 20;
        background: var(--panel);
        border: 3px solid var(--rose);
        border-radius: 16px;
        padding: 8px;
        min-width: 200px;
        box-shadow: 0 6px 0 var(--rose);
      }
      .menu button {
        display: block;
        width: 100%;
        text-align: left;
        font:
          600 17px "Fredoka",
          sans-serif;
        color: var(--ink);
        background: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .menu button:hover {
        background: var(--rhead);
      }
      .hero {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        margin-top: 6px;
      }
      .hl {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        gap: 6px;
        padding-right: 12px;
      }
      .hl .pn {
        height: 100px;
      }
      .hl .st {
        height: 54px;
        margin-top: -4px;
      }
      .hl .cp {
        height: 50px;
        margin-top: 62px;
        margin-left: -14px;
      }
      .hr {
        padding-left: 10px;
      }
      .hr img {
        height: 132px;
      }
      .ht {
        text-align: center;
      }
      @media (min-width: 960px) {
        .hero .title {
          white-space: nowrap;
        }
      }
      .title {
        position: relative;
        margin: 0;
        white-space: normal;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        font-size: clamp(28px, 4vw, 52px);
        line-height: 1.08;
        letter-spacing: 0.5px;
      }
      .title::before {
        content: attr(data-t);
        position: absolute;
        inset: 0;
        z-index: 0;
        -webkit-text-stroke: 0.22em var(--to);
        text-shadow: 0 0.08em 0 var(--to);
        color: var(--to);
      }
      .title span {
        position: relative;
        z-index: 1;
        color: var(--tf);
      }
      .sub {
        margin: 10px 0 0;
        font:
          400 clamp(17px, 2.6vw, 27px)/1.2 "Patrick Hand",
          cursive;
        color: var(--ink);
      }
      .title {
        filter: drop-shadow(0 6px 3px rgba(140, 55, 85, 0.42));
      }
      .hero .title {
        font-size: clamp(30px, 5.6vw, 66px);
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 1.75fr 1fr;
        gap: 26px;
        margin-top: 26px;
      }
      .panel {
        background: var(--panel);
        border: 3px solid var(--rose);
        border-radius: 10px;
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel h2 {
        font:
          600 clamp(20px, 2.2vw, 26px)/1.15 "Fredoka",
          sans-serif;
        text-transform: uppercase;
        text-align: center;
        margin: 6px 0 12px;
      }
      .panel p {
        margin: 0;
        text-align: center;
        font-weight: 700;
        line-height: 1.45;
        font-size: 15.5px;
      }
      .panel .bk {
        margin: auto auto 0;
        width: 88%;
        max-width: 250px;
        padding-top: 14px;
      }
      .tp {
        padding: 0;
      }
      .tp h2 {
        margin: 0;
        padding: 14px 10px;
        background: var(--rhead);
        border-bottom: 3px solid var(--rose);
      }
      .tips {
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      .tip {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 3px solid var(--bd);
        background: var(--bg);
        border-radius: 12px;
        padding: 8px 12px;
        min-height: 76px;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.25;
      }
      .tip img {
        height: 60px;
        flex: none;
      }
      .tip span {
        flex: 1;
        text-align: center;
      }
      .tip:nth-child(1) {
        --bg: var(--t1);
        --bd: var(--pink-bd);
      }
      .tip:nth-child(2) {
        --bg: var(--t2);
        --bd: var(--yellow-bd);
      }
      .tip:nth-child(3) {
        --bg: var(--t3);
        --bd: var(--purple-bd);
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-content: start;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-height: 188px;
        padding: 12px 10px 10px;
        border-radius: 10px;
        border: 3px solid var(--bd);
        background: var(--bg);
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
        text-align: center;
        transition: transform 0.15s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card b {
        font:
          600 clamp(16px, 1.7vw, 21px)/1.1 "Fredoka",
          sans-serif;
        text-transform: uppercase;
        word-break: break-word;
      }
      .card .art {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
      }
      .card .art img {
        max-width: 100%;
        max-height: 104px;
        object-fit: contain;
      }
      .card .em {
        font-size: 64px;
        line-height: 1;
      }
      .card small {
        font:
          500 clamp(12px, 1.2vw, 15px)/1.15 "Fredoka",
          sans-serif;
        text-transform: uppercase;
        word-break: break-word;
      }
      .card .ed {
        font-size: 12px;
        font-weight: 800;
        color: var(--soft);
      }
      .c-purple {
        --bg: var(--purple-bg);
        --bd: var(--purple-bd);
      }
      .c-blue {
        --bg: var(--blue-bg);
        --bd: var(--blue-bd);
      }
      .c-yellow {
        --bg: var(--yellow-bg);
        --bd: var(--yellow-bd);
      }
      .c-pink {
        --bg: var(--pink-bg);
        --bd: var(--pink-bd);
      }
      .card.add {
        background: transparent;
        border-style: dashed;
        color: var(--rose);
      }
      .divd {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        color: var(--rose);
        grid-column: 1/-1;
      }
      .divd i {
        flex: 1;
        border-top: 3px dotted var(--rose);
      }
      .note,
      .empty {
        grid-column: 1/-1;
        text-align: center;
        font-weight: 800;
        color: var(--soft);
      }
      .note {
        background: var(--yellow-bg);
        border: 2px dashed var(--yellow-bd);
        border-radius: 12px;
        padding: 10px;
        color: var(--ink);
        margin: 0 0 4px;
      }
      .foot {
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 34px;
        font:
          600 18px "Fredoka",
          sans-serif;
        text-transform: uppercase;
      }
      .foot button {
        font: inherit;
        color: var(--ink);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 4px;
      }
      .copy {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--soft);
        margin-top: 4px;
      }
      .sp {
        max-width: 560px;
        margin: 26px auto 0;
      }
      .sp .big {
        display: flex;
        justify-content: center;
        margin: 4px 0 14px;
        font-size: 76px;
        line-height: 1;
      }
      .sp .big img {
        height: 110px;
      }
      .sp .title {
        font-size: clamp(26px, 6vw, 44px);
      }
      .sp p {
        margin: 12px 0 18px;
        font-weight: 700;
        color: var(--soft);
      }
      .go {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        margin: 0 0 12px;
        padding: 12px 16px;
        border-radius: 10px;
        border: 3px solid var(--bd);
        background: var(--bg);
        color: var(--ink);
        text-decoration: none;
        text-align: left;
      }
      .go img {
        height: 64px;
        width: 84px;
        object-fit: contain;
        flex: none;
      }
      .go b {
        display: block;
        font:
          600 24px "Fredoka",
          sans-serif;
        text-transform: uppercase;
      }
      .go small {
        font-weight: 700;
        font-size: 14px;
        color: var(--soft);
      }
      .go.off {
        opacity: 0.55;
        pointer-events: none;
        border-style: dashed;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .pill {
        font:
          600 16px "Fredoka",
          sans-serif;
        color: var(--ink);
        background: var(--panel);
        border: 3px solid var(--rose);
        border-radius: 999px;
        padding: 8px 20px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .pill.on {
        background: var(--rose);
        color: #fff;
      }
      .rib {
        display: none;
        position: fixed;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        width: clamp(150px, 27vw, 380px);
      }
      .rib.l {
        left: 0;
      }
      .rib.r {
        right: 0;
      }
      .sd {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        display: none;
      }
      @media (min-width: 1400px) {
        .sd {
          display: block;
        }
      }
      @media (max-width: 899px) {
        .rib {
          display: block;
        }
      }
      dialog {
        border: 3px solid var(--rose);
        border-radius: 14px;
        background: var(--panel);
        color: var(--ink);
        padding: 20px;
        width: min(92vw, 440px);
        font-family: "Nunito", sans-serif;
      }
      dialog::backdrop {
        background: rgba(60, 10, 35, 0.45);
      }
      dialog h3 {
        font:
          600 24px "Fredoka",
          sans-serif;
        margin: 0 0 8px;
      }
      dialog p {
        margin: 0;
        font-weight: 700;
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 800;
        font-size: 14px;
        margin: 10px 0 4px;
      }
      input[type="text"],
      input[type="url"] {
        width: 100%;
        font:
          700 16px "Nunito",
          sans-serif;
        padding: 10px 12px;
        border-radius: 10px;
        border: 2px solid var(--rose);
        background: var(--inp);
        color: var(--ink);
      }
      .picks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .picks button {
        height: 54px;
        border-radius: 10px;
        border: 2px solid var(--rose);
        background: var(--inp);
        padding: 4px;
        cursor: pointer;
      }
      .picks img {
        height: 100%;
        width: 100%;
        object-fit: contain;
      }
      .picks .sel,
      .sw .sel {
        outline: 3px solid var(--ink);
        outline-offset: 1px;
      }
      .sw {
        display: flex;
        gap: 10px;
      }
      .sw button {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--bd);
        background: var(--bg);
        cursor: pointer;
      }
      .dr {
        display: flex;
        gap: 8px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .dr .pill {
        flex: 1;
        padding: 10px 8px;
      }
      .del {
        color: #c62828;
        border-color: #c62828;
      }
      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 959px) {
        .layout {
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        .cards {
          grid-column: 1/-1;
          order: -1;
        }
        .hero {
          grid-template-columns: 1fr;
        }
        .hl,
        .hr {
          position: absolute;
          top: 0;
          padding: 0;
        }
        .hl {
          left: 0;
        }
        .hr {
          right: 0;
        }
        .hl .pn,
        .hl .cp {
          display: none;
        }
        .hl .st {
          height: 40px;
        }
        .hr img {
          height: 64px;
        }
        .ht {
          padding: 0 44px;
        }
      }
      @media (max-width: 639px) {
        .wrap {
          padding: 12px 12px 120px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .cards {
          gap: 10px;
        }
        .card {
          min-height: 158px;
          padding: 10px 6px 8px;
        }
        .card .art img {
          max-height: 70px;
        }
        .card .em {
          font-size: 46px;
        }
        .ham {
          width: 52px;
          height: 44px;
        }
        .ham i {
          width: 24px;
        }
        .avatar {
          width: 46px;
          height: 46px;
        }
        .search {
          height: 42px;
        }
        .tip {
          font-size: 14px;
        }
        .foot {
          font-size: 16px;
          gap: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="hr" viewBox="0 0 40 36">
          <path
            d="M20 33C6 22 2 14 2 9.5 2 5 5.5 2 9.5 2c4 0 7.500 2.500 10.500 7C23 4.500 26.500 2 30.500 2 34.500 2 38 5 38 9.500 38 14 34 22 20 33Z"
            fill="#d9c6f5"
            stroke="#9a7fc0"
            stroke-width="2.500"
          />
          <ellipse
            cx="11"
            cy="10"
            rx="3.500"
            ry="2.200"
            fill="#fff"
            opacity=".8"
          />
        </symbol>
        <symbol id="sk" viewBox="0 0 20 20">
          <path
            d="M10 0c.8 5.500 4.500 9.200 10 10-5.500.8-9.200 4.500-10 10-.8-5.500-4.500-9.200-10-10C5.500 9.200 9.200 5.500 10 0Z"
            fill="#fff"
          />
        </symbol>
      </defs>
    </svg>

    <div class="page">
      <div class="bgfix" id="bgfix"></div>
      <img
        class="sd"
        data-img="pencily"
        alt=""
        style="left: calc(50% - 704px + 38px); top: 350px; height: 116px"
      />
      <img
        class="sd"
        data-img="clip2"
        alt=""
        style="left: calc(50% - 704px + 46px); top: 500px; height: 76px"
      />
      <img
        class="sd"
        data-img="star2"
        alt=""
        style="left: calc(50% - 704px + 1316px); top: 266px; height: 52px"
      />
      <img
        class="sd"
        data-img="pencilb"
        alt=""
        style="left: calc(50% - 704px + 1316px); top: 346px; height: 106px"
      />
      <img
        class="sd"
        data-img="clip3"
        alt=""
        style="left: calc(50% - 704px + 1318px); top: 496px; height: 80px"
      />
      <img class="rib l" data-img="ribL" alt="" /><img
        class="rib r"
        data-img="ribR"
        alt=""
      />

      <div class="wrap">
        <div class="top">
          <button class="ham" id="menuBtn" type="button" aria-label="Menu">
            <i></i><i></i><i></i>
          </button>
          <button class="avatar" id="homeBtn" type="button" aria-label="Home">

      var data = load(),

        pArt = "sci",

      var app = document.getElementById("app"),
        dlg = document.getElementById("dlg"),
        menu = document.getElementById("menu");

      function load() {
        try {
          var r = localStorage.getItem(KEY);
          if (r) {
            var d = JSON.parse(r);
            if (Array.isArray(d)) return d;
          }
        } catch (e) {}
        return JSON.parse(JSON.stringify(DEF));
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(data));
        } catch (e) {}
      }
      function esc(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : s;
        return d.innerHTML;
      }
      function at(s) {
        return esc(s).replace(/"/g, "&quot;");
      }
      function safe(u) {
        return /^https?:\/\//i.test(u) ? u : "";
      }
      function setImgs() {
        document.querySelectorAll("[data-img]").forEach(function (e) {
          e.src = IMG[e.getAttribute("data-img")] || "";
        });
      }
      try {
        var t = localStorage.getItem(TK);
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}

      function render() {
        var m = location.hash.match(/^#s-([a-z0-9]+)$/),
          s =
            m &&
            data.filter(function (x) {
              return x.id === m[1];
            })[0];
        s ? subject(s) : home();
        window.scrollTo(0, 0);
      }
      function artHtml(s) {
        return s.emoji
          ? '<span class="em">' + esc(s.emoji) + "</span>"
          : '<img src="' + (IMG[s.art] || IMG.sci) + '" alt="">';
      }
      function home() {
        var q = qv.trim().toLowerCase();
        var list = data.filter(function (s) {
          return (
            !q || (s.label + " " + s.caption).toLowerCase().indexOf(q) > -1
          );
        });
        var cards = list
          .map(function (s) {
            return (
              '<a class="card c-' +
              at(s.color) +
              '" href="#s-' +
              at(s.id) +
              '" data-id="' +
              at(s.id) +
              '"><b>' +
              esc(s.label) +
              '</b><span class="art">' +
              artHtml(s) +
              "</span><small>" +
              esc(s.caption) +
              "</small>" +
              (editing ? '<span class="ed">✏️ tap to edit</span>' : "") +
              "</a>"
            );
          })
          .join("");
        if (editing && !q)
          cards +=
            '<a class="card add" href="#" data-add="1"><b>Add subject</b><span class="art"><span class="em">➕</span></span><small>New reviewer</small></a>';
        if (!list.length && !editing)
          cards =
            '<p class="empty">' +
            (q
              ? "No subject found. Try another word!"
              : "No subjects yet. Open the menu and tap Edit mode to add one!") +
            "</p>";
        app.innerHTML =
          '<div class="layout">' +
          '<div class="panel"><h2>Start your study adventure!</h2><p>Pick a subject, read your reviewer, then test yourself with a mock exam. You’ve got this!</p><img class="bk" src="' +
          IMG.books +
          '" alt=""></div>' +
          '<div class="cards">' +
          (editing
            ? '<p class="note">Edit mode: tap a card to change it ✨</p>'
            : "") +
          cards +
          '<div class="divd"><i></i>♥<i></i></div></div>' +
          '<div class="panel tp"><h2>Study tips &amp; tricks</h2><div class="tips">' +
          '<div class="tip"><img src="' +
          IMG.clock +
          '" alt=""><span>Short sessions beat cramming. Watch the clock!</span></div>' +
          '<div class="tip"><span>Keep your notes and folders tidy.</span><img src="' +
          IMG.folder +
          '" alt=""></div>' +
          '<div class="tip"><img src="' +
          IMG.tubeL +
          '" alt=""><span>Review first, then Challenge Me!</span><img src="' +
          IMG.tubeR +
          '" alt=""></div></div></div></div>';
      }
      function subject(s) {
        function go(url, img, name, desc, cls) {
          var u = safe(url);
          return (
            '<a class="go ' +
            cls +
            (u ? "" : " off") +
            '" ' +
            (u ? 'href="' + at(u) + '" target="_blank" rel="noopener"' : "") +
            '><img src="' +
            IMG[img] +
            '" alt=""><span><b>' +
            name +
            "</b><small>" +
            (u ? desc : "Link coming soon") +
            "</small></span></a>"
          );
        }
        app.innerHTML =
          '<div class="sp"><div class="panel"><div class="big">' +
          (s.emoji
            ? esc(s.emoji)
            : '<img src="' + (IMG[s.art] || IMG.sci) + '" alt="">') +
          "</div>" +
          '<h1 class="title" data-t="' +
          at(s.label) +
          '"><span>' +
          esc(s.label) +
          "</span></h1><p>What do you want to do?</p>" +
          go(
            s.review,
            "books",
            "Review",
            "Read the reviewer and study",
            "c-blue",
          ) +
          go(
            s.challenge,
            "clock",
            "Challenge Me",
            "Take the mock test or exam",
            "c-yellow",
          ) +
          '<div class="row"><a class="pill" href="#">← Back</a><button class="pill" type="button" data-edit="' +
          at(s.id) +
          '">✏️ Edit this</button></div></div></div>';
      }
      function drawPicks() {
        var p = document.getElementById("picks");
        p.innerHTML = "";
        ARTS.forEach(function (a) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = a === pArt ? "sel" : "";
          b.innerHTML = '<img src="' + IMG[a] + '" alt="' + a + '">';
          b.onclick = function () {
            pArt = a;
            drawPicks();
          };
          p.appendChild(b);
        });
        var h = document.getElementById("sw");
        h.innerHTML = "";
        COLORS.forEach(function (c) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "c-" + c + (c === pick ? " sel" : "");
          b.setAttribute("aria-label", c);
          b.onclick = function () {
            pick = c;
            drawPicks();
          };
          h.appendChild(b);
        });
      }
      function openEdit(id) {
        cur = id;
        var s =
          id === "new"
            ? {
                label: "",
                caption: "",
                art: "sci",
                emoji: "",
                color: "pink",
                review: "",
                challenge: "",
              }
            : data.filter(function (x) {
                return x.id === id;
              })[0];
        if (!s) return;
        document.getElementById("dTitle").textContent =
          id === "new" ? "Add a subject" : "Edit subject";
        document.getElementById("fLabel").value = s.label;
        document.getElementById("fCap").value = s.caption || "";
        document.getElementById("fEmoji").value = s.emoji || "";
        document.getElementById("fReview").value = s.review;
        document.getElementById("fChal").value = s.challenge;
        document.getElementById("bDel").hidden = id === "new";
        pick = s.color;
        pArt = s.art || "sci";
        drawPicks();
        dlg.showModal();
      }
      function fix(v) {
        v = v.trim();
        if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
        return v;
      }
      document.getElementById("bSave").onclick = function () {
        var l = document.getElementById("fLabel").value.trim();
        if (!l) {
          document.getElementById("fLabel").focus();
          return;
        }
        var o = {
          label: l,
          caption: document.getElementById("fCap").value.trim(),
          emoji: document.getElementById("fEmoji").value.trim(),
          art: pArt,
          color: pick,
          review: fix(document.getElementById("fReview").value),
          challenge: fix(document.getElementById("fChal").value),
        };
        if (cur === "new") {
          o.id = Date.now().toString(36);
          data.push(o);
        } else
          data = data.map(function (x) {
            return x.id === cur ? Object.assign({}, x, o) : x;
          });
        save();
        dlg.close();
        render();
      };
      document.getElementById("bCancel").onclick = function () {
        dlg.close();
      };
      document.getElementById("bDel").onclick = function () {
        if (confirm("Delete this subject?")) {
          data = data.filter(function (x) {
            return x.id !== cur;
          });
          save();
          dlg.close();
          location.hash = "";
          render();
        }
      };
      document.getElementById("menuBtn").onclick = function (e) {
        e.stopPropagation();
        menu.hidden = !menu.hidden;
      };
      document.addEventListener("click", function () {
        menu.hidden = true;
      });
      menu.addEventListener("click", function (e) {
        var m = e.target.getAttribute("data-m");
        if (!m) return;
        if (m === "home") {
          qv = "";
          document.getElementById("q").value = "";
          location.hash = "";
          render();
        }
        if (m === "edit") {
          editing = !editing;
          e.target.textContent = editing ? "✅ Done editing" : "✏️ Edit mode";
          location.hash = "";
          render();
        }
        if (m === "add") {
          openEdit("new");
        }
        if (m === "theme") {
          var h = document.documentElement,
            n = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
          h.setAttribute("data-theme", n);
          try {
            localStorage.setItem(TK, n);
          } catch (x) {}
        }
      });
      document.getElementById("homeBtn").onclick = function () {
        location.hash = "";
        render();
      };
      document.getElementById("q").addEventListener("input", function (e) {
        qv = e.target.value;
        if (location.hash) {
          location.hash = "";
        } else home();
      });
      document.querySelectorAll("[data-i]").forEach(function (b) {
        b.onclick = function () {
          var i = INFO[b.getAttribute("data-i")];
          document.getElementById("iT").textContent = i[0];
          document.getElementById("iP").textContent = i[1];
          document.getElementById("info").showModal();
        };
      });
      document.getElementById("iX").onclick = function () {
        document.getElementById("info").close();
      };
      app.addEventListener("click", function (e) {
        var ed = e.target.closest("[data-edit]");
        if (ed) {
          openEdit(ed.getAttribute("data-edit"));
          return;
        }
        var ad = e.target.closest("[data-add]");
        if (ad) {
          e.preventDefault();
          openEdit("new");
          return;
        }
        var c = e.target.closest(".card[data-id]");
        if (c && editing) {
          e.preventDefault();
          openEdit(c.getAttribute("data-id"));
        }
      });
      window.addEventListener("hashchange", render);
      setImgs();
      document.getElementById("bgfix").style.backgroundImage =
        "url(" + IMG.bg + ")";
      render();
    </script>
  </body>
</html>
